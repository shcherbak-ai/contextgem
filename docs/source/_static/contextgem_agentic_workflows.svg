  <g transform="translate(594 197) scale(2)" shape-rendering="crispEdges"><path fill="#0e74bc" d="M10 1h3v1h-3zM10 2h4v1h-4zM10 3h5v1h-5zM5 4h5v1h-5zM6 5h3v1h-3zM6 6h3v1h-3zM6 7h3v1h-3zM6 8h3v1h-3zM7 9h1v1h-1zM7 10h1v1h-1zM7 11h1v1h-1z"/><path fill="#a5ebff" d="M3 0h9v1h-9zM2 1h1v1h-1zM4 1h1v1h-1zM7 1h1v1h-1zM1 2h1v1h-1zM3 2h2v1h-2zM6 2h3v1h-3zM0 3h10v1h-10z"/><path fill="#38bdf8" d="M5 1h2v1h-2zM8 1h2v1h-2zM5 2h1v1h-1zM9 2h1v1h-1zM0 4h5v1h-5zM1 5h5v1h-5zM2 6h4v1h-4zM3 7h3v1h-3zM4 8h2v1h-2zM5 9h2v1h-2zM6 10h1v1h-1z"/><path fill="#0c4a8c" d="M10 4h5v1h-5zM9 5h5v1h-5zM9 6h4v1h-4zM9 7h3v1h-3zM9 8h2v1h-2zM8 9h2v1h-2zM8 10h1v1h-1z"/><path fill="#0b3a6c" d="M15 4h1v1h-1zM14 5h2v1h-2zM13 6h2v1h-2zM12 7h2v1h-2zM11 8h2v1h-2zM10 9h2v1h-2zM9 10h2v1h-2zM8 11h2v1h-2zM8 12h1v1h-1z"/><path fill="#ffffff" d="M3 1h1v1h-1zM2 2h1v1h-1z"/></g>
