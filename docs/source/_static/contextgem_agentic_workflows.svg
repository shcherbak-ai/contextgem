<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 832 316" width="832" height="316" role="img" aria-labelledby="title desc" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace" font-size="13">
  <title id="title">ContextGem in an agentic workflow - at ingestion, in a tool and at a decision point</title>
  <desc id="desc">A map of an agentic workflow with the three places where ContextGem runs. At ingestion, a new document goes to ContextGem, which extracts its metadata into the search index or database; the agent finds documents there by their metadata. In a tool, the agent, which gets a task or a question, calls ContextGem, which returns values with their sources. At a decision point, the agent's workflow asks ContextGem a closed question: a clear answer is acted on, an unclear one goes to a person.</desc>

  <!-- The run, played once: a new document goes through ingestion into the store, the agent gets a task, calls the tool and gets the result, and the workflow decides its next step. The drawing as it stands is where the run ends: each route fades in once its trace has run along it, the traces show only while they play, and without motion it is all there -->
  <style>
    .in { animation: show 0.35s ease-out backwards; }
    @keyframes show { from { opacity: 0; } }
    .grow { transform-box: fill-box; transform-origin: left center; animation: grow 0.7s cubic-bezier(0.2, 0.7, 0.2, 1) backwards; }
    @keyframes grow { from { transform: scaleX(0); } }
    .light { animation: light 0.4s ease-out backwards; }
    @keyframes light { from { fill: #6b7280; } }
    .trace { opacity: 0; stroke-dasharray: 1; animation: trace 0.7s ease-in-out; }
    @keyframes trace {
      0% { opacity: 1; stroke-dashoffset: 1; }
      60% { opacity: 1; stroke-dashoffset: 0; }
      100% { opacity: 0; stroke-dashoffset: 0; }
    }
    .lit { opacity: 0; animation: lit 0.8s ease-out; }
    @keyframes lit { 0%, 100% { opacity: 0; } 30% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>


  <!-- A ground of its own, so that the picture reads the same in the light
       and the dark theme: a window, with what it shows on its tab -->
  <path d="M0.5 28.5H831.5V315.5H0.5Z" fill="#111113" stroke="#2c2c30"/>
  <path d="M0.5 29V0.5H148.5V29" fill="#111113" stroke="#2c2c30"/>
  <path d="M1 28.5H148" stroke="#111113"/>
  <text x="16" y="18.5" font-size="11" fill="#9ca3af">agentic workflow</text>


  <!-- The parts of the workflow. The gem marks where ContextGem runs -->
  <path d="M28.5 72.5H251.5V123.5H28.5Z" fill="none" stroke="#ffffff" stroke-opacity="0.2"/>
  <text x="44" y="95" fill="#f3f4f6">New document</text>
  <text x="44" y="112" font-size="11" fill="#6b7280">a contract, a report, …</text>
