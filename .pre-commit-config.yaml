# A hook without stages of its own runs at the commit, not again at the
# commit-msg stage, where the package build and the README update would repeat.
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # v6.0.0
    hooks:
      # Not on what goes into the requests that the VCR cassettes match byte
      # for byte (the prompt templates of the package, the test documents, the
      # usage examples, the evaluation cases), nor on the signed contributor
      # agreements, which are kept verbatim.
      - id: trailing-whitespace
        exclude: ^(contextgem|tests|dev/usage_examples|dev/evals|\.github/contributors)/
      - id: end-of-file-fixer
        exclude: ^(contextgem|tests|dev/usage_examples|dev/evals|\.github/contributors)/
      - id: check-yaml
      - id: check-toml

  # These run from the project environment: uv.lock is their only version pin.
  - repo: local
    hooks:
      # Not on the usage examples, which the documentation shows.
      - id: add-file-headers
        name: add SPDX file headers
        entry: uv run python dev/add_file_headers.py
        language: system
        types: [python]
        exclude: ^dev/usage_examples/

      # The description is the page's line in llms.txt and its meta description.
      - id: docs-page-description
        name: docs pages have a meta description
        entry: '^\.\. meta::\n   :description: \S'
        language: pygrep
        args: [--multiline, --negate]
        files: ^docs/source/.*\.rst$

      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --force-exclude --fix
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true

      - id: bandit
        name: bandit (contextgem)
        entry: uv run bandit -r contextgem
        language: system
        types: [python]
        pass_filenames: false

      - id: bandit
        name: bandit (tests/dev)
        entry: uv run bandit -r tests dev --skip B101
        language: system
        types: [python]
        pass_filenames: false

      - id: ty
        name: ty
        entry: uv run ty check
        language: system
        types: [python]
        pass_filenames: false

      - id: interrogate
        name: interrogate
        entry: uv run interrogate
        language: system
        types: [python]
        pass_filenames: false

      # Imports against declared dependencies, so a change to either runs it.
      - id: deptry
        name: deptry
        entry: uv run deptry .
        language: system
        types_or: [python, toml]
        pass_filenames: false

      - id: uv-lock
        name: uv lock check
        entry: uv lock --check
        language: system
        pass_filenames: false

      - id: update-readme
        name: Update README.md
        entry: uv run python dev/populate_project_readme.py
        language: system
        pass_filenames: false
        always_run: true

      - id: package-check
        name: package check (uv build + twine check)
        entry: uv run python dev/check_package.py
        language: system
        pass_filenames: false
        always_run: true

      - id: commitizen
        name: commitizen check
        entry: uv run cz check --allow-abort --commit-msg-file
        language: system
        stages: [commit-msg]

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: 5387279b3b4c24822c0f86d4df4f28b37e3e8992  # v0.21.0
    hooks:
      - id: markdownlint-cli2
