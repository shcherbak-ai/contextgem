- request:
    body: "{\"messages\":[{\"role\":\"system\",\"content\":\"<introduction>\\nYou
      will be assigned tasks involving the extraction, analysis, and interpretation
      of data within various types of documents. Your role is to carefully process
      the information and provide accurate, relevant outputs based on the specific
      instructions provided.\\n</introduction>\\n\\n<guidance_on_instruction_structure>\\nAll
      instructions you receive will be organized using semantic XML tags for clarity
      and structure. Each section will be properly tagged to indicate its purpose
      and content type, making it easier to understand the task requirements and expected
      outputs.\\n</guidance_on_instruction_structure>\\n\\n<key_terminology>\\nKEY
      TERMINOLOGY TO UNDERSTAND:\\n\\n  <document_definition>\\n  1. Document: A structured
      or unstructured file containing written or visual content. Documents can vary
      in type and purpose, including but not limited to:\\n    <document_types>\\n
      \   - Contracts: Legal agreements defining terms and obligations.\\n    - Invoices:
      Financial documents detailing transactions and payments.\\n    - Curricula Vitae
      (CVs): Resumes outlining an individual's professional experience and qualifications.\\n
      \   - Visual Documents: Images, scanned documents, blueprints, photographs,
      charts, diagrams, or screenshots that contain relevant information.\\n    -
      General Documents: Any other types of files that may contain text, tables, images,
      or mixed formats.\\n    </document_types>\\n  \\n  Note that occasionally you
      may be working with document fragments rather than complete documents. These
      fragments represent portions of a larger document and should be analyzed within
      their limited context. When working with fragments, focus on extracting information
      from the available content without making assumptions about missing parts.\\n\\n
      \   <content_types>\\n    Documents may contain textual or visual content:\\n
      \   - Text-based content: Written information that can be directly read and
      processed.\\n    - Visual content: Images, charts, diagrams, blueprints, tables,
      handwritten text, or other visual elements that require visual interpretation.\\n
      \   </content_types>\\n  </document_definition>\\n\\n  <aspect_definition>\\n
      \ 2. Aspect: A defined area or topic within a document that requires focused
      attention. Each aspect corresponds to a specific subject or theme described
      in the task. For example:\\n    <aspect_examples>\\n    - Contract Aspects:
      Payment terms, parties involved, or termination clauses.\\n    - Invoice Aspects:
      Due dates, line-item breakdowns, or tax details.\\n    - CV Aspects: Work experience,
      education, or skills.\\n    </aspect_examples>\\n  You will analyze aspects
      as instructed, considering their relevance and context within the document.\\n
      \ </aspect_definition>\\n\\n  <concept_definition>\\n  3. Concept: A unit of
      information or an entity relevant to the task. Concepts may be derived from
      an aspect or the broader document context. They represent a wide range of data
      points and insights, from simple entities (names, dates, monetary values) to
      complex evaluations, conclusions, and answers to specific questions. Concepts
      can be:\\n    <concept_types>\\n    - Factual extractions: Such as a penalty
      clause in a contract, a total amount due in an invoice, or a certification in
      a CV.\\n    - Analytical insights: Such as risk assessments, compliance evaluations,
      or pattern identifications.\\n    - Reasoned conclusions: Such as determining
      whether a document meets specific criteria or answers particular questions.\\n
      \   - Interpretative judgments: Such as ratings, classifications, or qualitative
      assessments based on document content.\\n    - Label classifications: Content
      categorization using predefined labels.\\n    </concept_types>\\n  </concept_definition>\\n\\n</key_terminology>\\n\\n<critical_guidelines>\\nCRITICAL
      GUIDELINES FOR YOUR WORK:\\n\\n  <precision_and_accuracy>\\n  - Precision and
      accuracy: Extract only information that is explicitly stated or can be directly
      inferred from the document content. Avoid speculation or assumptions beyond
      what the document content clearly supports.\\n  </precision_and_accuracy>\\n\\n
      \ <visual_content_analysis>\\n  - Visual content analysis: When processing visual
      content (images):\\n    -- Examine all visual elements carefully, including
      text within images, charts, diagrams, logos, layout structures, etc.\\n    --
      Identify and analyze visual patterns, relationships, and structural information
      that may not be explicitly stated in text.\\n    -- Consider the visual context
      and layout as it may provide important semantic information.\\n    -- Analyze
      information in tables, forms, charts, and diagrams with attention to their visual
      structure and relationships.\\n  </visual_content_analysis>\\n\\n  <contextual_understanding>\\n
      \ - Contextual understanding: Consider the full context when performing extractions.
      A single paragraph or sentence may have different meanings depending on surrounding
      content, document type, and domain-specific terminology.\\n  </contextual_understanding>\\n\\n
      \ <systematic_analysis>\\n  - Systematic analysis: Before extracting, thoroughly
      understand:\\n    -- The nature and type of the document\\n    -- The specific
      aspects or concepts you need to focus on\\n    -- The expected output format
      and structure requirements\\n    -- Any constraints or special handling instructions\\n
      \ </systematic_analysis>\\n\\n  <quality_control>\\n  - Quality control: After
      extraction, verify that:\\n    -- All extracted information directly relates
      to the specified aspects/concepts\\n    -- The output format matches the required
      schema exactly\\n    -- No extraneous information has been included\\n    --
      All mandatory fields are present and correctly populated\\n  </quality_control>\\n\\n
      \ <conservative_approach>\\n  - Conservative approach: When in doubt about whether
      information qualifies for extraction:\\n    -- If the relevance is unclear,
      err on the side of exclusion\\n    -- If multiple interpretations are possible,
      choose the most conservative one\\n    -- If information is ambiguous, do not
      force an extraction\\n  </conservative_approach>\\n\\n  <structured_output_compliance>\\n
      \ - Structured output compliance: Adhere strictly to the specified JSON format
      requirements. Do not:\\n    -- Add extra fields beyond what is requested\\n
      \   -- Modify the structure or field names\\n    -- Include explanatory text
      outside the JSON structure\\n    -- Use code blocks or formatting markers unless
      explicitly required\\n  </structured_output_compliance>\\n\\n</critical_guidelines>\\n\\n<expected_deliverables>\\nEXPECTED
      DELIVERABLES:\\n  <deliverable_types>\\n  - Structured outputs: Clearly formatted
      and well-organized results based on the task requirements.\\n  - Explanations
      (when required): When required by the instructions, include justifications or
      reasoning for your interpretations.\\n  - Insights (when required): When required
      by the instructions, highlight trends, patterns, or noteworthy findings that
      could add value to the task.\\n  - References (when required): When required
      by the instructions, output references based on which you extracted data, provided
      insights, or made conclusions during the task.\\n  </deliverable_types>\\n</expected_deliverables>\\n\\n\\n<conclusion>\\nBy
      adhering to this framework, you will ensure consistent and high-quality performance
      across diverse document analysis tasks.\\n</conclusion>\"},{\"role\":\"user\",\"content\":\"<introduction>\\nBelow
      you will find a list of consecutively ordered paragraphs from a document and
      a list of aspects.\\n</introduction>\\n\\n<guidance_on_task_structure>\\nAll
      structured information in these instructions is provided using semantic XML
      tags. Field names correspond directly to tag names (e.g., aspect_name, additional_context,
      etc.).\\n</guidance_on_task_structure>\\n\\n<private_reasoning>\\nUse private
      deliberation to plan, evaluate evidence, and verify decisions. Do not reveal
      any intermediate analysis, notes, or steps. Only output the JSON specified within
      <answer_format></answer_format> tags.\\n\\nFollow this internal three-stage
      process:\\n\\n1. Plan\\n    - Internally restate each aspect in one sentence.\\n
      \   - List 3-5 concrete lexical/semantic cues for relevance, including indicators
      of prohibition, requirement, exception, conditionals, and negations.\\n    -
      Define internal inclusion/exclusion criteria for borderline matches.\\n\\n2.
      Evidence triage\\n    - For each paragraph and sentence, generate candidate
      matches to aspects.\\n    - Collect minimal sufficient textual evidence privately
      and note negation, hypothetical, or conditional forms.\\n    - Prefer precision
      over recall; include only high-confidence matches and omit weak or ambiguous
      ones.\\n\\n3. Consistency pass\\n   - Deduplicate paragraph IDs and sentence
      IDs within each aspect and preserve the original order.\\n\\nNever disclose
      any plan, evidence, or internal notes - only the JSON array defined within <answer_format></answer_format>
      tags.\\n</private_reasoning>\\n\\n<task_description>\\nYour task is to:\\n\\n1.
      Read and understand the aspects\\n    - Each aspect is identified by an Aspect
      ID (for example, \\\"A0\\\", \\\"A1\\\", etc.) specified within <aspect_id></aspect_id>
      tags, includes a name specified within <aspect_name></aspect_name> tags, and
      has a description specified within <aspect_description></aspect_description>
      tags.\\n    - Aspects describe themes, topics, or criteria that might be addressed
      in the paragraphs.\\n\\n2. Examine each paragraph and its sentences\\n    -
      Each paragraph is given within <paragraph></paragraph> tags, whose id attribute
      holds its paragraph ID (for example, \\\"P0\\\", \\\"P1\\\", etc.).\\n    -
      Each paragraph includes sentences, each given with its full text within <sentence></sentence>
      tags, whose id attribute holds its sentence ID (for example, \\\"P0-S0\\\",
      \\\"P0-S1\\\", etc.).\\n    - Note that paragraphs are listed in the same order
      they appear in the original document; therefore, context from surrounding paragraphs
      may influence whether a particular paragraph is relevant to an aspect.\\n    -
      You may be working with document fragments rather than complete documents. Focus
      on extracting information from the available content without making assumptions
      about missing parts.\\n\\n3. Map paragraphs and their sentences to aspects\\n
      \   - A paragraph can address one, multiple, or none of the aspects.\\n    -
      A sentence within the paragraph can address one, multiple, or none of the aspects.\\n
      \   - If a paragraph clearly relates to an aspect (based on the aspect's name
      and description), include the paragraph's ID and the IDs of all the sentences
      within the paragraph that address or relate to the aspect.\\n    - If a paragraph
      does not relate to an aspect, do not include it under that aspect's list.\\n
      \   - Apply cross-paragraph reasoning when needed (e.g., headings, lists, references
      like \\\"above\\\", \\\"this section\\\"): use surrounding context to disambiguate;
      if unresolved, omit.\\n    - Treat negations, exceptions, and conditionals carefully:
      relevance can be present in prohibitions or restrictions.\\n    - Prefer minimal
      sufficient evidence:\\n        -- include only the sentences necessary to support
      the mapping; avoid unrelated sentences.\\n    - Favor precision over recall;
      when uncertain, exclude rather than speculate.\\n\\n4. Produce the final answer
      in the JSON format specified within <answer_format></answer_format> tags\\n
      \   - Your output must be a JSON array of objects, each object corresponding
      to a single aspect.\\n    - For each aspect (in the order they are provided),
      include:\\n        -- aspect_id: The aspect's unique identifier, e.g., \\\"A0\\\".\\n
      \       -- paragraphs: An array of objects for each paragraph that addresses
      or relates to the aspect. Each object should include:\\n            --- paragraph_id:
      The provided paragraph ID, e.g., \\\"P0\\\", \\\"P2\\\".\\n            --- sentences:
      An array of objects for each relevant sentence within the paragraph. Each object
      should include:\\n                ---- sentence_id: The provided ID of the sentence,
      e.g., \\\"P0-S0\\\", \\\"P0-S2\\\".\\n        -- If an aspect has no related
      paragraphs, still include it with an empty paragraph_ids array ([]).\\n- Do
      not add extra commentary, code block markers, or any other formatting beyond
      the JSON array.\\n- Internally verify before finalizing:\\n    -- Each provided
      aspect appears once, in order, with the correct \\\"aspect_id\\\".\\n    --
      Each object in \\\"paragraphs\\\" contains only valid \\\"paragraph_id\\\" with
      valid \\\"sentences\\\".\\n    -- The structure exactly matches the format specified
      within <answer_format></answer_format> tags (no extra keys or commentary).\\n</task_description>\\n\\n<output_constraints>\\n-
      No additional text:\\n    -- Do not include any headers, explanations, or text
      outside of the JSON array.\\n    -- Do not wrap your JSON response in backticks
      or any other formatting characters.\\n- Private deliberation only:\\n    --
      Do not output any analysis, plan, scratchpad, thoughts, or chain-of-thought.\\n
      \   -- Only output the JSON array according to the format specified within <answer_format></answer_format>
      tags.\\n</output_constraints>\\n\\n<answer_format>\\nANSWER FORMAT (MANDATORY):\\n[\\n
      \   {\\n        \\\"aspect_id\\\": str,\\n        \\\"paragraphs\\\": [\\n            {\\n
      \               \\\"paragraph_id\\\": str,\\n                \\\"sentences\\\":
      [\\n                    {\\n                        \\\"sentence_id\\\": str,\\n
      \                   },\\n                    ...\\n                ]\\n            },\\n
      \           ...\\n        ]\\n    },\\n    ...\\n]\\n</answer_format>\\n\\n<aspects>\\nDOCUMENT
      ASPECTS:\\n    <aspect id=\\\"A0\\\">\\n        <aspect_id>A0</aspect_id>\\n
      \       \\n        <aspect_name>Liability</aspect_name>\\n        \\n        <aspect_description>\\n
      \       Liability\\n        </aspect_description>\\n    </aspect>\\n\\n</aspects>\\n\\n<document_paragraphs>\\nDOCUMENT
      PARAGRAPHS INCLUDING SENTENCES:\\n<paragraph id=\\\"P0\\\">\\n<sentence id=\\\"P0-S0\\\">Non-Disclosure
      Agreement (NDA)</sentence>\\n</paragraph>\\n<paragraph id=\\\"P1\\\">\\n<sentence
      id=\\\"P1-S0\\\">This Non-Disclosure Agreement (the \\\"Agreement\\\") is made
      and entered into as of July 16, 2024, by and between:</sentence>\\n</paragraph>\\n<paragraph
      id=\\\"P2\\\">\\n<sentence id=\\\"P2-S0\\\">Party A:</sentence>\\n</paragraph>\\n<paragraph
      id=\\\"P3\\\">\\n<sentence id=\\\"P3-S0\\\">_____</sentence>\\n</paragraph>\\n<paragraph
      id=\\\"P4\\\">\\n<sentence id=\\\"P4-S0\\\">_____</sentence>\\n</paragraph>\\n<paragraph
      id=\\\"P5\\\">\\n<sentence id=\\\"P5-S0\\\">_____</sentence>\\n</paragraph>\\n<paragraph
      id=\\\"P6\\\">\\n<sentence id=\\\"P6-S0\\\">Contact: _____</sentence>\\n</paragraph>\\n<paragraph
      id=\\\"P7\\\">\\n<sentence id=\\\"P7-S0\\\">Phone: _____</sentence>\\n</paragraph>\\n<paragraph
      id=\\\"P8\\\">\\n<sentence id=\\\"P8-S0\\\">Email: _____</sentence>\\n</paragraph>\\n<paragraph
      id=\\\"P9\\\">\\n<sentence id=\\\"P9-S0\\\">Party B:</sentence>\\n</paragraph>\\n<paragraph
      id=\\\"P10\\\">\\n<sentence id=\\\"P10-S0\\\">Example.Com LLC</sentence>\\n</paragraph>\\n<paragraph
      id=\\\"P11\\\">\\n<sentence id=\\\"P11-S0\\\">5678 Random Drive</sentence>\\n</paragraph>\\n<paragraph
      id=\\\"P12\\\">\\n<sentence id=\\\"P12-S0\\\">New York, NY 00000</sentence>\\n</paragraph>\\n<paragraph
      id=\\\"P13\\\">\\n<sentence id=\\\"P13-S0\\\">Contact: Jane Doe, Managing Partner</sentence>\\n</paragraph>\\n<paragraph
      id=\\\"P14\\\">\\n<sentence id=\\\"P14-S0\\\">Phone: (012) 345-6789</sentence>\\n</paragraph>\\n<paragraph
      id=\\\"P15\\\">\\n<sentence id=\\\"P15-S0\\\">Email: jane.doe@example.com</sentence>\\n</paragraph>\\n<paragraph
      id=\\\"P16\\\">\\n<sentence id=\\\"P16-S0\\\">1. Purpose:</sentence>\\n</paragraph>\\n<paragraph
      id=\\\"P17\\\">\\n<sentence id=\\\"P17-S0\\\">The purpose of this Agreement
      is to protect the confidential information that may be disclosed between the
      parties during discussions and engagements regarding potential business collaborations
      and partnerships.</sentence>\\n</paragraph>\\n<paragraph id=\\\"P18\\\">\\n<sentence
      id=\\\"P18-S0\\\">2. Definition of Confidential Information:</sentence>\\n</paragraph>\\n<paragraph
      id=\\\"P19\\\">\\n<sentence id=\\\"P19-S0\\\">For purposes of this Agreement,
      \\\"Confidential Information\\\" means any and all non-public information, conveyed
      in all forms, whether in oral, written, electronic, or other form or media,
      whether or not marked, designated, or otherwise identified as \\\"confidential,\\\"
      that has been or may be disclosed to, accessed by, or observed by Receiving
      Party, which (i) has actual or potential economic value by virtue of not being
      generally known to, and not being readily ascertainable by proper means by,
      other persons who can obtain economic value from its disclosure or use, or (ii)
      is subject to reasonable efforts by Disclosing Party to maintain its secrecy
      and confidentiality.</sentence>\\n</paragraph>\\n<paragraph id=\\\"P20\\\">\\n<sentence
      id=\\\"P20-S0\\\">Confidential Information includes, but is not limited to,
      the following categories: (1) business information (business plans, strategies,
      and models), (2) technical information (technical specifications and documentation,
      research and development activities), (3) customer and market information (customer
      lists and contact information, sales histories and patterns), (4) personnel
      and internal information (employee lists and contact information, employment
      agreements and personnel files), (5) intellectual property (trade secrets and
      know-how, patents and patent applications, copyrights and copyright applications,
      trademarks and trademark applications), (6) strategic information (merger and
      acquisition plans, competitive analyses and strategies).</sentence>\\n<sentence
      id=\\\"P20-S1\\\">Software code shall also be included into the confidential
      information.</sentence>\\n</paragraph>\\n<paragraph id=\\\"P21\\\">\\n<sentence
      id=\\\"P21-S0\\\">Confidential Information shall not include information that:</sentence>\\n<sentence
      id=\\\"P21-S1\\\">(a) is or becomes generally available to the public other
      than as a result of disclosure by Receiving Party or its Representatives;</sentence>\\n<sentence
      id=\\\"P21-S2\\\">(b) was available to Receiving Party on a non-confidential
      basis prior to its disclosure by Disclosing Party;</sentence>\\n<sentence id=\\\"P21-S3\\\">(c)
      becomes available to Receiving Party on a non-confidential basis from a person
      other than Disclosing Party who is not otherwise bound by a confidentiality
      obligation to Disclosing Party; or (d) was independently developed by Receiving
      Party without reference to or use of any Confidential Information.</sentence>\\n<sentence
      id=\\\"P21-S4\\\">The name of the dog of the Receiving Party is Bob.</sentence>\\n</paragraph>\\n<paragraph
      id=\\\"P22\\\">\\n<sentence id=\\\"P22-S0\\\">The designation of information
      as Confidential Information shall not be determinative of whether such information
      constitutes a trade secret under applicable law.</sentence>\\n<sentence id=\\\"P22-S1\\\">All
      Confidential Information shall remain the exclusive property of Disclosing Party,
      and Receiving Party shall have no rights, by license or otherwise, to use the
      Confidential Information except as expressly provided herein.</sentence>\\n</paragraph>\\n<paragraph
      id=\\\"P23\\\">\\n<sentence id=\\\"P23-S0\\\">3. Obligations of Receiving Party:</sentence>\\n</paragraph>\\n<paragraph
      id=\\\"P24\\\">\\n<sentence id=\\\"P24-S0\\\">The party receiving Confidential
      Information (\\\"Receiving Party\\\") shall:</sentence>\\n</paragraph>\\n<paragraph
      id=\\\"P25\\\">\\n<sentence id=\\\"P25-S0\\\">a. Maintain the confidentiality
      of the Confidential Information and not disclose it to any third party without
      the prior written consent of the Disclosing Party.</sentence>\\n</paragraph>\\n<paragraph
      id=\\\"P26\\\">\\n<sentence id=\\\"P26-S0\\\">b. Use the Confidential Information
      solely for the purpose of evaluating or engaging in the potential business collaboration.</sentence>\\n</paragraph>\\n<paragraph
      id=\\\"P27\\\">\\n<sentence id=\\\"P27-S0\\\">c. Take all necessary precautions
      to protect the confidentiality of the Confidential Information, which shall
      be no less than the precautions it takes to protect its own confidential information.</sentence>\\n</paragraph>\\n<paragraph
      id=\\\"P28\\\">\\n<sentence id=\\\"P28-S0\\\">4. Exclusions from Confidential
      Information:</sentence>\\n</paragraph>\\n<paragraph id=\\\"P29\\\">\\n<sentence
      id=\\\"P29-S0\\\">Confidential Information does not include information that:</sentence>\\n</paragraph>\\n<paragraph
      id=\\\"P30\\\">\\n<sentence id=\\\"P30-S0\\\">a. Is or becomes publicly known
      through no wrongful act of the Receiving Party.</sentence>\\n</paragraph>\\n<paragraph
      id=\\\"P31\\\">\\n<sentence id=\\\"P31-S0\\\">b. Is already known to the Receiving
      Party at the time of disclosure.</sentence>\\n</paragraph>\\n<paragraph id=\\\"P32\\\">\\n<sentence
      id=\\\"P32-S0\\\">c. Is lawfully received from a third party without breach
      of this Agreement.</sentence>\\n</paragraph>\\n<paragraph id=\\\"P33\\\">\\n<sentence
      id=\\\"P33-S0\\\">d. Is independently developed by the Receiving Party without
      use of or reference to the Disclosing Party's Confidential Information.</sentence>\\n</paragraph>\\n<paragraph
      id=\\\"P34\\\">\\n<sentence id=\\\"P34-S0\\\">6. Return of Materials:</sentence>\\n</paragraph>\\n<paragraph
      id=\\\"P35\\\">\\n<sentence id=\\\"P35-S0\\\">Upon termination of this Agreement
      or upon request, the Receiving Party shall return all materials containing Confidential
      Information to the Disclosing Party or destroy them, at the Disclosing Party's
      discretion.</sentence>\\n</paragraph>\\n<paragraph id=\\\"P36\\\">\\n<sentence
      id=\\\"P36-S0\\\">5. Liability:</sentence>\\n</paragraph>\\n<paragraph id=\\\"P37\\\">\\n<sentence
      id=\\\"P37-S0\\\">a.</sentence>\\n<sentence id=\\\"P37-S1\\\">Total Liability
      Cap:</sentence>\\n</paragraph>\\n<paragraph id=\\\"P38\\\">\\n<sentence id=\\\"P38-S0\\\">The
      total liability of either party for any and all claims arising out of or related
      to this Agreement, whether in contract, tort, or otherwise, shall not exceed
      the greater of (i) $100,000 or (ii) the total amount paid by the Receiving Party
      to the Disclosing Party under any separate business agreement between the parties
      during the twelve (12) months preceding the event giving rise to the claim.</sentence>\\n<sentence
      id=\\\"P38-S1\\\">This limitation of liability is cumulative and not per incident.</sentence>\\n</paragraph>\\n<paragraph
      id=\\\"P39\\\">\\n<sentence id=\\\"P39-S0\\\">b. Penalties for Breach:</sentence>\\n</paragraph>\\n<paragraph
      id=\\\"P40\\\">\\n<sentence id=\\\"P40-S0\\\">In the event of a breach of this
      Agreement by the Receiving Party, the Disclosing Party shall be entitled to
      seek injunctive relief in addition to any other remedy available at law or in
      equity.</sentence>\\n<sentence id=\\\"P40-S1\\\">The Receiving Party acknowledges
      that a breach of this Agreement may cause irreparable harm to the Disclosing
      Party for which monetary damages would be an inadequate remedy.</sentence>\\n<sentence
      id=\\\"P40-S2\\\">In addition to injunctive relief, the Receiving Party shall
      be liable for liquidated damages in the amount of $25,000 for each instance
      of unauthorized disclosure or use of Confidential Information, which the parties
      agree represents a reasonable estimate of the damages likely to be suffered
      and not a penalty.</sentence>\\n</paragraph>\\n<paragraph id=\\\"P41\\\">\\n<sentence
      id=\\\"P41-S0\\\">7. No License:</sentence>\\n</paragraph>\\n<paragraph id=\\\"P42\\\">\\n<sentence
      id=\\\"P42-S0\\\">Nothing in this Agreement shall be construed as granting any
      rights to the Receiving Party, by license or otherwise, to any of the Disclosing
      Party\u2019s Confidential Information, except as expressly set forth in this
      Agreement.</sentence>\\n</paragraph>\\n<paragraph id=\\\"P43\\\">\\n<sentence
      id=\\\"P43-S0\\\">8. Governing Law and Disputes:</sentence>\\n</paragraph>\\n<paragraph
      id=\\\"P44\\\">\\n<sentence id=\\\"P44-S0\\\">This Agreement shall be governed
      by and construed in accordance with the laws of the State of California, without
      regard to its conflict of law principles.</sentence>\\n</paragraph>\\n<paragraph
      id=\\\"P45\\\">\\n<sentence id=\\\"P45-S0\\\">All disputes shall be resolved
      by the courts of the State of California.</sentence>\\n<sentence id=\\\"P45-S1\\\">This
      Agreement shall remain in effect for a period of five (5) years from the date
      of signing this agreement.</sentence>\\n</paragraph>\\n<paragraph id=\\\"P46\\\">\\n<sentence
      id=\\\"P46-S0\\\">9. Miscellaneous:</sentence>\\n</paragraph>\\n<paragraph id=\\\"P47\\\">\\n<sentence
      id=\\\"P47-S0\\\">a. This Agreement constitutes the entire agreement between
      the parties with respect to the subject matter hereof and supersedes all prior
      or contemporaneous oral or written agreements concerning such subject matter.</sentence>\\n</paragraph>\\n<paragraph
      id=\\\"P48\\\">\\n<sentence id=\\\"P48-S0\\\">b. Any amendments or modifications
      to this Agreement must be made in writing and signed by both parties.</sentence>\\n</paragraph>\\n<paragraph
      id=\\\"P49\\\">\\n<sentence id=\\\"P49-S0\\\">c. If any provision of this Agreement
      is found to be unenforceable, the remainder shall be enforced as fully as possible
      and the unenforceable provision shall be deemed modified to the limited extent
      required to permit its enforcement in a manner most closely representing the
      intention of the parties.</sentence>\\n</paragraph>\\n<paragraph id=\\\"P50\\\">\\n<sentence
      id=\\\"P50-S0\\\">d. The Disclosing Party shall be a good person to execute
      this contract.</sentence>\\n</paragraph>\\n<paragraph id=\\\"P51\\\">\\n<sentence
      id=\\\"P51-S0\\\">IN WITNESS WHEREOF, the parties hereto have executed this
      Non-Disclosure Agreement as of the date first above written.</sentence>\\n</paragraph>\\n<paragraph
      id=\\\"P52\\\">\\n<sentence id=\\\"P52-S0\\\">_____</sentence>\\n</paragraph>\\n<paragraph
      id=\\\"P53\\\">\\n<sentence id=\\\"P53-S0\\\">By: ___________________________</sentence>\\n</paragraph>\\n<paragraph
      id=\\\"P54\\\">\\n<sentence id=\\\"P54-S0\\\">Name: _____</sentence>\\n</paragraph>\\n<paragraph
      id=\\\"P55\\\">\\n<sentence id=\\\"P55-S0\\\">Title: _____</sentence>\\n</paragraph>\\n<paragraph
      id=\\\"P56\\\">\\n<sentence id=\\\"P56-S0\\\">Date: ___________________________</sentence>\\n</paragraph>\\n<paragraph
      id=\\\"P57\\\">\\n<sentence id=\\\"P57-S0\\\">Example.Com LLC</sentence>\\n</paragraph>\\n<paragraph
      id=\\\"P58\\\">\\n<sentence id=\\\"P58-S0\\\">By: ___________________________</sentence>\\n</paragraph>\\n<paragraph
      id=\\\"P59\\\">\\n<sentence id=\\\"P59-S0\\\">Name: Jane Doe</sentence>\\n</paragraph>\\n<paragraph
      id=\\\"P60\\\">\\n<sentence id=\\\"P60-S0\\\">Title: Managing Partner</sentence>\\n</paragraph>\\n<paragraph
      id=\\\"P61\\\">\\n<sentence id=\\\"P61-S0\\\">Date: ___________________________</sentence>\\n</paragraph>\\n</document_paragraphs>\"}],\"model\":\"gpt-6-luna\"}"
