      to that concept. The item format and structure are specified for each concept.\\n
      \   - Treat negations, exceptions, and conditionals carefully: relevance may
      involve permissions, prohibitions, requirements, exceptions, thresholds, or
      ranges; reflect the stance  in the justification.\\n    - Prefer minimal sufficient
      evidence and value derivation:\\n    - Favor precision over recall; when uncertain,
      avoid speculative extractions or derivations.\\n4. Produce a JSON array containing
      your extracted data, in the provided format.\\n    - Internally verify before
