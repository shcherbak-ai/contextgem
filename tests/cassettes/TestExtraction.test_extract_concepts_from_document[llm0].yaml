      \   <paragraph id=\\\"P42\\\">\\n        <paragraph_id>P42</paragraph_id>\\n
      \       \\n        <paragraph_text>\\n        Nothing in this Agreement shall
      be construed as granting any rights to the Receiving Party, by license or otherwise,
