      $25,000 for each instance of unauthorized disclosure or use of Confidential
      Information, which the parties agree represents a reasonable estimate of the
      damages likely to be suffered and not a penalty.\\n\\n7. No License:\\n\\nNothing
      in this Agreement shall be construed as granting any rights to the Receiving
      Party, by license or otherwise, to any of the Disclosing Party\u2019s Confidential
      Information, except as expressly set forth in this Agreement.\\n\\n8. Governing
      Law and Disputes:\\n\\nThis Agreement shall be governed by and construed in
      accordance with the laws of the State of California, without regard to its conflict
      of law principles.\\n\\nAll disputes shall be resolved by the courts of the
      State of California. This Agreement shall remain in effect for a period of five
      (5) years from the date of signing this agreement.\\n\\n9. Miscellaneous:\\n\\na.
      This Agreement constitutes the entire agreement between the parties with respect
