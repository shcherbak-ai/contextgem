      tags.\\n</private_reasoning>\\n\\n<task_description>\\nYour task is to:\\n1.
      Read through the document paragraphs provided.\\n    - Each paragraph is identified
      by a paragraph ID (for example, \\\"P0\\\", \\\"P1\\\", etc.) specified within
      <paragraph_id></paragraph_id> tags, followed by the full text of the paragraph
      specified within <paragraph_text></paragraph_text> tags.\\n    - Note that paragraphs
      are listed in the same order they appear in the original document.\\n    - You
      may be working with document fragments rather than complete documents. Focus
      on extracting information from the available content without making assumptions
