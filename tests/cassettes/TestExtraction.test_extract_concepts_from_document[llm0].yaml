      exactly the provided ID for the paragraph (for example, \\\"P0\\\", \\\"P1\\\",
      etc.).\\n</extracted_item_object_structure>\\n\\n<type_validation_rules>\\n-
      Types of extracted items:\\n    -- Each concept specifies an \\\"extracted item
