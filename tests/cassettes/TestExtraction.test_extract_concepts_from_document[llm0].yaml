      was independently developed by Receiving Party without reference to or use of
      any Confidential Information. The name of the dog of the Receiving Party is
      Bob.\\n        </paragraph_text>\\n    </paragraph>\\n\\n    <paragraph id=\\\"P22\\\">\\n
      \       <paragraph_id>P22</paragraph_id>\\n        \\n        <paragraph_text>\\n
      \       The designation of information as Confidential Information shall not
