      id=\"P10\"><additional_context>Table row; Table caption: Table 1: Monthly fees;
      Section: 2. Fees and Payment</additional_context>Service: Monitoring; Monthly
      fee: 300 EUR; Billing: In advance</paragraph>\n<paragraph id=\"P11\"><additional_context>Table
