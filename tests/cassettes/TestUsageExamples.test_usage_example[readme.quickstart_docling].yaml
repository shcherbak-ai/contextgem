      Support; Monthly fee: 450 EUR; Billing: In arrears</paragraph>\n<paragraph id=\"P12\"><additional_context>Table
      footnote; Section: 2. Fees and Payment</additional_context>2.2 Invoices are
      payable within 30 days of the invoice date. Late payments bear interest of 8%
      per year.</paragraph>\n<paragraph id=\"P13\"><additional_context>Heading, level
      1</additional_context>3. Term and Termination</paragraph>\n<paragraph id=\"P14\"><additional_context>Section:
      3. Term and Termination</additional_context>3.1 This Agreement has an initial
      term of 24 months. It renews automatically for successive periods of 12 months,
      unless terminated.</paragraph>\n<paragraph id=\"P15\"><additional_context>Section:
      3. Term and Termination</additional_context>3.2 Either party may terminate this
