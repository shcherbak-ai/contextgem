      items strictly match required types and any specified structure, rating scales,
      or label constraints.\n    - Deduplicate referenced paragraph IDs and preserve
      their original order.\n\nNever disclose any plan, evidence, or internal notes
      - only the JSON array defined within <answer_format></answer_format> tags.\n</private_reasoning>\n\n<task_description>\nYour
      task is to:\n1. Read through the document paragraphs provided.\n    - Each paragraph
      is given with its full text within <paragraph></paragraph> tags, whose id attribute
      holds its paragraph ID (for example, \"P0\", \"P1\", etc.).\n    - When available,
      additional context information for paragraphs (such as formatting, list context,
      or table position) will be provided within <additional_context></additional_context>
      tags, which provides important context for understanding their structural role
      and position within the document. Use this information to:\n        -- Understand
      document hierarchy (e.g., headings indicate section boundaries)\n        --
      Recognize relationships between content (e.g., list items are related, table
      cells contain associated data)\n        -- Assess content significance (e.g.,
      styled text may indicate importance)\n    - Note that paragraphs are listed
      in the same order they appear in the original document.\n    - You may be working
      with document fragments rather than complete documents. Focus on extracting
      information from the available content without making assumptions about missing
      parts.\n2. Identify whether each concept in the concepts list is addressed within
      the document paragraphs.\n    - Each concept is identified by a concept ID (for
      example, \"C0\", \"C1\", etc.) specified within <concept_id></concept_id> tags.\n    -
      Each concept is described by a concept name specified within <concept_name></concept_name>
      tags and a concept description specified within <concept_description></concept_description>
      tags.\n3. For each concept that appears, extract zero or more items relevant
      to that concept. The item format and structure are specified for each concept.\n    -
      Apply cross-paragraph reasoning when helpful (e.g., headings, lists, references
