      \               <sentence_id>P21-S0</sentence_id>\\n                \\n                <sentence_text>\\n
      \               Confidential Information shall not include information that:\\n
      \               </sentence_text>\\n            </sentence>\\n            <sentence
      id=\\\"P21-S1\\\">\\n                <sentence_id>P21-S1</sentence_id>\\n                \\n
      \               <sentence_text>\\n                (a) is or becomes generally
      available to the public other than as a result of disclosure by Receiving Party
      or its Representatives;\\n                </sentence_text>\\n            </sentence>\\n
      \           <sentence id=\\\"P21-S2\\\">\\n                <sentence_id>P21-S2</sentence_id>\\n
      \               \\n                <sentence_text>\\n                (b) was
      available to Receiving Party on a non-confidential basis prior to its disclosure
      by Disclosing Party;\\n                </sentence_text>\\n            </sentence>\\n
      \           <sentence id=\\\"P21-S3\\\">\\n                <sentence_id>P21-S3</sentence_id>\\n
      \               \\n                <sentence_text>\\n                (c) becomes
      available to Receiving Party on a non-confidential basis from a person other
      than Disclosing Party who is not otherwise bound by a confidentiality obligation
      to Disclosing Party; or (d) was independently developed by Receiving Party without
      reference to or use of any Confidential Information.\\n                </sentence_text>\\n
      \           </sentence>\\n            <sentence id=\\\"P21-S4\\\">\\n                <sentence_id>P21-S4</sentence_id>\\n
