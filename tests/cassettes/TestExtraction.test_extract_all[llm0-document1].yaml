      tags.\\n</private_reasoning>\\n\\n<task_description>\\nYour task is to:\\n\\n1.
      Read and understand the aspects\\n    - Each aspect is identified by an Aspect
      ID (for example, \\\"A0\\\", \\\"A1\\\", etc.) specified within <aspect_id></aspect_id>
      tags, includes a name specified within <aspect_name></aspect_name> tags, and
      has a description specified within <aspect_description></aspect_description>
