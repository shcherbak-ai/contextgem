      \u0434\u043E\u043A\u0443\u043C\u0435\u043D\u0442\u0430\u0446\u0456\u044F, \u043D\u0430\u0443\u043A\u043E\u0432\u043E-\u0434\u043E\u0441\u043B\u0456\u0434\u043D\u0430
