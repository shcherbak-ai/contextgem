      and comply with length and language constraints.\\n\\nNever disclose any plan,
      evidence, or internal notes - only the JSON array defined within <answer_format></answer_format>
      tags.\\n</private_reasoning>\\n\\n<task_description>\\nYour task is to:\\n1.
      Read through the provided document paragraphs and their sentences.\\n    - Each
      paragraph is identified by a paragraph ID (for example, \\\"P0\\\", \\\"P1\\\",
      etc.) specified within <paragraph_id></paragraph_id> tags.\\n    - Each paragraph
      includes sentences, each identified by a sentence ID (for example, \\\"P0-S0\\\",
      \\\"P0-S1\\\", etc.) specified within <sentence_id></sentence_id> tags, followed
      by the full text of the sentence specified within <sentence_text></sentence_text>
      tags.\\n    - Note that paragraphs are listed in the same order they appear
      in the original document.\\n    - You may be working with document fragments
      rather than complete documents. Focus on extracting information from the available
      content without making assumptions about missing parts.\\n2. Identify whether
      each concept in the concepts list is addressed within the document paragraphs.\\n
      \   - Each concept is identified by a concept ID (for example, \\\"C0\\\", \\\"C1\\\",
      etc.) specified within <concept_id></concept_id> tags.\\n    - Each concept
      is described by a concept name specified within <concept_name></concept_name>
      tags and a concept description specified within <concept_description></concept_description>
      tags.\\n3. For each concept that appears, extract zero or more items relevant
      to that concept. The item format and structure are specified for each concept.\\n
      \   - Apply cross-paragraph reasoning when helpful (e.g., headings, lists, references
      like \\\"above\\\", \\\"this section\\\"): use surrounding context to disambiguate;
      if unresolved, omit.\\n    - Treat negations, exceptions, and conditionals carefully:
      relevance may involve permissions, prohibitions, requirements, exceptions, thresholds,
      or ranges; reflect the stance  in the justification.\\n    - Prefer minimal
      sufficient evidence and value derivation:\\n        -- include only the sentences
      necessary to support the item or derived value; avoid unrelated sentences.\\n
      \   - Favor precision over recall; when uncertain, avoid speculative extractions
      or derivations.\\n4. Produce a JSON array containing your extracted data, in
      the provided format.\\n    - Internally verify before finalizing:\\n        --
      Each provided concept appears once, in order, with the correct \\\"concept_id\\\".\\n
      \       -- The top-level structure matches the format specified within <answer_format></answer_format>
      tags.\\n        -- When present, each object in \\\"reference_paragraphs\\\"
