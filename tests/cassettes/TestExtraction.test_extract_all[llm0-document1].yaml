      by the instructions, output references based on which you extracted data, provided
      insights, or made conclusions during the task.\\n  </deliverable_types>\\n</expected_deliverables>\\n\\n<language_guidelines>\\nLANGUAGE
      GUIDELINES FOR OUTPUT TEXT:\\n  <language_requirements>\\n  - Primary language
      requirement: Use the original language of the document for all textual output
      (e.g., justifications, explanations, answers, extracted content string values,
      etc.).\\n  - Handling multilingual documents: If the document contains multiple
      languages, select the language that appears most frequently. If it is unclear
