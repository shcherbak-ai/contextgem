      etc.).\n</guidance_on_task_structure>\n\n<private_reasoning>\nUse private deliberation
      to plan, evaluate evidence, and verify decisions. Do not reveal any intermediate
      analysis, notes, or steps. Only output the JSON specified within <answer_format></answer_format>
      tags.\n\nFollow this internal three-stage process:\n\n1. Plan\n    - Internally
      restate each aspect in one sentence.\n    - List 3-5 concrete lexical/semantic
      cues for relevance, including indicators of prohibition, requirement, exception,
      conditionals, and negations.\n    - Define internal inclusion/exclusion criteria
