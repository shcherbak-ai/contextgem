      tags\n    - Your output must be a JSON array of objects, each object corresponding
      to a single aspect.\n    - For each aspect (in the order they are provided),
      include:\n        -- aspect_id: The aspect''s unique identifier, e.g., \"A0\".\n        --
      paragraph_ids: An array of the paragraph IDs that address or relate to the aspect,
      e.g., [\"P0\", \"P2\"].\n        -- If an aspect has no related paragraphs,
      still include it with an empty paragraph_ids array ([]).\n- Do not add extra
      commentary, code block markers, or any other formatting beyond the JSON array.\n-
      Internally verify before finalizing:\n    -- Each provided aspect appears once,
      in order, with the correct \"aspect_id\".\n    -- \"paragraph_ids\" contains
      only valid paragraph IDs.\n    -- The structure exactly matches the format specified
      within <answer_format></answer_format> tags (no extra keys or commentary).\n</task_description>\n\n<output_constraints>\n-
      No additional text:\n    -- Do not include any headers, explanations, or text
      outside of the JSON array.\n    -- Do not wrap your JSON response in backticks
      or any other formatting characters.\n- Private deliberation only:\n    -- Do
      not output any analysis, plan, scratchpad, thoughts, or chain-of-thought.\n    --
      Only output the JSON array according to the format specified within <answer_format></answer_format>
      tags.\n</output_constraints>\n\n<answer_format>\nANSWER FORMAT (MANDATORY):\n[\n    {\n        \"aspect_id\":
