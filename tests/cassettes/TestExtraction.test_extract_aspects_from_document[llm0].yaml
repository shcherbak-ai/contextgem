      precision over recall; include only high-confidence matches and omit weak or
      ambiguous ones.\n\n3. Consistency pass\n   - Deduplicate paragraph IDs within
      each aspect and preserve the original order.\n\nNever disclose any plan, evidence,
      or internal notes - only the JSON array defined within <answer_format></answer_format>
      tags.\n</private_reasoning>\n\n<task_description>\nYour task is to:\n\n1. Read
      and understand the aspects\n    - Each aspect is identified by an Aspect ID
      (for example, \"A0\", \"A1\", etc.) specified within <aspect_id></aspect_id>
      tags, includes a name specified within <aspect_name></aspect_name> tags, and
      has a description specified within <aspect_description></aspect_description>
      tags.\n    - Aspects describe themes, topics, or criteria that might be addressed
      in the paragraphs.\n\n2. Examine each paragraph\n    - Each paragraph is given
      with its full text within <paragraph></paragraph> tags, whose id attribute holds
      its paragraph ID (for example, \"P0\", \"P1\", etc.).\n    - Note that paragraphs
      are listed in the same order they appear in the original document; therefore,
      context from surrounding paragraphs may influence whether a particular paragraph
      is relevant to an aspect.\n    - You may be working with document fragments
      rather than complete documents. Focus on extracting information from the available
      content without making assumptions about missing parts.\n\n3. Map paragraphs
      to aspects\n    - A paragraph can address one, multiple, or none of the aspects.\n    -
      If a paragraph clearly relates to an aspect (based on the aspect''s name and
      description), include that paragraph''s ID under the aspect''s list of paragraph
      IDs.\n    - If a paragraph does not relate to an aspect, do not include it under
      that aspect''s list.\n    - Apply cross-paragraph reasoning when needed (e.g.,
      headings, lists, references like \"above\", \"this section\"): use surrounding
      context to disambiguate; if unresolved, omit.\n    - Treat negations, exceptions,
      and conditionals carefully: relevance can be present in prohibitions or restrictions.\n    -
      Prefer minimal sufficient evidence:\n        -- base the mapping on the most
      relevant paragraphs; avoid tangential mentions.\n    - Favor precision over
      recall; when uncertain, exclude rather than speculate.\n\n4. Produce the final
      answer in the JSON format specified within <answer_format></answer_format> tags\n    -
      Your output must be a JSON array of objects, each object corresponding to a
      single aspect.\n    - For each aspect (in the order they are provided), include:\n        --
      aspect_id: The aspect''s unique identifier, e.g., \"A0\".\n        -- paragraph_ids:
      An array of the paragraph IDs that address or relate to the aspect, e.g., [\"P0\",
      \"P2\"].\n        -- If an aspect has no related paragraphs, still include it
      with an empty paragraph_ids array ([]).\n- Do not add extra commentary, code
      block markers, or any other formatting beyond the JSON array.\n- Internally
      verify before finalizing:\n    -- Each provided aspect appears once, in order,
      with the correct \"aspect_id\".\n    -- \"paragraph_ids\" contains only valid
      paragraph IDs.\n    -- The structure exactly matches the format specified within
      <answer_format></answer_format> tags (no extra keys or commentary).\n</task_description>\n\n<output_constraints>\n-
      No additional text:\n    -- Do not include any headers, explanations, or text
      outside of the JSON array.\n    -- Do not wrap your JSON response in backticks
      or any other formatting characters.\n- Private deliberation only:\n    -- Do
      not output any analysis, plan, scratchpad, thoughts, or chain-of-thought.\n    --
      Only output the JSON array according to the format specified within <answer_format></answer_format>
      tags.\n</output_constraints>\n\n<answer_format>\nANSWER FORMAT (MANDATORY):\n[\n    {\n        \"aspect_id\":
      str,\n        \"paragraph_ids\": [\n            str,\n            ...\n        ]\n    },\n    ...\n]\n</answer_format>\n\n<aspects>\nDOCUMENT
