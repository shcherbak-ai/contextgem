      id=\"A1\">\n        <aspect_id>A1</aspect_id>\n        \n        <aspect_name>Obligations
      of the receiving party</aspect_name>\n        \n        <aspect_description>\n        Clauses
      describing the obligations of the receiving party\n        </aspect_description>\n    </aspect>\n\n</aspects>\n\n<document_paragraphs>\nDOCUMENT
