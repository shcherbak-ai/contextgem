      id=\"P4\">\n        <paragraph_id>P4</paragraph_id>\n        \n        <paragraph_text>\n        b.
      Is already known to the Receiving Party at the time of disclosure.\n        </paragraph_text>\n    </paragraph>\n\n    <paragraph
