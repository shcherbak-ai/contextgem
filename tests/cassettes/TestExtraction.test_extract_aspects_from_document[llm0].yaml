      sentence, generate candidate matches to aspects.\n    - Collect minimal sufficient
      textual evidence privately and note negation, hypothetical, or conditional forms.\n    -
      Prefer precision over recall; include only high-confidence matches and omit
      weak or ambiguous ones.\n\n3. Consistency pass\n   - Deduplicate paragraph IDs
      and sentence IDs within each aspect and preserve the original order.\n\nNever
      disclose any plan, evidence, or internal notes - only the JSON array defined
      within <answer_format></answer_format> tags.\n</private_reasoning>\n\n<task_description>\nYour
      task is to:\n\n1. Read and understand the aspects\n    - Each aspect is identified
      by an Aspect ID (for example, \"A0\", \"A1\", etc.) specified within <aspect_id></aspect_id>
      tags, includes a name specified within <aspect_name></aspect_name> tags, and
      has a description specified within <aspect_description></aspect_description>
      tags.\n    - Aspects describe themes, topics, or criteria that might be addressed
      in the paragraphs.\n\n2. Examine each paragraph and its sentences\n    - Each
      paragraph is given within <paragraph></paragraph> tags, whose id attribute holds
      its paragraph ID (for example, \"P0\", \"P1\", etc.).\n    - Each paragraph
      includes sentences, each given with its full text within <sentence></sentence>
      tags, whose id attribute holds its sentence ID (for example, \"P0-S0\", \"P0-S1\",
      etc.).\n    - Note that paragraphs are listed in the same order they appear
      in the original document; therefore, context from surrounding paragraphs may
      influence whether a particular paragraph is relevant to an aspect.\n    - You
      may be working with document fragments rather than complete documents. Focus
      on extracting information from the available content without making assumptions
      about missing parts.\n\n3. Map paragraphs and their sentences to aspects\n    -
      A paragraph can address one, multiple, or none of the aspects.\n    - A sentence
      within the paragraph can address one, multiple, or none of the aspects.\n    -
      If a paragraph clearly relates to an aspect (based on the aspect''s name and
      description), include the paragraph''s ID and the IDs of all the sentences within
      the paragraph that address or relate to the aspect.\n    - If a paragraph does
      not relate to an aspect, do not include it under that aspect''s list.\n    -
