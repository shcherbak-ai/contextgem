      which the parties agree represents a reasonable estimate of the damages likely
      to be suffered and not a penalty.</paragraph>\\n<paragraph id=\\\"P11\\\">7.
      No License:</paragraph>\\n<paragraph id=\\\"P12\\\">Nothing in this Agreement
      shall be construed as granting any rights to the Receiving Party, by license
      or otherwise, to any of the Disclosing Party\u2019s Confidential Information,
      except as expressly set forth in this Agreement.</paragraph>\\n<paragraph id=\\\"P13\\\">8.
