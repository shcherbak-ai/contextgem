      each concept that appears, extract zero or more items relevant to that concept.
      The item format and structure are specified for each concept.\\n    - Apply
      cross-paragraph reasoning when helpful (e.g., headings, lists, references like
      \\\"above\\\", \\\"this section\\\"): use surrounding context to disambiguate;
      if unresolved, omit.\\n    - Treat negations, exceptions, and conditionals carefully:
      relevance may involve permissions, prohibitions, requirements, exceptions, thresholds,
      or ranges; reflect the stance .\\n    - Prefer minimal sufficient evidence and
      value derivation:\\n        -- include only the paragraphs necessary to support
      the item or derived value; avoid tangential mentions.\\n    - Favor precision
      over recall; when uncertain, avoid speculative extractions or derivations.\\n4.
      Produce a JSON array containing your extracted data, in the provided format.\\n
      \   - Internally verify before finalizing:\\n        -- Each provided concept
      appears once, in order, with the correct \\\"concept_id\\\".\\n        -- The
      top-level structure matches the format specified within <answer_format></answer_format>
      tags.\\n        -- When present, \\\"reference_paragraph_ids\\\" contain only
      valid paragraph IDs.\\n        -- Item values strictly satisfy type and any
      specified structure/scale/labels constraints.\\n        -- The structure exactly
      matches the format specified within <answer_format></answer_format> tags (no
      extra keys or commentary).\\n</task_description>\\n\\n<concept_extraction_rules>\\nIf
      a concept is not addressed in the document paragraphs, you must still include
      an entry in the final JSON output but with an empty \\\"extracted_items\\\"
