      Treat negations, exceptions, and conditionals carefully: relevance may involve
      permissions, prohibitions, requirements, exceptions, thresholds, or ranges;
      reflect the stance .\n    - Prefer minimal sufficient evidence and value derivation:\n    -
      Favor precision over recall; when uncertain, avoid speculative extractions or
      derivations.\n4. Produce a JSON array containing your extracted data, in the
      provided format.\n    - Internally verify before finalizing:\n        -- Each
      provided concept appears once, in order, with the correct \"concept_id\".\n        --
      The top-level structure matches the format specified within <answer_format></answer_format>
