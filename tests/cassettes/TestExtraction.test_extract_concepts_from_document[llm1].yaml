      \   {\\n        \\\"concept_id\\\": str,\\n        \\\"extracted_items\\\":
      [\\n            {\\n                \\\"value\\\": ...,\\n                \\\"justification\\\":
      str\\n            },\\n            ...\\n        ],\\n    },\\n    ...\\n]\\n</answer_format>\\n\\n<concepts>\\nCONCEPTS:\\n<concept
