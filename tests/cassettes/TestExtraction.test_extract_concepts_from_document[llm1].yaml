      tags.\\n</private_reasoning>\\n\\n<task_description>\\nYour task is to:\\n1.
      Read through the document paragraphs provided.\\n    - Each paragraph is given
      with its full text within <paragraph></paragraph> tags, whose id attribute holds
      its paragraph ID (for example, \\\"P0\\\", \\\"P1\\\", etc.).\\n    - Note that
      paragraphs are listed in the same order they appear in the original document.\\n
      \   - You may be working with document fragments rather than complete documents.
      Focus on extracting information from the available content without making assumptions
      about missing parts.\\n2. Identify whether each concept in the concepts list
