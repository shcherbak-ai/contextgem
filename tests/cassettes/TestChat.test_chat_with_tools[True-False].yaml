      as invoice_total, discount, surcharge. Reply only with the number returned by
      `compute_final_amount`, nothing else. Do not guess any values; you must call
      the tools."}]}],"max_output_tokens":16000,"parallel_tool_calls":true,"stream":false,"tools":[{"name":"compute_invoice_total","parameters":{"type":"object","properties":{"items":{"type":"array","items":{"type":"object","properties":{"qty":{"type":"integer","description":"Quantity
