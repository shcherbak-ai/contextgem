      are listed in the same order they appear in the original document; therefore,
      context from surrounding paragraphs may influence whether a particular paragraph
      is relevant to an aspect.\n    - You may be working with document fragments
      rather than complete documents. Focus on extracting information from the available
      content without making assumptions about missing parts.\n\n3. Map paragraphs
      to aspects\n    - A paragraph can address one, multiple, or none of the aspects.\n    -
      If a paragraph clearly relates to an aspect (based on the aspect''s name and
