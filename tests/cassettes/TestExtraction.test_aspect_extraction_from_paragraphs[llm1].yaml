      Define internal inclusion/exclusion criteria for borderline matches.\n\n2. Evidence
      triage\n    - For each paragraph, generate candidate matches to aspects.\n    -
      Collect minimal sufficient textual evidence privately and note negation, hypothetical,
      or conditional forms.\n    - Prefer precision over recall; include only high-confidence
      matches and omit weak or ambiguous ones.\n\n3. Consistency pass\n   - Deduplicate
      paragraph IDs within each aspect and preserve the original order.\n   - Align
      stance in justifications (permission, prohibition, requirement, exception) with
