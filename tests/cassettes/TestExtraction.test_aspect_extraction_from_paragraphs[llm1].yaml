      \               Confidential Information shall not include information that:\\n
      \               </sentence_text>\\n            </sentence>\\n            <sentence
      id=\\\"P21-S1\\\">\\n                <sentence_id>P21-S1</sentence_id>\\n                \\n
      \               <sentence_text>\\n                (a) is or becomes generally
      available to the public other than as a result of disclosure by Receiving Party
