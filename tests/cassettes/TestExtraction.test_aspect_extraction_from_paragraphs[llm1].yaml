      id=\\\"P36-S0\\\">5. Liability:</sentence>\\n</paragraph>\\n<paragraph id=\\\"P37\\\">\\n<sentence
      id=\\\"P37-S0\\\">a.</sentence>\\n<sentence id=\\\"P37-S1\\\">Total Liability
      Cap:</sentence>\\n</paragraph>\\n<paragraph id=\\\"P38\\\">\\n<sentence id=\\\"P38-S0\\\">The
      total liability of either party for any and all claims arising out of or related
