      etc.).\\n</guidance_on_task_structure>\\n\\n<private_reasoning>\\nUse private
      deliberation to plan, evaluate evidence, and verify decisions. Do not reveal
      any intermediate analysis, notes, or steps. Only output the JSON specified within
      <answer_format></answer_format> tags.\\n\\nFollow this internal three-stage
      process:\\n\\n1. Plan\\n    - Internally restate each aspect in one sentence.\\n
      \   - List 3-5 concrete lexical/semantic cues for relevance, including indicators
      of prohibition, requirement, exception, conditionals, and negations.\\n    -
      Define internal inclusion/exclusion criteria for borderline matches.\\n\\n2.
      Evidence triage\\n    - For each paragraph and sentence, generate candidate
      matches to aspects.\\n    - Collect minimal sufficient textual evidence privately
      and note negation, hypothetical, or conditional forms.\\n    - Prefer precision
      over recall; include only high-confidence matches and omit weak or ambiguous
      ones.\\n\\n3. Consistency pass\\n   - Deduplicate paragraph IDs and sentence
      IDs within each aspect and preserve the original order.\\n\\nNever disclose
      any plan, evidence, or internal notes - only the JSON array defined within <answer_format></answer_format>
      tags.\\n</private_reasoning>\\n\\n<task_description>\\nYour task is to:\\n\\n1.
      Read and understand the aspects\\n    - Each aspect is identified by an Aspect
      ID (for example, \\\"A0\\\", \\\"A1\\\", etc.) specified within <aspect_id></aspect_id>
      tags, includes a name specified within <aspect_name></aspect_name> tags, and
      has a description specified within <aspect_description></aspect_description>
      tags.\\n    - Aspects describe themes, topics, or criteria that might be addressed
      in the paragraphs.\\n\\n2. Examine each paragraph and its sentences\\n    -
      Each paragraph is given within <paragraph></paragraph> tags, whose id attribute
      holds its paragraph ID (for example, \\\"P0\\\", \\\"P1\\\", etc.).\\n    -
      Each paragraph includes sentences, each given with its full text within <sentence></sentence>
      tags, whose id attribute holds its sentence ID (for example, \\\"P0-S0\\\",
      \\\"P0-S1\\\", etc.).\\n    - Note that paragraphs are listed in the same order
      they appear in the original document; therefore, context from surrounding paragraphs
      may influence whether a particular paragraph is relevant to an aspect.\\n    -
      You may be working with document fragments rather than complete documents. Focus
      on extracting information from the available content without making assumptions
      about missing parts.\\n\\n3. Map paragraphs and their sentences to aspects\\n
      \   - A paragraph can address one, multiple, or none of the aspects.\\n    -
      A sentence within the paragraph can address one, multiple, or none of the aspects.\\n
      \   - If a paragraph clearly relates to an aspect (based on the aspect's name
      and description), include the paragraph's ID and the IDs of all the sentences
      within the paragraph that address or relate to the aspect.\\n    - If a paragraph
      does not relate to an aspect, do not include it under that aspect's list.\\n
      \   - Apply cross-paragraph reasoning when needed (e.g., headings, lists, references
      like \\\"above\\\", \\\"this section\\\"): use surrounding context to disambiguate;
      if unresolved, omit.\\n    - Treat negations, exceptions, and conditionals carefully:
      relevance can be present in prohibitions or restrictions.\\n    - Prefer minimal
      sufficient evidence:\\n        -- include only the sentences necessary to support
      the mapping; avoid unrelated sentences.\\n    - Favor precision over recall;
      when uncertain, exclude rather than speculate.\\n\\n4. Produce the final answer
      in the JSON format specified within <answer_format></answer_format> tags\\n
      \   - Your output must be a JSON array of objects, each object corresponding
      to a single aspect.\\n    - For each aspect (in the order they are provided),
      include:\\n        -- aspect_id: The aspect's unique identifier, e.g., \\\"A0\\\".\\n
      \       -- paragraphs: An array of objects for each paragraph that addresses
      or relates to the aspect. Each object should include:\\n            --- paragraph_id:
      The provided paragraph ID, e.g., \\\"P0\\\", \\\"P2\\\".\\n            --- sentences:
      An array of objects for each relevant sentence within the paragraph. Each object
      should include:\\n                ---- sentence_id: The provided ID of the sentence,
      e.g., \\\"P0-S0\\\", \\\"P0-S2\\\".\\n        -- If an aspect has no related
      paragraphs, still include it with an empty paragraph_ids array ([]).\\n- Do
      not add extra commentary, code block markers, or any other formatting beyond
      the JSON array.\\n- Internally verify before finalizing:\\n    -- Each provided
      aspect appears once, in order, with the correct \\\"aspect_id\\\".\\n    --
      Each object in \\\"paragraphs\\\" contains only valid \\\"paragraph_id\\\" with
      valid \\\"sentences\\\".\\n    -- The structure exactly matches the format specified
      within <answer_format></answer_format> tags (no extra keys or commentary).\\n</task_description>\\n\\n<output_constraints>\\n-
      No additional text:\\n    -- Do not include any headers, explanations, or text
      outside of the JSON array.\\n    -- Do not wrap your JSON response in backticks
