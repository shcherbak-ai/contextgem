      or any other formatting beyond the JSON array.\\n- Internally verify before
      finalizing:\\n    -- Each provided aspect appears once, in order, with the correct
      \\\"aspect_id\\\".\\n    -- \\\"paragraph_ids\\\" contains only valid paragraph
