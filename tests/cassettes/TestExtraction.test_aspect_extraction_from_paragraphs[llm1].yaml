      longer than 2 sentences.\n                ---- Justification should be in English.\n        --
      If an aspect has no related paragraphs, still include it with an empty paragraphs
      array ([]).\n- Do not add extra commentary, code block markers, or any other
      formatting beyond the JSON array.\n- Internally verify before finalizing:\n    --
      Each provided aspect appears once, in order, with the correct \"aspect_id\".\n    --
      \"paragraph_ids\" contains only valid paragraph IDs.\n    -- No structural IDs
      (aspect/paragraph IDs) appear inside justifications.\n    -- Justifications
      meet length and language constraints.\n    -- The structure exactly matches
      the format specified within <answer_format></answer_format> tags (no extra keys
