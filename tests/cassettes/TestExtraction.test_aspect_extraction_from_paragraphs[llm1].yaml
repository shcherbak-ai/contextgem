      collaborations and partnerships.\\n                </sentence_text>\\n            </sentence>\\n
      \       </paragraph_sentences>\\n    </paragraph>\\n\\n    <paragraph id=\\\"P18\\\">\\n
      \       <paragraph_id>P18</paragraph_id>\\n        \\n        <paragraph_sentences>\\n
      \           <sentence id=\\\"P18-S0\\\">\\n                <sentence_id>P18-S0</sentence_id>\\n
      \               \\n                <sentence_text>\\n                2. Definition
      of Confidential Information:\\n                </sentence_text>\\n            </sentence>\\n
      \       </paragraph_sentences>\\n    </paragraph>\\n\\n    <paragraph id=\\\"P19\\\">\\n
      \       <paragraph_id>P19</paragraph_id>\\n        \\n        <paragraph_sentences>\\n
      \           <sentence id=\\\"P19-S0\\\">\\n                <sentence_id>P19-S0</sentence_id>\\n
      \               \\n                <sentence_text>\\n                For purposes
      of this Agreement, \\\"Confidential Information\\\" means any and all non-public
      information, conveyed in all forms, whether in oral, written, electronic, or
      other form or media, whether or not marked, designated, or otherwise identified
      as \\\"confidential,\\\" that has been or may be disclosed to, accessed by,
      or observed by Receiving Party, which (i) has actual or potential economic value
      by virtue of not being generally known to, and not being readily ascertainable
      by proper means by, other persons who can obtain economic value from its disclosure
      or use, or (ii) is subject to reasonable efforts by Disclosing Party to maintain
      its secrecy and confidentiality.\\n                </sentence_text>\\n            </sentence>\\n
      \       </paragraph_sentences>\\n    </paragraph>\\n\\n    <paragraph id=\\\"P20\\\">\\n
      \       <paragraph_id>P20</paragraph_id>\\n        \\n        <paragraph_sentences>\\n
      \           <sentence id=\\\"P20-S0\\\">\\n                <sentence_id>P20-S0</sentence_id>\\n
      \               \\n                <sentence_text>\\n                Confidential
      Information includes, but is not limited to, the following categories: (1) business
      information (business plans, strategies, and models), (2) technical information
      (technical specifications and documentation, research and development activities),
      (3) customer and market information (customer lists and contact information,
      sales histories and patterns), (4) personnel and internal information (employee
      lists and contact information, employment agreements and personnel files), (5)
      intellectual property (trade secrets and know-how, patents and patent applications,
      copyrights and copyright applications, trademarks and trademark applications),
      (6) strategic information (merger and acquisition plans, competitive analyses
      and strategies).\\n                </sentence_text>\\n            </sentence>\\n
      \           <sentence id=\\\"P20-S1\\\">\\n                <sentence_id>P20-S1</sentence_id>\\n
      \               \\n                <sentence_text>\\n                Software
      code shall also be included into the confidential information.\\n                </sentence_text>\\n
      \           </sentence>\\n        </paragraph_sentences>\\n    </paragraph>\\n\\n
      \   <paragraph id=\\\"P21\\\">\\n        <paragraph_id>P21</paragraph_id>\\n
