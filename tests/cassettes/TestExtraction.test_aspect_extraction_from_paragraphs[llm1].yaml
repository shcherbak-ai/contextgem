      id=\"P2\">\n        <paragraph_id>P2</paragraph_id>\n        \n        <paragraph_text>\n        Party
      A:\n        </paragraph_text>\n    </paragraph>\n\n    <paragraph id=\"P3\">\n        <paragraph_id>P3</paragraph_id>\n        \n        <paragraph_text>\n        _____\n        </paragraph_text>\n    </paragraph>\n\n    <paragraph
