      \   - A paragraph can address one, multiple, or none of the aspects.\\n    -
      A sentence within the paragraph can address one, multiple, or none of the aspects.\\n
      \   - If a paragraph clearly relates to an aspect (based on the aspect's name
      and description), include the paragraph's ID and the IDs of all the sentences
      within the paragraph that address or relate to the aspect.\\n    - If a paragraph
      does not relate to an aspect, do not include it under that aspect's list.\\n
      \   - Apply cross-paragraph reasoning when needed (e.g., headings, lists, references
      like \\\"above\\\", \\\"this section\\\"): use surrounding context to disambiguate;
      if unresolved, omit.\\n    - Treat negations, exceptions, and conditionals carefully:
      relevance can be present in prohibitions or restrictions.\\n    - Prefer minimal
      sufficient evidence:\\n        -- include only the sentences necessary to support
      the mapping; avoid unrelated sentences.\\n    - Favor precision over recall;
      when uncertain, exclude rather than speculate.\\n\\n4. Produce the final answer
      in the JSON format specified within <answer_format></answer_format> tags\\n
      \   - Your output must be a JSON array of objects, each object corresponding
