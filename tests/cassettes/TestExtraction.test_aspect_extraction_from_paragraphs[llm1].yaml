      and confidentiality.</sentence>\\n</paragraph>\\n<paragraph id=\\\"P20\\\">\\n<sentence
      id=\\\"P20-S0\\\">Confidential Information includes, but is not limited to,
      the following categories: (1) business information (business plans, strategies,
      and models), (2) technical information (technical specifications and documentation,
