      tags: if multiple items are found for a concept, include each as a separate
      entry within the \\\"extracted_items\\\" array.\\n</extracted_item_handling_rules>\\n\\n<output_constraints>\\n-
      No additional text:\\n    -- Do not include any headers, explanations, or text
      outside of the JSON array.\\n    -- Do not wrap your JSON response in backticks
      or any other formatting characters.\\n- Private deliberation only:\\n    --
      Do not output any analysis, plan, scratchpad, thoughts, or chain-of-thought.\\n
      \   -- Only output the JSON array according to the format specified within <answer_format></answer_format>
      tags.\\n</output_constraints>\\n\\n<answer_format>\\nANSWER FORMAT (MANDATORY):\\n[\\n
      \   {\\n        \\\"concept_id\\\": str,\\n        \\\"extracted_items\\\":
      [\\n            {\\n                \\\"value\\\": ...,\\n                \\\"justification\\\":
      str\\n            },\\n            ...\\n        ],\\n    },\\n    ...\\n]\\n</answer_format>\\n\\n<concepts>\\nCONCEPTS:\\n<concept
      id=\\\"C0\\\">\\n    <concept_id>C0</concept_id>\\n    \\n    <concept_name>NDA
      check</concept_name>\\n\\n    <concept_description>\\n    Document is an NDA\\n
      \   </concept_description>\\n\\n    <expected_structure>\\n    {\\n  \\\"is_nda\\\":
      bool\\n}\\n    </expected_structure>\\n\\n    <amount_of_extracted_items>This
