      Exclusions from Confidential Information:\\n\\nConfidential Information does
      not include information that:\\n\\na. Is or becomes publicly known through no
      wrongful act of the Receiving Party.\\n\\nb. Is already known to the Receiving
      Party at the time of disclosure.\\n\\nc. Is lawfully received from a third party
      without breach of this Agreement.\\n\\nd. Is independently developed by the
      Receiving Party without use of or reference to the Disclosing Party's Confidential
      Information.\\n\\n6. Return of Materials:\\n\\nUpon termination of this Agreement
      or upon request, the Receiving Party shall return all materials containing Confidential
