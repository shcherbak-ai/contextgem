      two keys: \\\"concept_id\\\" and \\\"extracted_items\\\".\\n    -- The value
      of \\\"concept_id\\\" must match exactly the ID of the concept (for example,
      \\\"C0\\\", \\\"C1\\\", etc.).\\n    -- The value of \\\"extracted_items\\\"
