- request:
    body: '{"model": "claude-haiku-5-5", "messages": [{"role": "user", "content":
      [{"type": "text", "text": "<introduction>\nBelow you will find document text
      and a list of concepts.\n</introduction>\n\n<guidance_on_task_structure>\nAll
      structured information in these instructions is provided using semantic XML
      tags. Field names correspond directly to tag names (e.g., concept_name, additional_context,
      etc.).\n</guidance_on_task_structure>\n\n<private_reasoning>\nUse private deliberation
      to plan, evaluate evidence, and verify decisions. Do not reveal any intermediate
      analysis, notes, or steps. Only output the JSON according to the format specified
      within <answer_format></answer_format> tags.\n\nFollow this internal three-stage
      process:\n\n1. Plan\n    - Internally restate each concept in one sentence.\n    -
      List 3-5 concrete lexical/semantic cues for relevance aligned with the concept
      description (include indicators of definition, obligation, permission, exception,
      conditionals, and negations).\n    - If a concept specifies a structure, rating
      scale, or available labels, align inclusion/exclusion criteria with those constraints.\n    -
      For each concept, plan how to synthesize the output value from the available
      evidence even when no literal span is present.\n\n2. Evidence triage\n    -
      Evaluate the provided content holistically; derive candidate extractions/values
      for the concepts (explicit or inferred from context).\n    - Collect minimal
      sufficient evidence privately and note negated, hypothetical, or conditional
      forms.\n    - Prefer precision over recall; include only high-confidence items
      and omit weak or ambiguous ones.\n\n3. Consistency pass\n    - Ensure all extracted
      items strictly match required types and any specified structure, rating scales,
      or label constraints.\n\nNever disclose any plan, evidence, or internal notes
      - only the JSON array defined within <answer_format></answer_format> tags.\n</private_reasoning>\n\n<task_description>\nYour
      task is to:\n1. Read through the document text provided.\n2. Identify whether
      each concept in the concepts list is addressed within the document text.\n    -
      Each concept is identified by a concept ID (for example, \"C0\", \"C1\", etc.)
      specified within <concept_id></concept_id> tags.\n    - Each concept is described
