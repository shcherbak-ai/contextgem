      within <answer_format></answer_format> tags.\\n</private_reasoning>\\n\\n<task_description>\\nYour
      task is to:\\n1. Read through the document paragraphs provided.\\n    - Each
      paragraph is identified by a paragraph ID (for example, \\\"P0\\\", \\\"P1\\\",
      etc.) specified within <paragraph_id></paragraph_id> tags, followed by the full
