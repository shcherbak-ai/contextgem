      2, \\\"response_hours\\\": 2.0}, {\\\"level\\\": 3, \\\"response_hours\\\":
      24.0}, {\\\"level\\\": 4, \\\"response_hours\\\": 48.0}]}, \\\"justification\\\":
      null}\\n</extracted_item>\\n</extracted_items>\"}],\"model\":\"gpt-5.6-luna\"}"
