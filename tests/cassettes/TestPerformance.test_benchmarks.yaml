      containment, eradication, recovery\\n- Secure configuration: CIS benchmarks
      where applicable\\n- Business continuity: backups, DR strategy, recovery time
      objectives\\n\\n\\nEXHIBIT E: DATA PROTECTION ADDENDUM (SUMMARY)\\n1. Roles
      and Scope\\n- Client is the Controller, Developer is the Processor with respect
      to Personal Data processed under the SOW.\\n- For any analytics features, Developer
      is an independent Controller for telemetry collected to improve generic platform
      services.\\n\\n2. Processing Details\\n- Subject matter, duration, nature, and
      purpose of processing\\n- Categories of data subjects and personal data\\n\\n3.
      Processor Obligations\\n- Process only on documented instructions from Client\\n-
      Confidentiality commitments for personnel\\n- Security measures (aligned to
      Exhibit D)\\n- Subprocessor controls and approval\\n- Assistance with data subject
      requests and DPIAs\\n\\n4. International Transfers\\n- Appropriate safeguards
      (e.g., SCCs) if transferring outside permitted jurisdictions\\n\\n5. Audit Rights\\n-
      Reasonable audits or provision of third-party reports (e.g., SOC 2)\\n\\n6.
      Deletion/Return\\n- Return or delete Personal Data at end of Services\\n- Developer
      may retain aggregated, de-identified data for benchmarking and service improvement
      purposes for up to five (5) years\\n\\n\\nEXHIBIT F: CHANGE REQUEST FORM (TEMPLATE)\\n-
      CR Number and Title\\n- Requestor and Date\\n- Description of Change\\n- Business
      Rationale\\n- Impact Assessment (scope, timeline, cost, risk)\\n- Updated Acceptance
      Criteria (if applicable)\\n- Approvals (Client/Developer with signatures and
      dates)\\n\\n\\nEXHIBIT G: DELIVERABLE ACCEPTANCE FORM (TEMPLATE)\\n- Deliverable
      Name/ID\\n- Version/Date Delivered\\n- Review Period\\n- Acceptance Criteria
      Summary\\n- Outcome: Accepted / Rejected (with reasons)\\n- Signatures (Client/Developer)
      and Dates\\n\\n\\nEXHIBIT H: APPROVED OPEN SOURCE LICENSES\\n- Permissive: MIT,
      Apache 2.0, BSD 2/3-Clause, ISC\\n- Weak Copyleft: MPL 2.0 (subject to review)\\n-
      Copyleft: GPL/LGPL/AGPL (requires prior written approval)\\n- Exception: GPLv3
      permitted for non-distributed build or test tooling without prior approval\\n\\n\\nEXHIBIT
      I: THIRD-PARTY MATERIALS INVENTORY\\n- Name and version\\n- License/Terms\\n-
      Purpose/Usage\\n- Fees (if any)\\n- Data processed (if any)\\n</document_text>\\n\\n<target_type>concept</target_type>\\n<target_name>Party
