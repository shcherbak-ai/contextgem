      T&M), rate card reference</paragraph>\\n<paragraph id=\\\"P192\\\">- Payment
      schedule and invoicing milestones</paragraph>\\n<paragraph id=\\\"P193\\\">-
      Expenses and approvals</paragraph>\\n<paragraph id=\\\"P194\\\">8. Assumptions
      and Constraints</paragraph>\\n<paragraph id=\\\"P195\\\">- Client responsibilities
      and prerequisites</paragraph>\\n<paragraph id=\\\"P196\\\">- Third-party services
      and licenses</paragraph>\\n<paragraph id=\\\"P197\\\">9. Acceptance Sign-Off</paragraph>\\n<paragraph
      id=\\\"P198\\\">- Authorized signatories and dates</paragraph>\\n<paragraph
      id=\\\"P199\\\">EXHIBIT B: RATE CARD</paragraph>\\n<paragraph id=\\\"P200\\\">-
      Role: [e.g., Senior Engineer] \u2014 Rate: $[amount]/hour</paragraph>\\n<paragraph
      id=\\\"P201\\\">- Role: [e.g., UX Designer] \u2014 Rate: $[amount]/hour</paragraph>\\n<paragraph
      id=\\\"P202\\\">- Role: [e.g., QA Engineer] \u2014 Rate: $[amount]/hour</paragraph>\\n<paragraph
      id=\\\"P203\\\">- Overtime, weekend, or holiday rates (if any)</paragraph>\\n<paragraph
      id=\\\"P204\\\">- Annual rate review/adjustment terms (if any)</paragraph>\\n<paragraph
      id=\\\"P205\\\">EXHIBIT C: SERVICE LEVEL AGREEMENT (SLA)</paragraph>\\n<paragraph
      id=\\\"P206\\\">1. Availability Targets</paragraph>\\n<paragraph id=\\\"P207\\\">-
      Production availability: 99.9% monthly</paragraph>\\n<paragraph id=\\\"P208\\\">-
      Exclusions: planned maintenance, force majeure, third-party outages beyond control</paragraph>\\n<paragraph
      id=\\\"P209\\\">2. Incident Response</paragraph>\\n<paragraph id=\\\"P210\\\">-
      Severity 1 (Critical): Response within [30 minutes], workaround within [4 hours],
      resolution within [8 hours]</paragraph>\\n<paragraph id=\\\"P211\\\">- Severity
      2 (High): Response within [2 hours], workaround within [1 business day], resolution
      within [3 business days]</paragraph>\\n<paragraph id=\\\"P212\\\">- Severity
      3 (Medium): Response within [1 business day], resolution within [5 business
      days]</paragraph>\\n<paragraph id=\\\"P213\\\">- Severity 4 (Low): Response
      within [2 business days], resolution as scheduled</paragraph>\\n<paragraph id=\\\"P214\\\">3.
      Monitoring and Alerting</paragraph>\\n<paragraph id=\\\"P215\\\">- Metrics,
      dashboards, alert thresholds</paragraph>\\n<paragraph id=\\\"P216\\\">- On-call
      schedule and escalation matrix</paragraph>\\n<paragraph id=\\\"P217\\\">4. Maintenance
      and Patching</paragraph>\\n<paragraph id=\\\"P218\\\">- Regular patch cycles
      and emergency patching procedures</paragraph>\\n<paragraph id=\\\"P219\\\">5.
      Service Credits (Optional)</paragraph>\\n<paragraph id=\\\"P220\\\">- Credits
      for failing to meet uptime or response targets, capped at [x]% of monthly fees</paragraph>\\n<paragraph
      id=\\\"P221\\\">- For outages exceeding four (4) hours in a calendar month,
      credit equal to 25% of monthly fees for the affected Service</paragraph>\\n<paragraph
      id=\\\"P222\\\">EXHIBIT D: SECURITY CONTROLS CHECKLIST</paragraph>\\n<paragraph
      id=\\\"P223\\\">- Identity and access management: SSO, MFA, RBAC</paragraph>\\n<paragraph
      id=\\\"P224\\\">- Secure SDLC: code review, static and dynamic analysis, dependency
      scanning</paragraph>\\n<paragraph id=\\\"P225\\\">- Data protection: encryption
      in transit (TLS 1.2+), encryption at rest where applicable</paragraph>\\n<paragraph
      id=\\\"P226\\\">- Secrets management: vaulting, rotation, least privilege</paragraph>\\n<paragraph
      id=\\\"P227\\\">- Logging and monitoring: centralized logs, tamper-resistant
      storage, retention</paragraph>\\n<paragraph id=\\\"P228\\\">- Vulnerability
      management: scanning cadence, remediation SLAs</paragraph>\\n<paragraph id=\\\"P229\\\">-
      Incident response: detection, triage, containment, eradication, recovery</paragraph>\\n<paragraph
      id=\\\"P230\\\">- Secure configuration: CIS benchmarks where applicable</paragraph>\\n<paragraph
      id=\\\"P231\\\">- Business continuity: backups, DR strategy, recovery time objectives</paragraph>\\n<paragraph
      id=\\\"P232\\\">EXHIBIT E: DATA PROTECTION ADDENDUM (SUMMARY)</paragraph>\\n<paragraph
      id=\\\"P233\\\">1. Roles and Scope</paragraph>\\n<paragraph id=\\\"P234\\\">-
      Client is the Controller, Developer is the Processor with respect to Personal
      Data processed under the SOW.</paragraph>\\n<paragraph id=\\\"P235\\\">- For
      any analytics features, Developer is an independent Controller for telemetry
      collected to improve generic platform services.</paragraph>\\n<paragraph id=\\\"P236\\\">2.
      Processing Details</paragraph>\\n<paragraph id=\\\"P237\\\">- Subject matter,
      duration, nature, and purpose of processing</paragraph>\\n<paragraph id=\\\"P238\\\">-
      Categories of data subjects and personal data</paragraph>\\n<paragraph id=\\\"P239\\\">3.
      Processor Obligations</paragraph>\\n<paragraph id=\\\"P240\\\">- Process only
      on documented instructions from Client</paragraph>\\n<paragraph id=\\\"P241\\\">-
      Confidentiality commitments for personnel</paragraph>\\n<paragraph id=\\\"P242\\\">-
      Security measures (aligned to Exhibit D)</paragraph>\\n<paragraph id=\\\"P243\\\">-
      Subprocessor controls and approval</paragraph>\\n<paragraph id=\\\"P244\\\">-
      Assistance with data subject requests and DPIAs</paragraph>\\n<paragraph id=\\\"P245\\\">4.
      International Transfers</paragraph>\\n<paragraph id=\\\"P246\\\">- Appropriate
      safeguards (e.g., SCCs) if transferring outside permitted jurisdictions</paragraph>\\n<paragraph
      id=\\\"P247\\\">5. Audit Rights</paragraph>\\n<paragraph id=\\\"P248\\\">- Reasonable
      audits or provision of third-party reports (e.g., SOC 2)</paragraph>\\n<paragraph
      id=\\\"P249\\\">6. Deletion/Return</paragraph>\\n<paragraph id=\\\"P250\\\">-
      Return or delete Personal Data at end of Services</paragraph>\\n<paragraph id=\\\"P251\\\">-
      Developer may retain aggregated, de-identified data for benchmarking and service
      improvement purposes for up to five (5) years</paragraph>\\n<paragraph id=\\\"P252\\\">EXHIBIT
      F: CHANGE REQUEST FORM (TEMPLATE)</paragraph>\\n<paragraph id=\\\"P253\\\">-
      CR Number and Title</paragraph>\\n<paragraph id=\\\"P254\\\">- Requestor and
      Date</paragraph>\\n<paragraph id=\\\"P255\\\">- Description of Change</paragraph>\\n<paragraph
      id=\\\"P256\\\">- Business Rationale</paragraph>\\n<paragraph id=\\\"P257\\\">-
      Impact Assessment (scope, timeline, cost, risk)</paragraph>\\n<paragraph id=\\\"P258\\\">-
      Updated Acceptance Criteria (if applicable)</paragraph>\\n<paragraph id=\\\"P259\\\">-
      Approvals (Client/Developer with signatures and dates)</paragraph>\\n<paragraph
      id=\\\"P260\\\">EXHIBIT G: DELIVERABLE ACCEPTANCE FORM (TEMPLATE)</paragraph>\\n<paragraph
      id=\\\"P261\\\">- Deliverable Name/ID</paragraph>\\n<paragraph id=\\\"P262\\\">-
      Version/Date Delivered</paragraph>\\n<paragraph id=\\\"P263\\\">- Review Period</paragraph>\\n<paragraph
      id=\\\"P264\\\">- Acceptance Criteria Summary</paragraph>\\n<paragraph id=\\\"P265\\\">-
      Outcome: Accepted / Rejected (with reasons)</paragraph>\\n<paragraph id=\\\"P266\\\">-
      Signatures (Client/Developer) and Dates</paragraph>\\n<paragraph id=\\\"P267\\\">EXHIBIT
      H: APPROVED OPEN SOURCE LICENSES</paragraph>\\n<paragraph id=\\\"P268\\\">-
      Permissive: MIT, Apache 2.0, BSD 2/3-Clause, ISC</paragraph>\\n<paragraph id=\\\"P269\\\">-
      Weak Copyleft: MPL 2.0 (subject to review)</paragraph>\\n<paragraph id=\\\"P270\\\">-
      Copyleft: GPL/LGPL/AGPL (requires prior written approval)</paragraph>\\n<paragraph
      id=\\\"P271\\\">- Exception: GPLv3 permitted for non-distributed build or test
      tooling without prior approval</paragraph>\\n<paragraph id=\\\"P272\\\">EXHIBIT
      I: THIRD-PARTY MATERIALS INVENTORY</paragraph>\\n<paragraph id=\\\"P273\\\">-
      Name and version</paragraph>\\n<paragraph id=\\\"P274\\\">- License/Terms</paragraph>\\n<paragraph
      id=\\\"P275\\\">- Purpose/Usage</paragraph>\\n<paragraph id=\\\"P276\\\">- Fees
      (if any)</paragraph>\\n<paragraph id=\\\"P277\\\">- Data processed (if any)</paragraph>\\n</document_paragraphs>\"}],\"model\":\"gpt-6-luna\"}"
