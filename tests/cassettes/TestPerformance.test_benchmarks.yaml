      and emergency patching procedures</paragraph>\\n<paragraph id=\\\"P219\\\">5.
      Service Credits (Optional)</paragraph>\\n<paragraph id=\\\"P220\\\">- Credits
      for failing to meet uptime or response targets, capped at [x]% of monthly fees</paragraph>\\n<paragraph
      id=\\\"P221\\\">- For outages exceeding four (4) hours in a calendar month,
      credit equal to 25% of monthly fees for the affected Service</paragraph>\\n<paragraph
      id=\\\"P222\\\">EXHIBIT D: SECURITY CONTROLS CHECKLIST</paragraph>\\n<paragraph
      id=\\\"P223\\\">- Identity and access management: SSO, MFA, RBAC</paragraph>\\n<paragraph
      id=\\\"P224\\\">- Secure SDLC: code review, static and dynamic analysis, dependency
      scanning</paragraph>\\n<paragraph id=\\\"P225\\\">- Data protection: encryption
      in transit (TLS 1.2+), encryption at rest where applicable</paragraph>\\n<paragraph
      id=\\\"P226\\\">- Secrets management: vaulting, rotation, least privilege</paragraph>\\n<paragraph
      id=\\\"P227\\\">- Logging and monitoring: centralized logs, tamper-resistant
      storage, retention</paragraph>\\n<paragraph id=\\\"P228\\\">- Vulnerability
      management: scanning cadence, remediation SLAs</paragraph>\\n<paragraph id=\\\"P229\\\">-
