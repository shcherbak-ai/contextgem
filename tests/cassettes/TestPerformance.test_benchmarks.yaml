- request:
    body: "{\"messages\":[{\"role\":\"user\",\"content\":\"You are a strict evaluator
      of quality of data extraction from the document specified within <document_text></document_text>
      tags.\\nRate the correctness and grounding of the extracted items (specified
      within <extracted_items></extracted_items> tags) for the target (specified within
      <target_type></target_type> and <target_name></target_name> tags) on a scale
      from 0 to 5, where 0 is the worst and 5 is the best.\\nConsider factual correctness,
      support by the provided document text, and completeness.\\nDo not evaluate the
      schema or structure of the extracted items; assume the schema is already validated.
      Focus only on the values of the fields.\\nIf the rating is less than 5, include
      up to 3 sentences of justification. If the rating equals 5, justification must
      be an empty string.\\nReturn ONLY a JSON object with keys 'rating' (integer)
      and 'justification' (string).\\n\\n<document_text>\\nWEB APPLICATION DEVELOPMENT
      AGREEMENT\\n\\nThis Web Application Development Agreement (the \\\"Agreement\\\")
      is entered into as of January 15, 2025 (the \\\"Effective Date\\\") by and between
      Orion Commerce, Inc., a Delaware corporation with its principal place of business
      at 123 Market Street, Suite 500, San Francisco, CA 94105, USA (\\\"Client\\\"),
      and Nova Digital Solutions LLC, a Colorado limited liability company with its
      principal place of business at 600 17th Street, Suite 2800, Denver, CO 80202,
      USA (\\\"Developer\\\"). Client and Developer may be referred to herein individually
      as a \\\"Party\\\" and collectively as the \\\"Parties.\\\"\\n\\n1. DEFINITIONS\\n1.1
      \\\"Acceptance\\\" or \\\"Accepted\\\" means written confirmation by Client
      that a Deliverable meets the applicable Acceptance Criteria as specified in
      this Agreement or the applicable Statement of Work.\\n1.2 \\\"Acceptance Criteria\\\"
      means the objective criteria, tests, and specifications set forth in the applicable
      Statement of Work (\\\"SOW\\\") and/or Exhibit G that a Deliverable must satisfy
      for Acceptance.\\n1.3 \\\"Affiliate\\\" means any entity that directly or indirectly
      controls, is controlled by, or is under common control with a Party, where \\\"control\\\"
      means ownership of more than 50% of the voting interests of such entity or the
      ability to direct its management.\\n1.4 \\\"Background IP\\\" means pre-existing
      intellectual property owned or controlled by a Party, and any modifications,
      enhancements, or derivatives thereof, that are not created specifically for
      Client under this Agreement.\\n1.5 \\\"Change Request\\\" means a written request
      to modify scope, Deliverables, timelines, pricing, or other terms of a SOW,
      substantially in the form of Exhibit F.\\n1.6 \\\"Confidential Information\\\"
      has the meaning set forth in Section 23.\\n1.7 \\\"Deliverables\\\" means all
      items, including software, source code, object code, scripts, schemas, APIs,
      configuration files, documentation, training materials, designs, and other work
      product, identified in a SOW to be created, developed, or delivered by Developer
      to Client.\\n1.8 \\\"Development Environment\\\" means the tools, frameworks,
      libraries (including open source), cloud services, platforms, and systems used
      by Developer to produce the Deliverables.\\n1.9 \\\"Documentation\\\" means
      user guides, admin guides, architecture diagrams, runbooks, API references,
      data dictionaries, deployment guides, and any other technical or operational
      documentation for the Deliverables.\\n1.10 \\\"Intellectual Property Rights\\\"
      or \\\"IPR\\\" means all intellectual property and proprietary rights, including
      patents, copyrights, trade secrets, database rights, mask works, trademarks,
      and all other similar rights worldwide, whether registered or unregistered.\\n1.11
      \\\"Open Source Software\\\" or \\\"OSS\\\" means software licensed under a
      license approved by the Open Source Initiative or similar permissive or copyleft
      license.\\n1.12 \\\"Services\\\" means the design, development, implementation,
      integration, testing, documentation, training, support, and other services provided
      by Developer under this Agreement and any SOW.\\n1.13 \\\"Statement of Work\\\"
      or \\\"SOW\\\" means an ordering document executed by both Parties that references
      this Agreement and describes the specific Services, Deliverables, Acceptance
      Criteria, timeline, and fees.\\n1.14 \\\"Work Product\\\" means any Deliverables
      created by Developer specifically for Client under a SOW, excluding Developer
      Background IP and Third-Party Materials.\\n1.15 \\\"Third-Party Materials\\\"
      means third-party software, data, APIs, or other materials used in or with the
      Deliverables.\\n\\n2. SCOPE OF WORK; STATEMENTS OF WORK\\n2.1 Engagement. Developer
      shall provide the Services and Deliverables as described in one or more SOWs
      executed by the Parties. Each SOW will be governed by the terms of this Agreement.\\n2.2
      Order of Precedence. In the event of conflict among documents, the following
      order governs: (1) Change Requests executed after the relevant SOW, (2) the
      SOW, (3) this Agreement, (4) Exhibits, and (5) any other referenced documents.
      Specific terms in a SOW expressly supersede conflicting terms in this Agreement
      but only for that SOW.\\n2.3 Methodology. Unless otherwise stated in a SOW,
      the Parties will follow an agile development methodology with time-boxed iterations,
      backlog grooming, sprint planning, demos, and retrospectives. Alternatively,
      a waterfall or hybrid approach may be specified in the SOW.\\n\\n3. DELIVERABLES;
      SPECIFICATIONS\\n3.1 Specifications. Deliverables shall conform to the specifications,
      designs, user stories, and Acceptance Criteria set forth in the applicable SOW.\\n3.2
      Quality Standards. Deliverables shall be developed in a professional and workmanlike
      manner consistent with generally accepted industry standards and best practices,
      including secure development practices, code review, automated testing commensurate
      with risk, and documentation appropriate for maintainability.\\n3.3 Accessibility.
      Where applicable, Deliverables shall meet WCAG 2.1 AA accessibility standards
      or other accessibility requirements specified in the SOW.\\n3.4 Performance.
      Deliverables shall meet the performance, scalability, and availability requirements
      set forth in the SOW or Exhibit C (SLA), including page-load metrics, API latency,
      throughput, and resource utilization targets.\\n3.5 Security. Deliverables shall
      adhere to the security controls in Exhibit D and any additional controls specified
      in a SOW, including secure authentication, authorization, logging, input validation,
      encryption in transit and at rest (where applicable), secrets management, and
      vulnerability remediation.\\n\\n4. PROJECT MANAGEMENT\\n4.1 Roles. Each Party
      shall appoint a project manager as the primary point of contact. The SOW will
      list key personnel and their roles.\\n4.2 Communication. The Parties shall maintain
      regular status meetings (e.g., weekly) and provide status reports covering progress,
      risks, blockers, and upcoming milestones.\\n4.3 Tools. The Parties may use agreed-upon
      tools for backlog, issue tracking, documentation, and CI/CD. Access details
      will be specified in the SOW.\\n4.4 Dependencies. Client will timely provide
      required inputs, decisions, access, and approvals. Developer is not responsible
      for delays caused by Client or third parties.\\n\\n5. TIMELINE; MILESTONES\\n5.1
      Milestones. The SOW will define milestones, interim Deliverables, and target
      dates. Milestones may include design sign-off, MVP readiness, UAT completion,
      and go-live.\\n5.2 Schedule Changes. If scope changes or dependencies shift,
      the Parties will follow the Change Control process (Section 6).\\n5.3 Delays.
      Each Party shall promptly notify the other of material delays. The Parties will
      cooperate to mitigate impacts, including adjusting scope, timeline, or resources.\\n\\n6.
      CHANGE CONTROL\\n6.1 Change Requests. Either Party may request changes using
      the process and template in Exhibit F. Change Requests will specify scope changes,
      impact on time and cost, and any adjustments to Acceptance Criteria.\\n6.2 Approval.
      No change is binding unless signed by both Parties. Developer is not obligated
      to start work on a change until a Change Request is executed or written authorization
      is provided per the SOW.\\n\\n7. ACCEPTANCE TESTING\\n7.1 Delivery for Testing.
      Upon completion of a Deliverable or milestone, Developer will deliver the Deliverable
      and applicable Documentation to Client for testing.\\n7.2 Review Period. Unless
      otherwise stated in the SOW, Client will have [10] business days to test and
      either (a) provide written Acceptance or (b) provide a written list of material
      non-conformities. If Client does not respond within the Review Period, the Deliverable
      is deemed Accepted. For Deliverables classified as \\\"Critical\\\" in the SOW,
      the Review Period shall be three (3) business days.\\n7.3 Corrections. Upon
      receipt of a valid rejection notice, Developer will address the non-conformities
      and resubmit the Deliverable. The Parties will repeat the review process.\\n7.4
      Partial Acceptance. Client may Accept portions of a Deliverable that meet the
      Acceptance Criteria, with remaining items tracked for remediation.\\n\\n8. CLIENT
      RESPONSIBILITIES\\n8.1 Information and Access. Client will timely provide access
      to systems, environments, credentials, data, and personnel as needed.\\n8.2
      Content. Client is responsible for the accuracy, legality, and non-infringing
      nature of all content, data, and materials it provides.\\n8.3 Approvals. Client
      will provide timely feedback and approvals. Delays may impact schedule and fees.\\n8.4
      Third-Party Licenses. Unless otherwise stated in a SOW, Client will obtain licenses
      and approvals for Third-Party Materials it requires to be used in the Deliverables.\\n\\n9.
      DEVELOPER RESPONSIBILITIES\\n9.1 Professional Services. Developer will perform
      the Services in a professional and workmanlike manner using personnel with appropriate
      skills and experience.\\n9.2 Subcontractors. Developer may use subcontractors
      but remains responsible for their performance. Developer will ensure subcontractors
      are bound by confidentiality and IP assignment obligations consistent with this
      Agreement.\\n9.3 Compliance. Developer will comply with applicable laws and
      regulations in providing the Services and will follow the security and privacy
      controls in Exhibit D and Exhibit E (DPA), if applicable.\\n\\n10. PERSONNEL\\n10.1
      Key Personnel. The SOW may identify key personnel. Developer will not remove
      key personnel from the project without reasonably equivalent replacements and
      prior notice to Client.\\n10.2 Non-Solicitation. During the term and for twelve
      (12) months thereafter, neither Party will directly solicit for employment the
      other Party\u2019s personnel who are materially involved in the project; general
      advertisements not targeted at such personnel are permitted.\\n\\n11. PROJECT
      ARTIFACTS AND DOCUMENTATION\\n11.1 Source Control. Unless otherwise stated,
      all source code for Work Product shall be stored in a version control system
      accessible to Client.\\n11.2 Documentation. Developer will provide Documentation
      sufficient for installation, configuration, operation, and maintenance of the
      Deliverables.\\n11.3 Training. If specified in the SOW, Developer will provide
      training sessions and materials.\\n\\n12. SECURITY, PRIVACY, AND COMPLIANCE\\n12.1
      Security Program. Developer will maintain an information security program appropriate
      to the risk and in line with recognized frameworks (e.g., ISO 27001, SOC 2,
      NIST CSF).\\n12.2 Data Protection. Where Developer processes Personal Data (as
      defined in Exhibit E), the Data Protection Addendum in Exhibit E applies.\\n12.3
      Vulnerability Management. Developer will remediate critical and high-risk vulnerabilities
      within commercially reasonable timeframes or as specified in Exhibit D.\\n12.4
      Incident Response. Developer will notify Client of confirmed security incidents
      affecting the Deliverables or Client Data without undue delay and cooperate
      in investigation and remediation.\\n12.5 Compliance. Where applicable, Deliverables
      will be designed to support compliance requirements listed in the SOW (e.g.,
      GDPR, CCPA, HIPAA, PCI DSS), with Client responsible for its own organizational
      compliance obligations.\\n\\n13. OPEN SOURCE AND THIRD-PARTY MATERIALS; AI USE\\n13.1
      OSS Management. Developer may use OSS consistent with Exhibit H. Developer shall
      not include copyleft OSS that would require disclosure of Client proprietary
      code without Client\u2019s prior written consent. Notwithstanding the foregoing,
      Developer may include GPLv3-licensed build or test dependencies without prior
      written consent.\\n13.2 Third-Party Services. Any required Third-Party Materials
      or services will be identified in the SOW or Exhibit I. Client is responsible
      for related fees unless otherwise stated.\\n13.3 AI/ML and Generative AI. If
      AI-assisted tools are used, Developer will ensure outputs are reviewed for quality,
      originality, and license compliance. Developer shall not submit Client Confidential
      Information to public AI services without written approval.\\n\\n14. INTELLECTUAL
      PROPERTY\\n14.1 Ownership of Work Product. Subject to Section 14.2, upon full
      payment of all amounts due, Developer hereby assigns to Client all right, title,
      and interest in and to the Work Product (excluding Developer Background IP and
      Third-Party Materials), including all Intellectual Property Rights therein.\\n14.2
      Background IP. Each Party retains ownership of its Background IP. To the extent
      Developer Background IP is incorporated into the Work Product, Developer grants
      to Client a perpetual, worldwide, non-exclusive, royalty-free license to use,
      execute, reproduce, display, perform, and create derivative works of such Background
      IP solely as part of or in connection with the Work Product.\\n14.3 Third-Party
      Materials. Third-Party Materials are subject to their respective license terms.
      Developer will identify such materials and applicable licenses in Exhibit I
      or the SOW.\\n14.4 Moral Rights. To the extent permitted by law, Developer will
      secure waivers of moral rights in the Work Product from its personnel and subcontractors.\\n\\n15.
      FEES, INVOICING, AND PAYMENT\\n15.1 Fees. Fees will be as specified in each
      SOW. Fees may be fixed-price, time-and-materials at the rates in Exhibit B,
      or a hybrid.\\n15.2 Invoicing. Unless otherwise specified in the SOW, Developer
      will invoice monthly in arrears for time-and-materials, and per milestone for
      fixed-price.\\n15.3 Payment Terms. Payments are due within [30] days of invoice
      date. Late amounts accrue interest at the lesser of 1.5% per month or the maximum
      allowed by law. Notwithstanding the foregoing, invoices for fixed-price milestones
      are due within ten (10) days of receipt.\\n15.4 Disputed Amounts. Client may
      withhold payment of disputed amounts with written notice specifying the basis
      for dispute. The Parties will promptly attempt to resolve disputes in good faith.\\n15.5
      Expenses. Pre-approved, reasonable out-of-pocket travel and related expenses
      will be reimbursed at cost per Section 18.\\n\\n16. TAXES\\n16.1 Taxes. Fees
      are exclusive of taxes. Client is responsible for all applicable sales, use,
      VAT, GST, and similar taxes, excluding taxes based on Developer\u2019s income.\\n16.2
      Withholding. If withholding is required by law, Client shall gross up payments
      so Developer receives the full amount invoiced, unless a valid exemption applies.\\n\\n17.
      SUPPORT, MAINTENANCE, AND SERVICE LEVELS\\n17.1 Support Tiers. If support is
      included, Developer will provide Tier 1 (end-user triage, FAQ), Tier 2 (application-level
      troubleshooting), and Tier 3 (engineering-level remediation) as described in
      Exhibit C.\\n17.2 Service Levels. Uptime, incident response times, and resolution
      targets are set forth in Exhibit C.\\n17.3 Maintenance Windows. Regular maintenance
      windows and change management procedures will be defined in Exhibit C or the
      SOW.\\n17.4 Out-of-Scope Support. Work outside defined support scope will be
      billed at rates in Exhibit B unless otherwise stated.\\n\\n18. EXPENSES\\n18.1
      Pre-Approval. Expenses must be pre-approved in writing by Client.\\n18.2 Receipts.
      Developer will provide reasonable documentation for reimbursable expenses.\\n\\n19.
      HOSTING AND DEVOPS\\n19.1 Hosting Model. The SOW will specify whether hosting
      is provided by Client, Developer, or a third-party platform (e.g., AWS, Azure,
      GCP).\\n19.2 CI/CD and Environments. The Parties will define environments (dev/test/stage/prod),
      branching strategy, and deployment processes. Infrastructure-as-code is preferred
      where applicable.\\n19.3 Monitoring and Logging. Appropriate monitoring, alerting,
      and logging will be implemented as described in Exhibit C and Exhibit D.\\n\\n20.
      WARRANTIES\\n20.1 Performance Warranty. For ninety (90) days after Acceptance,
      Developer warrants that the Work Product will materially conform to the SOW
      and Documentation. For time-and-materials engagements, the warranty period shall
      be sixty (60) days after Acceptance.\\n20.2 Services Warranty. Developer warrants
      it will perform Services in a professional and workmanlike manner.\\n20.3 Virus-Free.
      Developer warrants that, to its knowledge using commercially reasonable scanning
      tools, Deliverables are free from known malicious code at the time of delivery.\\n20.4
      Exclusions. Warranties do not apply to issues caused by (a) modifications not
      made by Developer, (b) misuse or use not in accordance with Documentation, (c)
      third-party systems, or (d) Client\u2019s failure to follow reasonable instructions.\\n20.5
      Remedies. Developer\u2019s sole obligation and Client\u2019s exclusive remedy
      for breach of warranty is repair or replacement of the nonconforming Deliverable,
      or if not feasible, refund of the fees paid for the affected Deliverable.\\n\\n21.
      INDEMNIFICATION\\n21.1 By Developer. Developer will defend, indemnify, and hold
      harmless Client against third-party claims alleging that the Work Product infringes
      or misappropriates such third party\u2019s Intellectual Property Rights, and
      pay resulting damages, costs, and reasonable attorneys\u2019 fees finally awarded
      by a court or agreed in settlement.\\n21.2 Exclusions. Developer has no obligation
      for claims arising from (a) Client content or specifications, (b) combinations
      with items not provided by Developer, (c) modifications not made by Developer,
      or (d) use after Developer provides a non-infringing alternative.\\n21.3 Mitigation.
      If a Deliverable is or is likely to be enjoined, Developer may procure a license,
      modify to be non-infringing, or replace with equivalent functionality. If none
      are commercially reasonable, Developer may terminate the affected SOW and refund
      prepaid fees for the unused portion.\\n21.4 By Client. Client will defend, indemnify,
      and hold harmless Developer against third-party claims arising from Client content,
      data, or instructions provided to Developer that infringe or violate third-party
      rights or law.\\n21.5 Procedure. The indemnified Party must promptly notify
      the indemnifying Party, provide reasonable cooperation, and grant control of
      the defense, subject to the right to participate at its own expense.\\n21.6
      Aggregate Cap for IP Claims. Notwithstanding Section 22.2, Developer\u2019s
      liability for IP infringement claims shall be uncapped.\\n\\n22. LIMITATION
      OF LIABILITY\\n22.1 Exclusion of Damages. Except for Excluded Claims, neither
      Party will be liable for indirect, incidental, special, consequential, punitive,
      or exemplary damages, or for lost profits, revenues, goodwill, or data, even
      if advised of the possibility.\\n22.2 Cap. Except for Excluded Claims, each
      Party\u2019s total aggregate liability arising out of or related to this Agreement
      shall not exceed the total fees paid or payable under the applicable SOW during
      the twelve (12) months preceding the event giving rise to liability.\\n22.3
      Excluded Claims. \\\"Excluded Claims\\\" means (a) a Party\u2019s indemnification
      obligations, (b) a Party\u2019s breach of confidentiality obligations, (c) infringement
      or misappropriation of the other Party\u2019s IPR, and (d) a Party\u2019s gross
      negligence or willful misconduct.\\n\\n23. CONFIDENTIALITY\\n23.1 Definition.
      \\\"Confidential Information\\\" means non-public information disclosed by a
      Party (\\\"Discloser\\\") to the other Party (\\\"Recipient\\\") that is marked
      confidential or reasonably should be understood to be confidential, including
      business, technical, financial information, product plans, code, and data.\\n23.2
      Obligations. Recipient will (a) use Confidential Information solely to perform
      this Agreement, (b) not disclose it to third parties except to its personnel
      and subcontractors who need to know and are bound by confidentiality obligations
      at least as protective, and (c) protect it using reasonable measures.\\n23.3
      Exclusions. Confidential Information does not include information that is (a)
      publicly available without breach, (b) independently developed without use of
      the Discloser\u2019s information, (c) rightfully received from a third party
      without confidentiality obligations, or (d) approved for release in writing.\\n23.4
      Compelled Disclosure. Recipient may disclose Confidential Information to the
      extent required by law or court order, provided it uses reasonable efforts to
      provide advance notice to Discloser and cooperates in seeking protective treatment.\\n23.5
      Return/Destruction. Upon request or termination, Recipient will return or destroy
      Confidential Information, except that one archival copy may be retained for
      legal compliance.\\n\\n24. PUBLICITY\\n24.1 Publicity Rights. Neither Party
      shall issue press releases or public statements referencing the other Party
      or the project without prior written consent, except that Client may be named
      as a customer and Developer as a vendor in standard customer or vendor lists
      unless the SOW states otherwise.\\n\\n25. AUDIT AND RECORDS\\n25.1 Records.
      Developer will maintain accurate records of time-and-materials charges and reimbursable
      expenses for at least two (2) years after invoice.\\n25.2 Audit. Upon reasonable
      notice and during normal business hours, Client may audit such records no more
      than once per year to verify invoices; audits shall not unreasonably disrupt
      Developer\u2019s operations.\\n\\n26. INSURANCE\\n26.1 Coverage. Developer will
      maintain commercially reasonable insurance coverage during the term, which may
      include: (a) Commercial General Liability; (b) Professional/Technology Errors
      & Omissions; (c) Cyber Liability; (d) Workers\u2019 Compensation as required
      by law.\\n26.2 Certificates. Upon request, Developer will provide certificates
      of insurance.\\n\\n27. TERM; TERMINATION; SUSPENSION\\n27.1 Term. This Agreement
      commences on the Effective Date and continues until terminated as provided herein.
      Each SOW has its own term as specified therein.\\n27.2 Termination for Convenience.
      Either Party may terminate this Agreement or any SOW for convenience upon [30]
      days\u2019 prior written notice. In such case, Client will pay for Services
      performed and non-cancellable commitments incurred through the effective termination
      date. For SOWs with a total value under $50,000, either Party may terminate
      for convenience upon five (5) days\u2019 prior written notice.\\n27.3 Termination
      for Cause. Either Party may terminate this Agreement or an SOW upon written
      notice if the other Party materially breaches and fails to cure within [30]
      days after written notice specifying the breach.\\n27.4 Suspension. Developer
      may suspend work upon written notice if undisputed invoices are more than [30]
      days overdue and not cured within ten (10) days after notice.\\n27.5 Effect
      of Termination. Upon termination, Developer will deliver to Client all Work
      Product completed and paid for through the termination date and provide reasonable
      transition assistance at then-current rates.\\n\\n28. FORCE MAJEURE\\n28.1 Neither
      Party is liable for delays or failures caused by events beyond its reasonable
      control (e.g., acts of God, war, terrorism, labor disputes, government actions,
      failures of suppliers, or widespread outages) provided it uses commercially
      reasonable efforts to mitigate and resumes performance promptly.\\n\\n29. DISPUTE
      RESOLUTION; GOVERNING LAW\\n29.1 Escalation. The Parties will attempt in good
      faith to resolve disputes through executive-level negotiations.\\n29.2 Mediation/Arbitration.
      If not resolved within thirty (30) days, disputes may be submitted to non-binding
      mediation, and if still unresolved, to binding arbitration under the rules stated
      in the SOW or by mutual agreement. Either Party may seek injunctive relief in
      a court of competent jurisdiction.\\n29.3 Governing Law and Venue. The governing
      law and venue shall be as specified in the SOW, without regard to conflict of
      laws principles and excluding the U.N. Convention on Contracts for the International
      Sale of Goods.\\n\\n30. NOTICES\\n30.1 Notices must be in writing and delivered
      by personal delivery, reputable overnight courier, or certified mail (return
      receipt requested) to the addresses below, or to updated addresses provided
      by notice.\\n30.2 Notices to Client: Attn: Sarah Patel, VP, Legal, 123 Market
      Street, Suite 500, San Francisco, CA 94105, USA, legal@orioncommerce.com\\n30.3
      Notices to Developer: Attn: Daniel Kim, Managing Member, 600 17th Street, Suite
      2800, Denver, CO 80202, USA, legal@novadigitalsolutions.com\\n\\n31. ASSIGNMENT;
      SUBCONTRACTING\\n31.1 Assignment. Neither Party may assign this Agreement without
