- request:
    body: "{\"messages\":[{\"role\":\"system\",\"content\":\"<introduction>\\nYou
      will be assigned tasks involving the extraction, analysis, and interpretation
      of data within various types of documents. Your role is to carefully process
      the information and provide accurate, relevant outputs based on the specific
      instructions provided.\\n</introduction>\\n\\n<guidance_on_instruction_structure>\\nAll
      instructions you receive will be organized using semantic XML tags for clarity
      and structure. Each section will be properly tagged to indicate its purpose
      and content type, making it easier to understand the task requirements and expected
      outputs.\\n</guidance_on_instruction_structure>\\n\\n<key_terminology>\\nKEY
      TERMINOLOGY TO UNDERSTAND:\\n\\n  <document_definition>\\n  1. Document: A structured
      or unstructured file containing written or visual content. Documents can vary
      in type and purpose, including but not limited to:\\n    <document_types>\\n
      \   - Contracts: Legal agreements defining terms and obligations.\\n    - Invoices:
      Financial documents detailing transactions and payments.\\n    - Curricula Vitae
      (CVs): Resumes outlining an individual's professional experience and qualifications.\\n
      \   - Visual Documents: Images, scanned documents, blueprints, photographs,
      charts, diagrams, or screenshots that contain relevant information.\\n    -
      General Documents: Any other types of files that may contain text, tables, images,
      or mixed formats.\\n    </document_types>\\n  \\n  Note that occasionally you
      may be working with document fragments rather than complete documents. These
      fragments represent portions of a larger document and should be analyzed within
      their limited context. When working with fragments, focus on extracting information
      from the available content without making assumptions about missing parts.\\n\\n
      \   <content_types>\\n    Documents may contain textual or visual content:\\n
      \   - Text-based content: Written information that can be directly read and
      processed.\\n    - Visual content: Images, charts, diagrams, blueprints, tables,
      handwritten text, or other visual elements that require visual interpretation.\\n
      \   </content_types>\\n  </document_definition>\\n\\n  <aspect_definition>\\n
      \ 2. Aspect: A defined area or topic within a document that requires focused
      attention. Each aspect corresponds to a specific subject or theme described
      in the task. For example:\\n    <aspect_examples>\\n    - Contract Aspects:
      Payment terms, parties involved, or termination clauses.\\n    - Invoice Aspects:
      Due dates, line-item breakdowns, or tax details.\\n    - CV Aspects: Work experience,
      education, or skills.\\n    </aspect_examples>\\n  You will analyze aspects
      as instructed, considering their relevance and context within the document.\\n
      \ </aspect_definition>\\n\\n  <concept_definition>\\n  3. Concept: A unit of
      information or an entity relevant to the task. Concepts may be derived from
      an aspect or the broader document context. They represent a wide range of data
      points and insights, from simple entities (names, dates, monetary values) to
      complex evaluations, conclusions, and answers to specific questions. Concepts
      can be:\\n    <concept_types>\\n    - Factual extractions: Such as a penalty
      clause in a contract, a total amount due in an invoice, or a certification in
      a CV.\\n    - Analytical insights: Such as risk assessments, compliance evaluations,
      or pattern identifications.\\n    - Reasoned conclusions: Such as determining
      whether a document meets specific criteria or answers particular questions.\\n
      \   - Interpretative judgments: Such as ratings, classifications, or qualitative
      assessments based on document content.\\n    - Label classifications: Content
      categorization using predefined labels.\\n    </concept_types>\\n  </concept_definition>\\n\\n</key_terminology>\\n\\n<critical_guidelines>\\nCRITICAL
      GUIDELINES FOR YOUR WORK:\\n\\n  <precision_and_accuracy>\\n  - Precision and
      accuracy: Extract only information that is explicitly stated or can be directly
      inferred from the document content. Avoid speculation or assumptions beyond
      what the document content clearly supports.\\n  </precision_and_accuracy>\\n\\n
      \ <visual_content_analysis>\\n  - Visual content analysis: When processing visual
      content (images):\\n    -- Examine all visual elements carefully, including
      text within images, charts, diagrams, logos, layout structures, etc.\\n    --
      Identify and analyze visual patterns, relationships, and structural information
      that may not be explicitly stated in text.\\n    -- Consider the visual context
      and layout as it may provide important semantic information.\\n    -- Analyze
      information in tables, forms, charts, and diagrams with attention to their visual
      structure and relationships.\\n  </visual_content_analysis>\\n\\n  <contextual_understanding>\\n
      \ - Contextual understanding: Consider the full context when performing extractions.
      A single paragraph or sentence may have different meanings depending on surrounding
      content, document type, and domain-specific terminology.\\n  </contextual_understanding>\\n\\n
      \ <systematic_analysis>\\n  - Systematic analysis: Before extracting, thoroughly
      understand:\\n    -- The nature and type of the document\\n    -- The specific
      aspects or concepts you need to focus on\\n    -- The expected output format
      and structure requirements\\n    -- Any constraints or special handling instructions\\n
      \ </systematic_analysis>\\n\\n  <quality_control>\\n  - Quality control: After
      extraction, verify that:\\n    -- All extracted information directly relates
      to the specified aspects/concepts\\n    -- The output format matches the required
      schema exactly\\n    -- No extraneous information has been included\\n    --
      All mandatory fields are present and correctly populated\\n  </quality_control>\\n\\n
      \ <conservative_approach>\\n  - Conservative approach: When in doubt about whether
      information qualifies for extraction:\\n    -- If the relevance is unclear,
      err on the side of exclusion\\n    -- If multiple interpretations are possible,
      choose the most conservative one\\n    -- If information is ambiguous, do not
      force an extraction\\n  </conservative_approach>\\n\\n  <structured_output_compliance>\\n
      \ - Structured output compliance: Adhere strictly to the specified JSON format
      requirements. Do not:\\n    -- Add extra fields beyond what is requested\\n
      \   -- Modify the structure or field names\\n    -- Include explanatory text
      outside the JSON structure\\n    -- Use code blocks or formatting markers unless
      explicitly required\\n  </structured_output_compliance>\\n\\n</critical_guidelines>\\n\\n<expected_deliverables>\\nEXPECTED
      DELIVERABLES:\\n  <deliverable_types>\\n  - Structured outputs: Clearly formatted
      and well-organized results based on the task requirements.\\n  - Explanations
      (when required): When required by the instructions, include justifications or
      reasoning for your interpretations.\\n  - Insights (when required): When required
      by the instructions, highlight trends, patterns, or noteworthy findings that
      could add value to the task.\\n  - References (when required): When required
      by the instructions, output references based on which you extracted data, provided
      insights, or made conclusions during the task.\\n  </deliverable_types>\\n</expected_deliverables>\\n\\n\\n<conclusion>\\nBy
      adhering to this framework, you will ensure consistent and high-quality performance
      across diverse document analysis tasks.\\n</conclusion>\"},{\"role\":\"user\",\"content\":\"<introduction>\\nBelow
      you will find a list of document paragraphs and a list of concepts.\\n</introduction>\\n\\n<guidance_on_task_structure>\\nAll
      structured information in these instructions is provided using semantic XML
      tags. Field names correspond directly to tag names (e.g., concept_name, additional_context,
      etc.).\\n</guidance_on_task_structure>\\n\\n<private_reasoning>\\nUse private
      deliberation to plan, evaluate evidence, and verify decisions. Do not reveal
      any intermediate analysis, notes, or steps. Only output the JSON according to
      the format specified within <answer_format></answer_format> tags.\\n\\nFollow
      this internal three-stage process:\\n\\n1. Plan\\n    - Internally restate each
      concept in one sentence.\\n    - List 3-5 concrete lexical/semantic cues for
      relevance aligned with the concept description (include indicators of definition,
      obligation, permission, exception, conditionals, and negations).\\n    - If
      a concept specifies a structure, rating scale, or available labels, align inclusion/exclusion
      criteria with those constraints.\\n    - For each concept, plan how to synthesize
      the output value from the available evidence even when no literal span is present.\\n\\n2.
      Evidence triage\\n    - Evaluate the provided content at paragraph level; derive
      candidate extractions/values for the concepts (explicit or inferred from context).\\n
      \   - Collect minimal sufficient evidence privately and note negated, hypothetical,
      or conditional forms.\\n    - Prefer precision over recall; include only high-confidence
      items and omit weak or ambiguous ones.\\n\\n3. Consistency pass\\n    - Ensure
      all extracted items strictly match required types and any specified structure,
      rating scales, or label constraints.\\n    - Deduplicate referenced paragraph
      IDs and preserve their original order.\\n    - Ensure justifications align with
      the item's evidence and stance, and comply with length and language constraints.\\n\\nNever
      disclose any plan, evidence, or internal notes - only the JSON array defined
      within <answer_format></answer_format> tags.\\n</private_reasoning>\\n\\n<task_description>\\nYour
      task is to:\\n1. Read through the document paragraphs provided.\\n    - Each
      paragraph is given with its full text within <paragraph></paragraph> tags, whose
      id attribute holds its paragraph ID (for example, \\\"P0\\\", \\\"P1\\\", etc.).\\n
      \   - Note that paragraphs are listed in the same order they appear in the original
      document.\\n    - You may be working with document fragments rather than complete
      documents. Focus on extracting information from the available content without
      making assumptions about missing parts.\\n2. Identify whether each concept in
      the concepts list is addressed within the document paragraphs.\\n    - Each
      concept is identified by a concept ID (for example, \\\"C0\\\", \\\"C1\\\",
      etc.) specified within <concept_id></concept_id> tags.\\n    - Each concept
      is described by a concept name specified within <concept_name></concept_name>
      tags and a concept description specified within <concept_description></concept_description>
      tags.\\n3. For each concept that appears, extract zero or more items relevant
      to that concept. The item format and structure are specified for each concept.\\n
      \   - Apply cross-paragraph reasoning when helpful (e.g., headings, lists, references
      like \\\"above\\\", \\\"this section\\\"): use surrounding context to disambiguate;
      if unresolved, omit.\\n    - Treat negations, exceptions, and conditionals carefully:
      relevance may involve permissions, prohibitions, requirements, exceptions, thresholds,
      or ranges; reflect the stance  in the justification.\\n    - Prefer minimal
      sufficient evidence and value derivation:\\n        -- include only the paragraphs
      necessary to support the item or derived value; avoid tangential mentions.\\n
      \   - Favor precision over recall; when uncertain, avoid speculative extractions
      or derivations.\\n4. Produce a JSON array containing your extracted data, in
      the provided format.\\n    - Internally verify before finalizing:\\n        --
      Each provided concept appears once, in order, with the correct \\\"concept_id\\\".\\n
      \       -- The top-level structure matches the format specified within <answer_format></answer_format>
      tags.\\n        -- When present, \\\"reference_paragraph_ids\\\" contain only
      valid paragraph IDs.\\n        -- No structural IDs (concept/paragraph IDs)
      appear inside justifications.\\n        -- Justifications meet length and language
      constraints.\\n        -- Item values strictly satisfy type and any specified
      structure/scale/labels constraints.\\n        -- The structure exactly matches
      the format specified within <answer_format></answer_format> tags (no extra keys
      or commentary).\\n</task_description>\\n\\n<concept_extraction_rules>\\nIf a
      concept is not addressed in the document paragraphs, you must still include
      an entry in the final JSON output but with an empty \\\"extracted_items\\\"
      list. However, for boolean concepts (with extracted item type \\\"bool\\\"),
      distinguish carefully:\\n    - Extract True if the concept is confirmed or strongly
      supported by the document content (either explicitly stated or reasonably inferred)\\n
      \   - Extract False if the concept is contradicted, denied, or if the document
      content allows you to determine that the concept is not true (e.g., absence
      of expected content that should be present if the concept were true)\\n    -
      Only leave \\\"extracted_items\\\" empty if the concept is impossible to determine
      because either: (1) the document is completely irrelevant to the concept, or
      (2) the document does not contain enough information to make a conclusion about
      the concept\\n\\nFollow these additional rules:\\n\\n- Output format:\\n    --
      Provide your answer in the JSON format specified within <answer_format></answer_format>
      tags (do not include backticks, code fences, or any introductory/explanatory
      text). Follow this format exactly.\\n\\n- Consistency:\\n    -- Each JSON object
      in the list must have two keys: \\\"concept_id\\\" and \\\"extracted_items\\\".\\n
      \   -- The value of \\\"concept_id\\\" must match exactly the ID of the concept
      (for example, \\\"C0\\\", \\\"C1\\\", etc.).\\n    -- The value of \\\"extracted_items\\\"
      must be an array of objects with mandatory fields \\\"value\\\", \\\"justification\\\",
      and \\\"reference_paragraph_ids\\\". If the concept is not addressed or there
      are no items to extract, leave the array empty ([]). For boolean concepts, only
      leave empty if the concept is impossible to determine.\\n        --- Extracted
      items may be found directly (explicitly mentioned) or inferred from the content
      (implied or derivable from the information present).\\n        --- Guidance
      regarding the possible amount of extracted items for the concept is specified
      within <amount_of_extracted_items></amount_of_extracted_items> tags. Each extracted
      item's object, even if there is only one, must be part of the \\\"extracted_items\\\"
      array.\\n</concept_extraction_rules>\\n\\n<extracted_item_object_structure>\\n-
      Item object structure:\\n    -- value: Mandatory field holding the extracted
      item. Must match the exact type specified for the concept.\\n        --- If
      a specific structure is provided for a concept within <expected_structure></expected_structure>
      tags, the extracted item value must follow that structure for all extracted
      items corresponding to that concept.\\n        --- If a rating scale is provided
      for a concept within <rating_scale></rating_scale> tags, the extracted item
      value must be within that scale.\\n        --- If available labels are provided
      for a concept within <available_labels></available_labels> tags, the extracted
      item value must be a list containing only labels from the predefined set. The
      classification type is explicitly stated within <classification_type></classification_type>
      tags for each concept: for multi-class concepts, you must always select exactly
      one label (the most appropriate one even if not perfect); for multi-label concepts,
      leave the \\\"extracted_items\\\" array empty if none of the labels apply to
      the content.\\n        --- If there are example items within <extracted_item_examples></extracted_item_examples>
      tags, the extracted item value should follow the same style and formatting.\\n
      \           ---- Each example is provided within separate <extracted_item_example></extracted_item_example>
      tags.\\n        --- When extracting string values, translate them in English
      if the original language of the document is not English.\\n    -- justification:
      Mandatory field holding a justification of why the item was extracted for the
      concept. Ensure the justification is specific and directly ties the extracted
      item to the concept's defining features. Never reference the concept's ID or
      any of the structural IDs provided in this prompt (such as paragraph IDs like
      \\\"P0\\\", or sentence IDs like \\\"P0-S0\\\") in the justification.\\n        ---
      Justification should be brief, i.e. highlight only the essential details.\\n
      \       --- Justification should be no longer than 2 sentences.\\n        ---
      Justification should be in English.\\n    -- reference_paragraph_ids: Mandatory
      field holding the IDs of the document paragraphs based on which the item was
      extracted for the concept. Ensure such paragraphs directly tie the extracted
      item to the concept's defining features. Each paragraph ID must match exactly
      the provided ID for the paragraph (for example, \\\"P0\\\", \\\"P1\\\", etc.).\\n</extracted_item_object_structure>\\n\\n<type_validation_rules>\\n-
      Types of extracted items:\\n    -- Each concept specifies an \\\"extracted item
      type\\\" within <extracted_item_type></extracted_item_type> tags. Ensure that
      the value of each of the extracted items for the concept strictly matches that
      type. Python types are provided (e.g., str for string, int for integer, float
      for floating-point number, dict for object, etc.). Type compliance is mandatory
      - any deviation will result in invalid output.\\n    -- Do not introduce any
      extra fields or modify the specified structure.\\n</type_validation_rules>\\n\\n<extracted_item_handling_rules>\\n-
      Handling missing or multiple items:\\n    -- If a concept is not mentioned at
      all, your output should still contain an entry for that concept with an empty
      \\\"extracted_items\\\" array.\\n    -- For boolean concepts (with extracted
      item type \\\"bool\\\"): Distinguish carefully between these cases:\\n        ---
      Extract True if the concept is confirmed or strongly supported by the provided
      content (either explicitly stated or reasonably inferred)\\n        --- Extract
      False if the concept is contradicted, denied, or if the provided content allows
      you to determine that the concept is not true (e.g., absence of expected content
      that should be present if the concept were true)\\n        --- Only leave \\\"extracted_items\\\"
      empty if the concept is impossible to determine because either: (1) the provided
      content is completely irrelevant to the concept, or (2) the provided content
      does not contain enough information to make a conclusion about the concept\\n
      \   -- For concepts that have <available_labels></available_labels> tags: behavior
      depends on the classification type explicitly stated within <classification_type></classification_type>
      tags. For multi-class concepts, you must always select exactly one label (the
      most appropriate one even if not perfect). For multi-label concepts, leave the
      \\\"extracted_items\\\" array empty if none of the labels apply to the content.\\n
      \   -- For concepts that have <available_labels></available_labels> tags: if
      multiple labels apply to the same instance or context, include them all in a
      single extracted item with multiple labels in the \\\"labels\\\" array (e.g.,
      {\\\"labels\\\": [\\\"label1\\\", \\\"label2\\\"]}). Only create multiple extracted
      items if there are genuinely distinct instances or contexts that warrant separate
      classification.\\n    -- For concepts that do not have <available_labels></available_labels>
      tags: if multiple items are found for a concept, include each as a separate
      entry within the \\\"extracted_items\\\" array.\\n</extracted_item_handling_rules>\\n\\n<output_constraints>\\n-
      No additional text:\\n    -- Do not include any headers, explanations, or text
      outside of the JSON array.\\n    -- Do not wrap your JSON response in backticks
      or any other formatting characters.\\n- Private deliberation only:\\n    --
      Do not output any analysis, plan, scratchpad, thoughts, or chain-of-thought.\\n
      \   -- Only output the JSON array according to the format specified within <answer_format></answer_format>
      tags.\\n</output_constraints>\\n\\n<answer_format>\\nANSWER FORMAT (MANDATORY):\\n[\\n
      \   {\\n        \\\"concept_id\\\": str,\\n        \\\"extracted_items\\\":
      [\\n            {\\n                \\\"value\\\": ...,\\n                \\\"justification\\\":
      str,\\n                \\\"reference_paragraph_ids\\\": [\\n                    str,\\n
      \                   ...\\n                ]\\n            },\\n            ...\\n
      \       ],\\n    },\\n    ...\\n]\\n</answer_format>\\n\\n<concepts>\\nCONCEPTS:\\n<concept
      id=\\\"C0\\\">\\n    <concept_id>C0</concept_id>\\n    \\n    <concept_name>Anomalous
      Provisions</concept_name>\\n\\n    <concept_description>\\n    Provisions that
      appear as anomalies compared to common practice.\\n    </concept_description>\\n\\n
      \   <amount_of_extracted_items>This concept may have zero, one, or multiple
      extracted items.</amount_of_extracted_items>\\n\\n    <extracted_item_type>str
      (must be exactly as specified)</extracted_item_type>\\n</concept>\\n\\n<concept
      id=\\\"C1\\\">\\n    <concept_id>C1</concept_id>\\n    \\n    <concept_name>Risk
      Assessment Summary (Developer)</concept_name>\\n\\n    <concept_description>\\n
      \   Potential risks with key details from a developer's perspective. Provision
      reference should be a reference to the provision that entails the risk (e.g.
      Section A, Section 1.1, etc.). Risk description should be a short description
      of the risk. Risk severity should be a number between 1 and 5, where 1 is the
      lowest severity and 5 is the highest severity.\\n    </concept_description>\\n\\n
      \   <expected_structure>\\n    {\\n  \\\"provision_reference\\\": str,\\n  \\\"risk_description\\\":
      str,\\n  \\\"risk_severity\\\": int\\n}\\n    </expected_structure>\\n\\n    <amount_of_extracted_items>This
      concept may have zero, one, or multiple extracted items.</amount_of_extracted_items>\\n\\n
      \   <extracted_item_type>dict (must be exactly as specified)</extracted_item_type>\\n</concept>\\n\\n<concept
      id=\\\"C2\\\">\\n    <concept_id>C2</concept_id>\\n    \\n    <concept_name>Agreement
      Risk Category (Client)</concept_name>\\n\\n    <concept_description>\\n    Overall
      agreement risk category, from a client's perspective.\\n    </concept_description>\\n\\n
      \   <available_labels>\\n    <classification_type>Multi-class (exactly one label
      must be selected)</classification_type>\\n    Based on the concept description,
      you must assign exactly one label from the following list of available labels.
      You must select the most appropriate label even if none perfectly match the
      content:\\n    \\n    [\\\"low\\\", \\\"medium\\\", \\\"high\\\"]\\n    \\n
      \   The output must be an object with a mandatory field \\\"labels\\\" mapped
      to an array containing only the selected label, e.g. {\\\"labels\\\": [\\\"label1\\\"]}.
      Never leave the \\\"extracted_items\\\" array empty for this concept.\\n    </available_labels>\\n\\n
      \   <amount_of_extracted_items>This concept must have exactly one extracted
      item, never zero or multiple items.</amount_of_extracted_items>\\n\\n    <extracted_item_type>dict
      (must be exactly as specified)</extracted_item_type>\\n</concept>\\n\\n</concepts>\\n\\n<document_paragraphs>\\nDOCUMENT
      PARAGRAPHS:\\n<paragraph id=\\\"P0\\\">WEB APPLICATION DEVELOPMENT AGREEMENT</paragraph>\\n<paragraph
      id=\\\"P1\\\">This Web Application Development Agreement (the \\\"Agreement\\\")
      is entered into as of January 15, 2025 (the \\\"Effective Date\\\") by and between
      Orion Commerce, Inc., a Delaware corporation with its principal place of business
      at 123 Market Street, Suite 500, San Francisco, CA 94105, USA (\\\"Client\\\"),
      and Nova Digital Solutions LLC, a Colorado limited liability company with its
      principal place of business at 600 17th Street, Suite 2800, Denver, CO 80202,
      USA (\\\"Developer\\\"). Client and Developer may be referred to herein individually
      as a \\\"Party\\\" and collectively as the \\\"Parties.\\\"</paragraph>\\n<paragraph
      id=\\\"P2\\\">1. DEFINITIONS</paragraph>\\n<paragraph id=\\\"P3\\\">1.1 \\\"Acceptance\\\"
      or \\\"Accepted\\\" means written confirmation by Client that a Deliverable
      meets the applicable Acceptance Criteria as specified in this Agreement or the
      applicable Statement of Work.</paragraph>\\n<paragraph id=\\\"P4\\\">1.2 \\\"Acceptance
      Criteria\\\" means the objective criteria, tests, and specifications set forth
      in the applicable Statement of Work (\\\"SOW\\\") and/or Exhibit G that a Deliverable
      must satisfy for Acceptance.</paragraph>\\n<paragraph id=\\\"P5\\\">1.3 \\\"Affiliate\\\"
      means any entity that directly or indirectly controls, is controlled by, or
      is under common control with a Party, where \\\"control\\\" means ownership
      of more than 50% of the voting interests of such entity or the ability to direct
      its management.</paragraph>\\n<paragraph id=\\\"P6\\\">1.4 \\\"Background IP\\\"
      means pre-existing intellectual property owned or controlled by a Party, and
      any modifications, enhancements, or derivatives thereof, that are not created
      specifically for Client under this Agreement.</paragraph>\\n<paragraph id=\\\"P7\\\">1.5
      \\\"Change Request\\\" means a written request to modify scope, Deliverables,
      timelines, pricing, or other terms of a SOW, substantially in the form of Exhibit
      F.</paragraph>\\n<paragraph id=\\\"P8\\\">1.6 \\\"Confidential Information\\\"
      has the meaning set forth in Section 23.</paragraph>\\n<paragraph id=\\\"P9\\\">1.7
      \\\"Deliverables\\\" means all items, including software, source code, object
      code, scripts, schemas, APIs, configuration files, documentation, training materials,
      designs, and other work product, identified in a SOW to be created, developed,
      or delivered by Developer to Client.</paragraph>\\n<paragraph id=\\\"P10\\\">1.8
      \\\"Development Environment\\\" means the tools, frameworks, libraries (including
      open source), cloud services, platforms, and systems used by Developer to produce
      the Deliverables.</paragraph>\\n<paragraph id=\\\"P11\\\">1.9 \\\"Documentation\\\"
      means user guides, admin guides, architecture diagrams, runbooks, API references,
      data dictionaries, deployment guides, and any other technical or operational
      documentation for the Deliverables.</paragraph>\\n<paragraph id=\\\"P12\\\">1.10
      \\\"Intellectual Property Rights\\\" or \\\"IPR\\\" means all intellectual property
      and proprietary rights, including patents, copyrights, trade secrets, database
      rights, mask works, trademarks, and all other similar rights worldwide, whether
      registered or unregistered.</paragraph>\\n<paragraph id=\\\"P13\\\">1.11 \\\"Open
      Source Software\\\" or \\\"OSS\\\" means software licensed under a license approved
      by the Open Source Initiative or similar permissive or copyleft license.</paragraph>\\n<paragraph
      id=\\\"P14\\\">1.12 \\\"Services\\\" means the design, development, implementation,
      integration, testing, documentation, training, support, and other services provided
      by Developer under this Agreement and any SOW.</paragraph>\\n<paragraph id=\\\"P15\\\">1.13
      \\\"Statement of Work\\\" or \\\"SOW\\\" means an ordering document executed
      by both Parties that references this Agreement and describes the specific Services,
      Deliverables, Acceptance Criteria, timeline, and fees.</paragraph>\\n<paragraph
      id=\\\"P16\\\">1.14 \\\"Work Product\\\" means any Deliverables created by Developer
      specifically for Client under a SOW, excluding Developer Background IP and Third-Party
      Materials.</paragraph>\\n<paragraph id=\\\"P17\\\">1.15 \\\"Third-Party Materials\\\"
      means third-party software, data, APIs, or other materials used in or with the
      Deliverables.</paragraph>\\n<paragraph id=\\\"P18\\\">2. SCOPE OF WORK; STATEMENTS
      OF WORK</paragraph>\\n<paragraph id=\\\"P19\\\">2.1 Engagement. Developer shall
      provide the Services and Deliverables as described in one or more SOWs executed
      by the Parties. Each SOW will be governed by the terms of this Agreement.</paragraph>\\n<paragraph
      id=\\\"P20\\\">2.2 Order of Precedence. In the event of conflict among documents,
      the following order governs: (1) Change Requests executed after the relevant
      SOW, (2) the SOW, (3) this Agreement, (4) Exhibits, and (5) any other referenced
      documents. Specific terms in a SOW expressly supersede conflicting terms in
      this Agreement but only for that SOW.</paragraph>\\n<paragraph id=\\\"P21\\\">2.3
      Methodology. Unless otherwise stated in a SOW, the Parties will follow an agile
      development methodology with time-boxed iterations, backlog grooming, sprint
      planning, demos, and retrospectives. Alternatively, a waterfall or hybrid approach
      may be specified in the SOW.</paragraph>\\n<paragraph id=\\\"P22\\\">3. DELIVERABLES;
      SPECIFICATIONS</paragraph>\\n<paragraph id=\\\"P23\\\">3.1 Specifications. Deliverables
      shall conform to the specifications, designs, user stories, and Acceptance Criteria
      set forth in the applicable SOW.</paragraph>\\n<paragraph id=\\\"P24\\\">3.2
      Quality Standards. Deliverables shall be developed in a professional and workmanlike
      manner consistent with generally accepted industry standards and best practices,
      including secure development practices, code review, automated testing commensurate
      with risk, and documentation appropriate for maintainability.</paragraph>\\n<paragraph
      id=\\\"P25\\\">3.3 Accessibility. Where applicable, Deliverables shall meet
      WCAG 2.1 AA accessibility standards or other accessibility requirements specified
      in the SOW.</paragraph>\\n<paragraph id=\\\"P26\\\">3.4 Performance. Deliverables
      shall meet the performance, scalability, and availability requirements set forth
      in the SOW or Exhibit C (SLA), including page-load metrics, API latency, throughput,
      and resource utilization targets.</paragraph>\\n<paragraph id=\\\"P27\\\">3.5
      Security. Deliverables shall adhere to the security controls in Exhibit D and
      any additional controls specified in a SOW, including secure authentication,
      authorization, logging, input validation, encryption in transit and at rest
      (where applicable), secrets management, and vulnerability remediation.</paragraph>\\n<paragraph
      id=\\\"P28\\\">4. PROJECT MANAGEMENT</paragraph>\\n<paragraph id=\\\"P29\\\">4.1
      Roles. Each Party shall appoint a project manager as the primary point of contact.
      The SOW will list key personnel and their roles.</paragraph>\\n<paragraph id=\\\"P30\\\">4.2
      Communication. The Parties shall maintain regular status meetings (e.g., weekly)
      and provide status reports covering progress, risks, blockers, and upcoming
      milestones.</paragraph>\\n<paragraph id=\\\"P31\\\">4.3 Tools. The Parties may
      use agreed-upon tools for backlog, issue tracking, documentation, and CI/CD.
      Access details will be specified in the SOW.</paragraph>\\n<paragraph id=\\\"P32\\\">4.4
      Dependencies. Client will timely provide required inputs, decisions, access,
      and approvals. Developer is not responsible for delays caused by Client or third
      parties.</paragraph>\\n<paragraph id=\\\"P33\\\">5. TIMELINE; MILESTONES</paragraph>\\n<paragraph
      id=\\\"P34\\\">5.1 Milestones. The SOW will define milestones, interim Deliverables,
      and target dates. Milestones may include design sign-off, MVP readiness, UAT
      completion, and go-live.</paragraph>\\n<paragraph id=\\\"P35\\\">5.2 Schedule
      Changes. If scope changes or dependencies shift, the Parties will follow the
      Change Control process (Section 6).</paragraph>\\n<paragraph id=\\\"P36\\\">5.3
      Delays. Each Party shall promptly notify the other of material delays. The Parties
      will cooperate to mitigate impacts, including adjusting scope, timeline, or
      resources.</paragraph>\\n<paragraph id=\\\"P37\\\">6. CHANGE CONTROL</paragraph>\\n<paragraph
      id=\\\"P38\\\">6.1 Change Requests. Either Party may request changes using the
      process and template in Exhibit F. Change Requests will specify scope changes,
      impact on time and cost, and any adjustments to Acceptance Criteria.</paragraph>\\n<paragraph
      id=\\\"P39\\\">6.2 Approval. No change is binding unless signed by both Parties.
      Developer is not obligated to start work on a change until a Change Request
      is executed or written authorization is provided per the SOW.</paragraph>\\n<paragraph
      id=\\\"P40\\\">7. ACCEPTANCE TESTING</paragraph>\\n<paragraph id=\\\"P41\\\">7.1
      Delivery for Testing. Upon completion of a Deliverable or milestone, Developer
      will deliver the Deliverable and applicable Documentation to Client for testing.</paragraph>\\n<paragraph
      id=\\\"P42\\\">7.2 Review Period. Unless otherwise stated in the SOW, Client
      will have [10] business days to test and either (a) provide written Acceptance
      or (b) provide a written list of material non-conformities. If Client does not
      respond within the Review Period, the Deliverable is deemed Accepted. For Deliverables
      classified as \\\"Critical\\\" in the SOW, the Review Period shall be three
      (3) business days.</paragraph>\\n<paragraph id=\\\"P43\\\">7.3 Corrections.
      Upon receipt of a valid rejection notice, Developer will address the non-conformities
      and resubmit the Deliverable. The Parties will repeat the review process.</paragraph>\\n<paragraph
      id=\\\"P44\\\">7.4 Partial Acceptance. Client may Accept portions of a Deliverable
      that meet the Acceptance Criteria, with remaining items tracked for remediation.</paragraph>\\n<paragraph
      id=\\\"P45\\\">8. CLIENT RESPONSIBILITIES</paragraph>\\n<paragraph id=\\\"P46\\\">8.1
      Information and Access. Client will timely provide access to systems, environments,
      credentials, data, and personnel as needed.</paragraph>\\n<paragraph id=\\\"P47\\\">8.2
      Content. Client is responsible for the accuracy, legality, and non-infringing
      nature of all content, data, and materials it provides.</paragraph>\\n<paragraph
      id=\\\"P48\\\">8.3 Approvals. Client will provide timely feedback and approvals.
      Delays may impact schedule and fees.</paragraph>\\n<paragraph id=\\\"P49\\\">8.4
      Third-Party Licenses. Unless otherwise stated in a SOW, Client will obtain licenses
      and approvals for Third-Party Materials it requires to be used in the Deliverables.</paragraph>\\n<paragraph
      id=\\\"P50\\\">9. DEVELOPER RESPONSIBILITIES</paragraph>\\n<paragraph id=\\\"P51\\\">9.1
      Professional Services. Developer will perform the Services in a professional
      and workmanlike manner using personnel with appropriate skills and experience.</paragraph>\\n<paragraph
      id=\\\"P52\\\">9.2 Subcontractors. Developer may use subcontractors but remains
      responsible for their performance. Developer will ensure subcontractors are
      bound by confidentiality and IP assignment obligations consistent with this
      Agreement.</paragraph>\\n<paragraph id=\\\"P53\\\">9.3 Compliance. Developer
      will comply with applicable laws and regulations in providing the Services and
      will follow the security and privacy controls in Exhibit D and Exhibit E (DPA),
      if applicable.</paragraph>\\n<paragraph id=\\\"P54\\\">10. PERSONNEL</paragraph>\\n<paragraph
      id=\\\"P55\\\">10.1 Key Personnel. The SOW may identify key personnel. Developer
      will not remove key personnel from the project without reasonably equivalent
      replacements and prior notice to Client.</paragraph>\\n<paragraph id=\\\"P56\\\">10.2
      Non-Solicitation. During the term and for twelve (12) months thereafter, neither
      Party will directly solicit for employment the other Party\u2019s personnel
      who are materially involved in the project; general advertisements not targeted
      at such personnel are permitted.</paragraph>\\n<paragraph id=\\\"P57\\\">11.
      PROJECT ARTIFACTS AND DOCUMENTATION</paragraph>\\n<paragraph id=\\\"P58\\\">11.1
      Source Control. Unless otherwise stated, all source code for Work Product shall
      be stored in a version control system accessible to Client.</paragraph>\\n<paragraph
      id=\\\"P59\\\">11.2 Documentation. Developer will provide Documentation sufficient
      for installation, configuration, operation, and maintenance of the Deliverables.</paragraph>\\n<paragraph
      id=\\\"P60\\\">11.3 Training. If specified in the SOW, Developer will provide
      training sessions and materials.</paragraph>\\n<paragraph id=\\\"P61\\\">12.
      SECURITY, PRIVACY, AND COMPLIANCE</paragraph>\\n<paragraph id=\\\"P62\\\">12.1
      Security Program. Developer will maintain an information security program appropriate
      to the risk and in line with recognized frameworks (e.g., ISO 27001, SOC 2,
      NIST CSF).</paragraph>\\n<paragraph id=\\\"P63\\\">12.2 Data Protection. Where
      Developer processes Personal Data (as defined in Exhibit E), the Data Protection
      Addendum in Exhibit E applies.</paragraph>\\n<paragraph id=\\\"P64\\\">12.3
      Vulnerability Management. Developer will remediate critical and high-risk vulnerabilities
      within commercially reasonable timeframes or as specified in Exhibit D.</paragraph>\\n<paragraph
      id=\\\"P65\\\">12.4 Incident Response. Developer will notify Client of confirmed
      security incidents affecting the Deliverables or Client Data without undue delay
      and cooperate in investigation and remediation.</paragraph>\\n<paragraph id=\\\"P66\\\">12.5
      Compliance. Where applicable, Deliverables will be designed to support compliance
      requirements listed in the SOW (e.g., GDPR, CCPA, HIPAA, PCI DSS), with Client
      responsible for its own organizational compliance obligations.</paragraph>\\n<paragraph
      id=\\\"P67\\\">13. OPEN SOURCE AND THIRD-PARTY MATERIALS; AI USE</paragraph>\\n<paragraph
      id=\\\"P68\\\">13.1 OSS Management. Developer may use OSS consistent with Exhibit
      H. Developer shall not include copyleft OSS that would require disclosure of
      Client proprietary code without Client\u2019s prior written consent. Notwithstanding
      the foregoing, Developer may include GPLv3-licensed build or test dependencies
      without prior written consent.</paragraph>\\n<paragraph id=\\\"P69\\\">13.2
      Third-Party Services. Any required Third-Party Materials or services will be
      identified in the SOW or Exhibit I. Client is responsible for related fees unless
      otherwise stated.</paragraph>\\n<paragraph id=\\\"P70\\\">13.3 AI/ML and Generative
      AI. If AI-assisted tools are used, Developer will ensure outputs are reviewed
      for quality, originality, and license compliance. Developer shall not submit
      Client Confidential Information to public AI services without written approval.</paragraph>\\n<paragraph
      id=\\\"P71\\\">14. INTELLECTUAL PROPERTY</paragraph>\\n<paragraph id=\\\"P72\\\">14.1
      Ownership of Work Product. Subject to Section 14.2, upon full payment of all
      amounts due, Developer hereby assigns to Client all right, title, and interest
      in and to the Work Product (excluding Developer Background IP and Third-Party
      Materials), including all Intellectual Property Rights therein.</paragraph>\\n<paragraph
      id=\\\"P73\\\">14.2 Background IP. Each Party retains ownership of its Background
      IP. To the extent Developer Background IP is incorporated into the Work Product,
      Developer grants to Client a perpetual, worldwide, non-exclusive, royalty-free
      license to use, execute, reproduce, display, perform, and create derivative
      works of such Background IP solely as part of or in connection with the Work
      Product.</paragraph>\\n<paragraph id=\\\"P74\\\">14.3 Third-Party Materials.
      Third-Party Materials are subject to their respective license terms. Developer
      will identify such materials and applicable licenses in Exhibit I or the SOW.</paragraph>\\n<paragraph
      id=\\\"P75\\\">14.4 Moral Rights. To the extent permitted by law, Developer
      will secure waivers of moral rights in the Work Product from its personnel and
      subcontractors.</paragraph>\\n<paragraph id=\\\"P76\\\">15. FEES, INVOICING,
      AND PAYMENT</paragraph>\\n<paragraph id=\\\"P77\\\">15.1 Fees. Fees will be
      as specified in each SOW. Fees may be fixed-price, time-and-materials at the
      rates in Exhibit B, or a hybrid.</paragraph>\\n<paragraph id=\\\"P78\\\">15.2
      Invoicing. Unless otherwise specified in the SOW, Developer will invoice monthly
      in arrears for time-and-materials, and per milestone for fixed-price.</paragraph>\\n<paragraph
      id=\\\"P79\\\">15.3 Payment Terms. Payments are due within [30] days of invoice
      date. Late amounts accrue interest at the lesser of 1.5% per month or the maximum
      allowed by law. Notwithstanding the foregoing, invoices for fixed-price milestones
      are due within ten (10) days of receipt.</paragraph>\\n<paragraph id=\\\"P80\\\">15.4
      Disputed Amounts. Client may withhold payment of disputed amounts with written
      notice specifying the basis for dispute. The Parties will promptly attempt to
      resolve disputes in good faith.</paragraph>\\n<paragraph id=\\\"P81\\\">15.5
      Expenses. Pre-approved, reasonable out-of-pocket travel and related expenses
      will be reimbursed at cost per Section 18.</paragraph>\\n<paragraph id=\\\"P82\\\">16.
      TAXES</paragraph>\\n<paragraph id=\\\"P83\\\">16.1 Taxes. Fees are exclusive
      of taxes. Client is responsible for all applicable sales, use, VAT, GST, and
      similar taxes, excluding taxes based on Developer\u2019s income.</paragraph>\\n<paragraph
      id=\\\"P84\\\">16.2 Withholding. If withholding is required by law, Client shall
      gross up payments so Developer receives the full amount invoiced, unless a valid
      exemption applies.</paragraph>\\n<paragraph id=\\\"P85\\\">17. SUPPORT, MAINTENANCE,
      AND SERVICE LEVELS</paragraph>\\n<paragraph id=\\\"P86\\\">17.1 Support Tiers.
      If support is included, Developer will provide Tier 1 (end-user triage, FAQ),
      Tier 2 (application-level troubleshooting), and Tier 3 (engineering-level remediation)
      as described in Exhibit C.</paragraph>\\n<paragraph id=\\\"P87\\\">17.2 Service
      Levels. Uptime, incident response times, and resolution targets are set forth
      in Exhibit C.</paragraph>\\n<paragraph id=\\\"P88\\\">17.3 Maintenance Windows.
      Regular maintenance windows and change management procedures will be defined
      in Exhibit C or the SOW.</paragraph>\\n<paragraph id=\\\"P89\\\">17.4 Out-of-Scope
      Support. Work outside defined support scope will be billed at rates in Exhibit
      B unless otherwise stated.</paragraph>\\n<paragraph id=\\\"P90\\\">18. EXPENSES</paragraph>\\n<paragraph
      id=\\\"P91\\\">18.1 Pre-Approval. Expenses must be pre-approved in writing by
      Client.</paragraph>\\n<paragraph id=\\\"P92\\\">18.2 Receipts. Developer will
      provide reasonable documentation for reimbursable expenses.</paragraph>\\n<paragraph
      id=\\\"P93\\\">19. HOSTING AND DEVOPS</paragraph>\\n<paragraph id=\\\"P94\\\">19.1
      Hosting Model. The SOW will specify whether hosting is provided by Client, Developer,
      or a third-party platform (e.g., AWS, Azure, GCP).</paragraph>\\n<paragraph
      id=\\\"P95\\\">19.2 CI/CD and Environments. The Parties will define environments
      (dev/test/stage/prod), branching strategy, and deployment processes. Infrastructure-as-code
      is preferred where applicable.</paragraph>\\n<paragraph id=\\\"P96\\\">19.3
      Monitoring and Logging. Appropriate monitoring, alerting, and logging will be
      implemented as described in Exhibit C and Exhibit D.</paragraph>\\n<paragraph
      id=\\\"P97\\\">20. WARRANTIES</paragraph>\\n<paragraph id=\\\"P98\\\">20.1 Performance
      Warranty. For ninety (90) days after Acceptance, Developer warrants that the
      Work Product will materially conform to the SOW and Documentation. For time-and-materials
      engagements, the warranty period shall be sixty (60) days after Acceptance.</paragraph>\\n<paragraph
      id=\\\"P99\\\">20.2 Services Warranty. Developer warrants it will perform Services
      in a professional and workmanlike manner.</paragraph>\\n<paragraph id=\\\"P100\\\">20.3
      Virus-Free. Developer warrants that, to its knowledge using commercially reasonable
      scanning tools, Deliverables are free from known malicious code at the time
      of delivery.</paragraph>\\n<paragraph id=\\\"P101\\\">20.4 Exclusions. Warranties
      do not apply to issues caused by (a) modifications not made by Developer, (b)
      misuse or use not in accordance with Documentation, (c) third-party systems,
      or (d) Client\u2019s failure to follow reasonable instructions.</paragraph>\\n<paragraph
      id=\\\"P102\\\">20.5 Remedies. Developer\u2019s sole obligation and Client\u2019s
      exclusive remedy for breach of warranty is repair or replacement of the nonconforming
      Deliverable, or if not feasible, refund of the fees paid for the affected Deliverable.</paragraph>\\n<paragraph
      id=\\\"P103\\\">21. INDEMNIFICATION</paragraph>\\n<paragraph id=\\\"P104\\\">21.1
      By Developer. Developer will defend, indemnify, and hold harmless Client against
      third-party claims alleging that the Work Product infringes or misappropriates
      such third party\u2019s Intellectual Property Rights, and pay resulting damages,
      costs, and reasonable attorneys\u2019 fees finally awarded by a court or agreed
      in settlement.</paragraph>\\n<paragraph id=\\\"P105\\\">21.2 Exclusions. Developer
      has no obligation for claims arising from (a) Client content or specifications,
      (b) combinations with items not provided by Developer, (c) modifications not
      made by Developer, or (d) use after Developer provides a non-infringing alternative.</paragraph>\\n<paragraph
      id=\\\"P106\\\">21.3 Mitigation. If a Deliverable is or is likely to be enjoined,
      Developer may procure a license, modify to be non-infringing, or replace with
      equivalent functionality. If none are commercially reasonable, Developer may
      terminate the affected SOW and refund prepaid fees for the unused portion.</paragraph>\\n<paragraph
      id=\\\"P107\\\">21.4 By Client. Client will defend, indemnify, and hold harmless
      Developer against third-party claims arising from Client content, data, or instructions
      provided to Developer that infringe or violate third-party rights or law.</paragraph>\\n<paragraph
      id=\\\"P108\\\">21.5 Procedure. The indemnified Party must promptly notify the
      indemnifying Party, provide reasonable cooperation, and grant control of the
      defense, subject to the right to participate at its own expense.</paragraph>\\n<paragraph
      id=\\\"P109\\\">21.6 Aggregate Cap for IP Claims. Notwithstanding Section 22.2,
      Developer\u2019s liability for IP infringement claims shall be uncapped.</paragraph>\\n<paragraph
      id=\\\"P110\\\">22. LIMITATION OF LIABILITY</paragraph>\\n<paragraph id=\\\"P111\\\">22.1
      Exclusion of Damages. Except for Excluded Claims, neither Party will be liable
      for indirect, incidental, special, consequential, punitive, or exemplary damages,
      or for lost profits, revenues, goodwill, or data, even if advised of the possibility.</paragraph>\\n<paragraph
      id=\\\"P112\\\">22.2 Cap. Except for Excluded Claims, each Party\u2019s total
      aggregate liability arising out of or related to this Agreement shall not exceed
      the total fees paid or payable under the applicable SOW during the twelve (12)
      months preceding the event giving rise to liability.</paragraph>\\n<paragraph
      id=\\\"P113\\\">22.3 Excluded Claims. \\\"Excluded Claims\\\" means (a) a Party\u2019s
      indemnification obligations, (b) a Party\u2019s breach of confidentiality obligations,
      (c) infringement or misappropriation of the other Party\u2019s IPR, and (d)
      a Party\u2019s gross negligence or willful misconduct.</paragraph>\\n<paragraph
      id=\\\"P114\\\">23. CONFIDENTIALITY</paragraph>\\n<paragraph id=\\\"P115\\\">23.1
      Definition. \\\"Confidential Information\\\" means non-public information disclosed
      by a Party (\\\"Discloser\\\") to the other Party (\\\"Recipient\\\") that is
      marked confidential or reasonably should be understood to be confidential, including
      business, technical, financial information, product plans, code, and data.</paragraph>\\n<paragraph
      id=\\\"P116\\\">23.2 Obligations. Recipient will (a) use Confidential Information
      solely to perform this Agreement, (b) not disclose it to third parties except
      to its personnel and subcontractors who need to know and are bound by confidentiality
      obligations at least as protective, and (c) protect it using reasonable measures.</paragraph>\\n<paragraph
      id=\\\"P117\\\">23.3 Exclusions. Confidential Information does not include information
      that is (a) publicly available without breach, (b) independently developed without
      use of the Discloser\u2019s information, (c) rightfully received from a third
      party without confidentiality obligations, or (d) approved for release in writing.</paragraph>\\n<paragraph
      id=\\\"P118\\\">23.4 Compelled Disclosure. Recipient may disclose Confidential
      Information to the extent required by law or court order, provided it uses reasonable
      efforts to provide advance notice to Discloser and cooperates in seeking protective
      treatment.</paragraph>\\n<paragraph id=\\\"P119\\\">23.5 Return/Destruction.
      Upon request or termination, Recipient will return or destroy Confidential Information,
      except that one archival copy may be retained for legal compliance.</paragraph>\\n<paragraph
      id=\\\"P120\\\">24. PUBLICITY</paragraph>\\n<paragraph id=\\\"P121\\\">24.1
      Publicity Rights. Neither Party shall issue press releases or public statements
      referencing the other Party or the project without prior written consent, except
      that Client may be named as a customer and Developer as a vendor in standard
      customer or vendor lists unless the SOW states otherwise.</paragraph>\\n<paragraph
      id=\\\"P122\\\">25. AUDIT AND RECORDS</paragraph>\\n<paragraph id=\\\"P123\\\">25.1
      Records. Developer will maintain accurate records of time-and-materials charges
      and reimbursable expenses for at least two (2) years after invoice.</paragraph>\\n<paragraph
      id=\\\"P124\\\">25.2 Audit. Upon reasonable notice and during normal business
      hours, Client may audit such records no more than once per year to verify invoices;
      audits shall not unreasonably disrupt Developer\u2019s operations.</paragraph>\\n<paragraph
      id=\\\"P125\\\">26. INSURANCE</paragraph>\\n<paragraph id=\\\"P126\\\">26.1
      Coverage. Developer will maintain commercially reasonable insurance coverage
      during the term, which may include: (a) Commercial General Liability; (b) Professional/Technology
      Errors & Omissions; (c) Cyber Liability; (d) Workers\u2019 Compensation as required
      by law.</paragraph>\\n<paragraph id=\\\"P127\\\">26.2 Certificates. Upon request,
      Developer will provide certificates of insurance.</paragraph>\\n<paragraph id=\\\"P128\\\">27.
      TERM; TERMINATION; SUSPENSION</paragraph>\\n<paragraph id=\\\"P129\\\">27.1
      Term. This Agreement commences on the Effective Date and continues until terminated
      as provided herein. Each SOW has its own term as specified therein.</paragraph>\\n<paragraph
      id=\\\"P130\\\">27.2 Termination for Convenience. Either Party may terminate
      this Agreement or any SOW for convenience upon [30] days\u2019 prior written
      notice. In such case, Client will pay for Services performed and non-cancellable
      commitments incurred through the effective termination date. For SOWs with a
      total value under $50,000, either Party may terminate for convenience upon five
      (5) days\u2019 prior written notice.</paragraph>\\n<paragraph id=\\\"P131\\\">27.3
      Termination for Cause. Either Party may terminate this Agreement or an SOW upon
      written notice if the other Party materially breaches and fails to cure within
      [30] days after written notice specifying the breach.</paragraph>\\n<paragraph
      id=\\\"P132\\\">27.4 Suspension. Developer may suspend work upon written notice
      if undisputed invoices are more than [30] days overdue and not cured within
      ten (10) days after notice.</paragraph>\\n<paragraph id=\\\"P133\\\">27.5 Effect
      of Termination. Upon termination, Developer will deliver to Client all Work
      Product completed and paid for through the termination date and provide reasonable
      transition assistance at then-current rates.</paragraph>\\n<paragraph id=\\\"P134\\\">28.
      FORCE MAJEURE</paragraph>\\n<paragraph id=\\\"P135\\\">28.1 Neither Party is
      liable for delays or failures caused by events beyond its reasonable control
      (e.g., acts of God, war, terrorism, labor disputes, government actions, failures
      of suppliers, or widespread outages) provided it uses commercially reasonable
      efforts to mitigate and resumes performance promptly.</paragraph>\\n<paragraph
      id=\\\"P136\\\">29. DISPUTE RESOLUTION; GOVERNING LAW</paragraph>\\n<paragraph
      id=\\\"P137\\\">29.1 Escalation. The Parties will attempt in good faith to resolve
      disputes through executive-level negotiations.</paragraph>\\n<paragraph id=\\\"P138\\\">29.2
      Mediation/Arbitration. If not resolved within thirty (30) days, disputes may
      be submitted to non-binding mediation, and if still unresolved, to binding arbitration
      under the rules stated in the SOW or by mutual agreement. Either Party may seek
      injunctive relief in a court of competent jurisdiction.</paragraph>\\n<paragraph
      id=\\\"P139\\\">29.3 Governing Law and Venue. The governing law and venue shall
      be as specified in the SOW, without regard to conflict of laws principles and
      excluding the U.N. Convention on Contracts for the International Sale of Goods.</paragraph>\\n<paragraph
      id=\\\"P140\\\">30. NOTICES</paragraph>\\n<paragraph id=\\\"P141\\\">30.1 Notices
      must be in writing and delivered by personal delivery, reputable overnight courier,
      or certified mail (return receipt requested) to the addresses below, or to updated
      addresses provided by notice.</paragraph>\\n<paragraph id=\\\"P142\\\">30.2
      Notices to Client: Attn: Sarah Patel, VP, Legal, 123 Market Street, Suite 500,
      San Francisco, CA 94105, USA, legal@orioncommerce.com</paragraph>\\n<paragraph
      id=\\\"P143\\\">30.3 Notices to Developer: Attn: Daniel Kim, Managing Member,
      600 17th Street, Suite 2800, Denver, CO 80202, USA, legal@novadigitalsolutions.com</paragraph>\\n<paragraph
      id=\\\"P144\\\">31. ASSIGNMENT; SUBCONTRACTING</paragraph>\\n<paragraph id=\\\"P145\\\">31.1
      Assignment. Neither Party may assign this Agreement without the other Party\u2019s
      prior written consent, except to an Affiliate or in connection with a merger,
      acquisition, or sale of substantially all assets, provided the assignee assumes
      all obligations.</paragraph>\\n<paragraph id=\\\"P146\\\">31.2 Subcontracting.
      Developer may subcontract portions of the Services but remains responsible for
      subcontractor performance.</paragraph>\\n<paragraph id=\\\"P147\\\">32. GENERAL</paragraph>\\n<paragraph
      id=\\\"P148\\\">32.1 Entire Agreement. This Agreement, together with all SOWs
      and Exhibits, constitutes the entire agreement and supersedes all prior discussions
      and agreements on the subject matter.</paragraph>\\n<paragraph id=\\\"P149\\\">32.2
      Amendments. Any amendment must be in writing and signed by authorized representatives
      of both Parties.</paragraph>\\n<paragraph id=\\\"P150\\\">32.3 Severability.
      If any provision is held invalid, the remainder will remain in effect, and the
      Parties will replace the invalid provision with one that most closely reflects
      the original intent.</paragraph>\\n<paragraph id=\\\"P151\\\">32.4 Waiver. Failure
      to enforce a provision is not a waiver of future enforcement of that or any
      other provision.</paragraph>\\n<paragraph id=\\\"P152\\\">32.5 Counterparts;
      Electronic Signatures. This Agreement may be executed in counterparts, including
      via electronic signature, each of which is deemed an original.</paragraph>\\n<paragraph
      id=\\\"P153\\\">32.6 Governing Law Override. Notwithstanding Section 29.3, this
      Agreement shall be governed by the laws of the State of Delaware, without regard
      to its conflicts of laws rules.</paragraph>\\n<paragraph id=\\\"P154\\\">IN
      WITNESS WHEREOF, the Parties have executed this Agreement as of the Effective
      Date.</paragraph>\\n<paragraph id=\\\"P155\\\">CLIENT:</paragraph>\\n<paragraph
      id=\\\"P156\\\">Orion Commerce, Inc.</paragraph>\\n<paragraph id=\\\"P157\\\">By:
