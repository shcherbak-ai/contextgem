      Service Credits (Optional)</paragraph>\\n<paragraph id=\\\"P220\\\">- Credits
      for failing to meet uptime or response targets, capped at [x]% of monthly fees</paragraph>\\n<paragraph
      id=\\\"P221\\\">- For outages exceeding four (4) hours in a calendar month,
      credit equal to 25% of monthly fees for the affected Service</paragraph>\\n<paragraph
      id=\\\"P222\\\">EXHIBIT D: SECURITY CONTROLS CHECKLIST</paragraph>\\n<paragraph
