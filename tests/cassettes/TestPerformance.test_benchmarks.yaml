      id=\\\"P230\\\">- Secure configuration: CIS benchmarks where applicable</paragraph>\\n<paragraph
      id=\\\"P231\\\">- Business continuity: backups, DR strategy, recovery time objectives</paragraph>\\n<paragraph
      id=\\\"P232\\\">EXHIBIT E: DATA PROTECTION ADDENDUM (SUMMARY)</paragraph>\\n<paragraph
      id=\\\"P233\\\">1. Roles and Scope</paragraph>\\n<paragraph id=\\\"P234\\\">-
      Client is the Controller, Developer is the Processor with respect to Personal
      Data processed under the SOW.</paragraph>\\n<paragraph id=\\\"P235\\\">- For
      any analytics features, Developer is an independent Controller for telemetry
      collected to improve generic platform services.</paragraph>\\n<paragraph id=\\\"P236\\\">2.
      Processing Details</paragraph>\\n<paragraph id=\\\"P237\\\">- Subject matter,
      duration, nature, and purpose of processing</paragraph>\\n<paragraph id=\\\"P238\\\">-
      Categories of data subjects and personal data</paragraph>\\n<paragraph id=\\\"P239\\\">3.
      Processor Obligations</paragraph>\\n<paragraph id=\\\"P240\\\">- Process only
      on documented instructions from Client</paragraph>\\n<paragraph id=\\\"P241\\\">-
      Confidentiality commitments for personnel</paragraph>\\n<paragraph id=\\\"P242\\\">-
      Security measures (aligned to Exhibit D)</paragraph>\\n<paragraph id=\\\"P243\\\">-
      Subprocessor controls and approval</paragraph>\\n<paragraph id=\\\"P244\\\">-
      Assistance with data subject requests and DPIAs</paragraph>\\n<paragraph id=\\\"P245\\\">4.
      International Transfers</paragraph>\\n<paragraph id=\\\"P246\\\">- Appropriate
      safeguards (e.g., SCCs) if transferring outside permitted jurisdictions</paragraph>\\n<paragraph
      id=\\\"P247\\\">5. Audit Rights</paragraph>\\n<paragraph id=\\\"P248\\\">- Reasonable
      audits or provision of third-party reports (e.g., SOC 2)</paragraph>\\n<paragraph
      id=\\\"P249\\\">6. Deletion/Return</paragraph>\\n<paragraph id=\\\"P250\\\">-
