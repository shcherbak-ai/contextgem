      Annual rate review/adjustment terms (if any)\\n\\n\\nEXHIBIT C: SERVICE LEVEL
      AGREEMENT (SLA)\\n1. Availability Targets\\n- Production availability: 99.9%
      monthly\\n- Exclusions: planned maintenance, force majeure, third-party outages
      beyond control\\n\\n2. Incident Response\\n- Severity 1 (Critical): Response
      within [30 minutes], workaround within [4 hours], resolution within [8 hours]\\n-
      Severity 2 (High): Response within [2 hours], workaround within [1 business
      day], resolution within [3 business days]\\n- Severity 3 (Medium): Response
      within [1 business day], resolution within [5 business days]\\n- Severity 4
