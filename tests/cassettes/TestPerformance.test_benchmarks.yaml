      id=\\\"P232\\\">EXHIBIT E: DATA PROTECTION ADDENDUM (SUMMARY)</paragraph>\\n<paragraph
      id=\\\"P233\\\">1. Roles and Scope</paragraph>\\n<paragraph id=\\\"P234\\\">-
