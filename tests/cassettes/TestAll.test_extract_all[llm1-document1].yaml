      \       <additional_context>\\n        Style: Normal\\n        </additional_context>\\n
      \   </paragraph>\\n\\n    <paragraph id=\\\"P23\\\">\\n        <paragraph_id>P23</paragraph_id>\\n
      \       \\n        <paragraph_text>\\n        ## Obligations of Receiving Party\\n
