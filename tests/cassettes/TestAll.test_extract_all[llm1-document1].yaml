      sentences (such as formatting, list context, or table position) will be provided
      within <additional_context></additional_context> tags, which provides important
      context for understanding their structural role and position within the document.
      Use this information to:\n        -- Understand document hierarchy (e.g., headings
      indicate section boundaries)\n        -- Recognize relationships between content
      (e.g., list items are related, table cells contain associated data)\n        --
      Assess content significance (e.g., styled text may indicate importance)\n    -
      Note that paragraphs are listed in the same order they appear in the original
