      (must be exactly as specified)</extracted_item_type>\n</concept>\n\n</concepts>\n\n<document_paragraphs>\nDOCUMENT
      PARAGRAPHS INCLUDING SENTENCES:\n    <paragraph id=\"P0\">\n        <paragraph_id>P0</paragraph_id>\n        \n        <additional_context>\n        Style:
      Normal\n        </additional_context>\n        \n        <paragraph_sentences>\n            <sentence
      id=\"P0-S0\">\n                <sentence_id>P0-S0</sentence_id>\n                \n                <sentence_text>\n                Upon
      termination of this Agreement or upon request, the Receiving Party shall return
