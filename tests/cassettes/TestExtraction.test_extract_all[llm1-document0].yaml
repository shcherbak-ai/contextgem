      \   </paragraph>\\n\\n    <paragraph id=\\\"P33\\\">\\n        <paragraph_id>P33</paragraph_id>\\n
      \       \\n        <paragraph_text>\\n        d. Is independently developed
      by the Receiving Party without use of or reference to the Disclosing Party's
