      termination of this Agreement or upon request, the Receiving Party shall return
      all materials containing Confidential Information to the Disclosing Party or
      destroy them, at the Disclosing Party''s discretion.\n                </sentence_text>\n            </sentence>\n        </paragraph_sentences>\n    </paragraph>\n\n    <paragraph
      id=\"P1\">\n        <paragraph_id>P1</paragraph_id>\n        \n        <paragraph_sentences>\n            <sentence
      id=\"P1-S0\">\n                <sentence_id>P1-S0</sentence_id>\n                \n                <sentence_text>\n                All
      disputes shall be resolved by the courts of the State of California.\n                </sentence_text>\n            </sentence>\n            <sentence
      id=\"P1-S1\">\n                <sentence_id>P1-S1</sentence_id>\n                \n                <sentence_text>\n                This
