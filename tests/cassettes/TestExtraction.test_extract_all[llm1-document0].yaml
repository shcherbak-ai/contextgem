      of this Agreement is found to be unenforceable, the remainder shall be enforced
      as fully as possible and the unenforceable provision shall be deemed modified
      to the limited extent required to permit its enforcement in a manner most closely
      representing the intention of the parties.</paragraph>\\n<paragraph id=\\\"P50\\\">d.
      The Disclosing Party shall be a good person to execute this contract.</paragraph>\\n<paragraph
      id=\\\"P51\\\">IN WITNESS WHEREOF, the parties hereto have executed this Non-Disclosure
      Agreement as of the date first above written.</paragraph>\\n<paragraph id=\\\"P52\\\">_____</paragraph>\\n<paragraph
