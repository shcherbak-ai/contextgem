      concept specifies a structure, rating scale, or available labels, align inclusion/exclusion
      criteria with those constraints.\n    - For each concept, plan how to synthesize
      the output value from the available evidence even when no literal span is present.\n\n2.
      Evidence triage\n    - Evaluate the provided content at paragraph and sentence
      levels; derive candidate extractions/values for the concepts (explicit or inferred
      from context).\n    - Collect minimal sufficient evidence privately and note
      negated, hypothetical, or conditional forms.\n    - Prefer precision over recall;
      include only high-confidence items and omit weak or ambiguous ones.\n\n3. Consistency
      pass\n    - Ensure all extracted items strictly match required types and any
      specified structure, rating scales, or label constraints.\n    - Deduplicate
      referenced paragraph and sentence IDs and preserve their original order.\n    -
      Ensure justifications align with the item''s evidence and stance, and comply
      with length and language constraints.\n\nNever disclose any plan, evidence,
      or internal notes - only the JSON array defined within <answer_format></answer_format>
      tags.\n</private_reasoning>\n\n<task_description>\nYour task is to:\n1. Read
      through the provided document paragraphs and their sentences.\n    - Each paragraph
      is identified by a paragraph ID (for example, \"P0\", \"P1\", etc.) specified
      within <paragraph_id></paragraph_id> tags.\n    - Each paragraph includes sentences,
      each identified by a sentence ID (for example, \"P0-S0\", \"P0-S1\", etc.) specified
      within <sentence_id></sentence_id> tags, followed by the full text of the sentence
      specified within <sentence_text></sentence_text> tags.\n    - Note that paragraphs
      are listed in the same order they appear in the original document.\n    - You
      may be working with document fragments rather than complete documents. Focus
      on extracting information from the available content without making assumptions
      about missing parts.\n2. Identify whether each concept in the concepts list
      is addressed within the document paragraphs.\n    - Each concept is identified
