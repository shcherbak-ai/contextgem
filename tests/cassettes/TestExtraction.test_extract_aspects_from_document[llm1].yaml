      id=\"P1\">\n        <paragraph_id>P1</paragraph_id>\n        \n        <paragraph_text>\n        4.
      Exclusions from Confidential Information:\n        </paragraph_text>\n    </paragraph>\n\n    <paragraph
      id=\"P2\">\n        <paragraph_id>P2</paragraph_id>\n        \n        <paragraph_text>\n        Confidential
      Information does not include information that:\n        </paragraph_text>\n    </paragraph>\n\n    <paragraph
      id=\"P3\">\n        <paragraph_id>P3</paragraph_id>\n        \n        <paragraph_text>\n        a.
