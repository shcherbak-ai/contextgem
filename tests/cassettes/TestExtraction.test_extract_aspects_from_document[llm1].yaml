      ASPECTS:\\n    <aspect id=\\\"A0\\\">\\n        <aspect_id>A0</aspect_id>\\n
      \       \\n        <aspect_name>Term</aspect_name>\\n        \\n        <aspect_description>\\n
      \       Clauses addressing term of the contract\\n        </aspect_description>\\n
      \   </aspect>\\n\\n</aspects>\\n\\n<document_paragraphs>\\nDOCUMENT PARAGRAPHS:\\n<paragraph
      id=\\\"P0\\\">a. Is or becomes publicly known through no wrongful act of the
      Receiving Party.</paragraph>\\n<paragraph id=\\\"P1\\\">b. Is already known
      to the Receiving Party at the time of disclosure.</paragraph>\\n<paragraph id=\\\"P2\\\">c.
      Is lawfully received from a third party without breach of this Agreement.</paragraph>\\n<paragraph
      id=\\\"P3\\\">d. Is independently developed by the Receiving Party without use
      of or reference to the Disclosing Party's Confidential Information.</paragraph>\\n<paragraph
      id=\\\"P4\\\">6. Return of Materials:</paragraph>\\n<paragraph id=\\\"P5\\\">Upon
