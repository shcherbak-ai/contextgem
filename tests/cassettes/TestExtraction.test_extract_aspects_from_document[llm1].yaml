      id=\\\"P3\\\">d. Is independently developed by the Receiving Party without use
      of or reference to the Disclosing Party's Confidential Information.</paragraph>\\n<paragraph
      id=\\\"P4\\\">6. Return of Materials:</paragraph>\\n<paragraph id=\\\"P5\\\">Upon
      termination of this Agreement or upon request, the Receiving Party shall return
      all materials containing Confidential Information to the Disclosing Party or
      destroy them, at the Disclosing Party's discretion.</paragraph>\\n<paragraph
      id=\\\"P6\\\">5. Liability:</paragraph>\\n<paragraph id=\\\"P7\\\">a. Total
      Liability Cap:</paragraph>\\n<paragraph id=\\\"P8\\\">The total liability of
      either party for any and all claims arising out of or related to this Agreement,
      whether in contract, tort, or otherwise, shall not exceed the greater of (i)
      $100,000 or (ii) the total amount paid by the Receiving Party to the Disclosing
      Party under any separate business agreement between the parties during the twelve
      (12) months preceding the event giving rise to the claim. This limitation of
      liability is cumulative and not per incident.</paragraph>\\n<paragraph id=\\\"P9\\\">b.
      Penalties for Breach:</paragraph>\\n<paragraph id=\\\"P10\\\">In the event of
      a breach of this Agreement by the Receiving Party, the Disclosing Party shall
      be entitled to seek injunctive relief in addition to any other remedy available
      at law or in equity. The Receiving Party acknowledges that a breach of this
