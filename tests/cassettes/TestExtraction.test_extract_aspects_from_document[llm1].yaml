      has actual or potential economic value by virtue of not being generally known
      to, and not being readily ascertainable by proper means by, other persons who
      can obtain economic value from its disclosure or use, or (ii) is subject to
      reasonable efforts by Disclosing Party to maintain its secrecy and confidentiality.</sentence>\n</paragraph>\n<paragraph
      id=\"P20\">\n<sentence id=\"P20-S0\">Confidential Information includes, but
      is not limited to, the following categories: (1) business information (business
      plans, strategies, and models), (2) technical information (technical specifications
      and documentation, research and development activities), (3) customer and market
      information (customer lists and contact information, sales histories and patterns),
      (4) personnel and internal information (employee lists and contact information,
      employment agreements and personnel files), (5) intellectual property (trade
      secrets and know-how, patents and patent applications, copyrights and copyright
      applications, trademarks and trademark applications), (6) strategic information
      (merger and acquisition plans, competitive analyses and strategies).</sentence>\n<sentence
      id=\"P20-S1\">Software code shall also be included into the confidential information.</sentence>\n</paragraph>\n<paragraph
      id=\"P21\">\n<sentence id=\"P21-S0\">Confidential Information shall not include
      information that:</sentence>\n<sentence id=\"P21-S1\">(a) is or becomes generally
      available to the public other than as a result of disclosure by Receiving Party
      or its Representatives;</sentence>\n<sentence id=\"P21-S2\">(b) was available
      to Receiving Party on a non-confidential basis prior to its disclosure by Disclosing
      Party;</sentence>\n<sentence id=\"P21-S3\">(c) becomes available to Receiving
      Party on a non-confidential basis from a person other than Disclosing Party
      who is not otherwise bound by a confidentiality obligation to Disclosing Party;
      or (d) was independently developed by Receiving Party without reference to or
      use of any Confidential Information.</sentence>\n<sentence id=\"P21-S4\">The
      name of the dog of the Receiving Party is Bob.</sentence>\n</paragraph>\n<paragraph
      id=\"P22\">\n<sentence id=\"P22-S0\">The designation of information as Confidential
      Information shall not be determinative of whether such information constitutes
      a trade secret under applicable law.</sentence>\n<sentence id=\"P22-S1\">All
      Confidential Information shall remain the exclusive property of Disclosing Party,
      and Receiving Party shall have no rights, by license or otherwise, to use the
      Confidential Information except as expressly provided herein.</sentence>\n</paragraph>\n<paragraph
      id=\"P23\">\n<sentence id=\"P23-S0\">3. Obligations of Receiving Party:</sentence>\n</paragraph>\n<paragraph
      id=\"P24\">\n<sentence id=\"P24-S0\">The party receiving Confidential Information
      (\"Receiving Party\") shall:</sentence>\n</paragraph>\n<paragraph id=\"P25\">\n<sentence
      id=\"P25-S0\">a. Maintain the confidentiality of the Confidential Information
      and not disclose it to any third party without the prior written consent of
      the Disclosing Party.</sentence>\n</paragraph>\n<paragraph id=\"P26\">\n<sentence
      id=\"P26-S0\">b. Use the Confidential Information solely for the purpose of
      evaluating or engaging in the potential business collaboration.</sentence>\n</paragraph>\n<paragraph
      id=\"P27\">\n<sentence id=\"P27-S0\">c. Take all necessary precautions to protect
      the confidentiality of the Confidential Information, which shall be no less
      than the precautions it takes to protect its own confidential information.</sentence>\n</paragraph>\n<paragraph
      id=\"P28\">\n<sentence id=\"P28-S0\">4. Exclusions from Confidential Information:</sentence>\n</paragraph>\n<paragraph
      id=\"P29\">\n<sentence id=\"P29-S0\">Confidential Information does not include
      information that:</sentence>\n</paragraph>\n</document_paragraphs>"}],"model":"gpt-6-luna"}'
