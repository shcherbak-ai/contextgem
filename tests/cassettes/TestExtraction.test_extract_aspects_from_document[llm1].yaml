      PARAGRAPHS INCLUDING SENTENCES:\n<paragraph id=\"P0\">\n<sentence id=\"P0-S0\">Title:
      Managing Partner</sentence>\n</paragraph>\n<paragraph id=\"P1\">\n<sentence
      id=\"P1-S0\">Date: ___________________________</sentence>\n</paragraph>\n</document_paragraphs>"}],"model":"gpt-6-luna"}'
