      PARAGRAPHS INCLUDING SENTENCES:\n<paragraph id=\"P0\">\n<sentence id=\"P0-S0\">Non-Disclosure
      Agreement (NDA)</sentence>\n</paragraph>\n<paragraph id=\"P1\">\n<sentence id=\"P1-S0\">This
      Non-Disclosure Agreement (the \"Agreement\") is made and entered into as of
      July 16, 2024, by and between:</sentence>\n</paragraph>\n<paragraph id=\"P2\">\n<sentence
      id=\"P2-S0\">Party A:</sentence>\n</paragraph>\n<paragraph id=\"P3\">\n<sentence
