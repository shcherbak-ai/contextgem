      id=\\\"P15\\\">All disputes shall be resolved by the courts of the State of
      California. This Agreement shall remain in effect for a period of five (5) years
      from the date of signing this agreement.</paragraph>\\n<paragraph id=\\\"P16\\\">9.
      Miscellaneous:</paragraph>\\n<paragraph id=\\\"P17\\\">a. This Agreement constitutes
