      Only output the JSON array according to the format specified within <answer_format></answer_format>
      tags.\n</output_constraints>\n\n<answer_format>\nANSWER FORMAT (MANDATORY):\n[\n    {\n        \"aspect_id\":
      str,\n        \"paragraphs\": [\n            {\n                \"paragraph_id\":
      str,\n                \"sentences\": [\n                    {\n                        \"sentence_id\":
      str,\n                    },\n                    ...\n                ]\n            },\n            ...\n        ]\n    },\n    ...\n]\n</answer_format>\n\n<aspects>\nDOCUMENT
      ASPECTS:\n    <aspect id=\"A0\">\n        <aspect_id>A0</aspect_id>\n        \n        <aspect_name>Exclusions
      from confidential information</aspect_name>\n        \n        <aspect_description>\n        Clauses
      addressing exclusions from the confidential information.\n        </aspect_description>\n    </aspect>\n\n    <aspect
