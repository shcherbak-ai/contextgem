      the JSON array defined within <answer_format></answer_format> tags.\n</private_reasoning>\n\n<task_description>\nYour
      task is to:\n1. Read through the provided document paragraphs and their sentences.\n    -
      Each paragraph is given within <paragraph></paragraph> tags, whose id attribute
      holds its paragraph ID (for example, \"P0\", \"P1\", etc.).\n    - Each paragraph
      includes sentences, each given with its full text within <sentence></sentence>
      tags, whose id attribute holds its sentence ID (for example, \"P0-S0\", \"P0-S1\",
      etc.).\n    - Note that paragraphs are listed in the same order they appear
      in the original document.\n    - You may be working with document fragments
      rather than complete documents. Focus on extracting information from the available
