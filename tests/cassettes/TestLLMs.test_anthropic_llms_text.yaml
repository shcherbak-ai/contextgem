      id=\"P16\">\n        <paragraph_id>P16</paragraph_id>\n        \n        <paragraph_text>\n        1.
      Purpose:\n        </paragraph_text>\n    </paragraph>\n\n    <paragraph id=\"P17\">\n        <paragraph_id>P17</paragraph_id>\n        \n        <paragraph_text>\n        The
      purpose of this Agreement is to protect the confidential information that may
      be disclosed between the parties during discussions and engagements regarding
      potential business collaborations and partnerships.\n        </paragraph_text>\n    </paragraph>\n\n    <paragraph
      id=\"P18\">\n        <paragraph_id>P18</paragraph_id>\n        \n        <paragraph_text>\n        2.
      Definition of Confidential Information:\n        </paragraph_text>\n    </paragraph>\n\n    <paragraph
      id=\"P19\">\n        <paragraph_id>P19</paragraph_id>\n        \n        <paragraph_text>\n        For
      purposes of this Agreement, \"Confidential Information\" means any and all non-public
      information, conveyed in all forms, whether in oral, written, electronic, or
      other form or media, whether or not marked, designated, or otherwise identified
      as \"confidential,\" that has been or may be disclosed to, accessed by, or observed
      by Receiving Party, which (i) has actual or potential economic value by virtue
      of not being generally known to, and not being readily ascertainable by proper
      means by, other persons who can obtain economic value from its disclosure or
      use, or (ii) is subject to reasonable efforts by Disclosing Party to maintain
      its secrecy and confidentiality.\n        </paragraph_text>\n    </paragraph>\n\n    <paragraph
      id=\"P20\">\n        <paragraph_id>P20</paragraph_id>\n        \n        <paragraph_text>\n        Confidential
      Information includes, but is not limited to, the following categories: (1) business
      information (business plans, strategies, and models), (2) technical information
      (technical specifications and documentation, research and development activities),
      (3) customer and market information (customer lists and contact information,
      sales histories and patterns), (4) personnel and internal information (employee
      lists and contact information, employment agreements and personnel files), (5)
      intellectual property (trade secrets and know-how, patents and patent applications,
      copyrights and copyright applications, trademarks and trademark applications),
      (6) strategic information (merger and acquisition plans, competitive analyses
      and strategies). Software code shall also be included into the confidential
      information.\n        </paragraph_text>\n    </paragraph>\n\n    <paragraph
      id=\"P21\">\n        <paragraph_id>P21</paragraph_id>\n        \n        <paragraph_text>\n        Confidential
      Information shall not include information that: (a) is or becomes generally
      available to the public other than as a result of disclosure by Receiving Party
      or its Representatives; (b) was available to Receiving Party on a non-confidential
      basis prior to its disclosure by Disclosing Party; (c) becomes available to
      Receiving Party on a non-confidential basis from a person other than Disclosing
      Party who is not otherwise bound by a confidentiality obligation to Disclosing
      Party; or (d) was independently developed by Receiving Party without reference
      to or use of any Confidential Information. The name of the dog of the Receiving
      Party is Bob.\n        </paragraph_text>\n    </paragraph>\n\n    <paragraph
      id=\"P22\">\n        <paragraph_id>P22</paragraph_id>\n        \n        <paragraph_text>\n        The
      designation of information as Confidential Information shall not be determinative
      of whether such information constitutes a trade secret under applicable law.
      All Confidential Information shall remain the exclusive property of Disclosing
      Party, and Receiving Party shall have no rights, by license or otherwise, to
      use the Confidential Information except as expressly provided herein.\n        </paragraph_text>\n    </paragraph>\n\n    <paragraph
      id=\"P23\">\n        <paragraph_id>P23</paragraph_id>\n        \n        <paragraph_text>\n        3.
