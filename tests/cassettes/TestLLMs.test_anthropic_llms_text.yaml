      id=\"P42\">\n        <paragraph_id>P42</paragraph_id>\n        \n        <paragraph_sentences>\n            <sentence
      id=\"P42-S0\">\n                <sentence_id>P42-S0</sentence_id>\n                \n                <sentence_text>\n                Nothing
