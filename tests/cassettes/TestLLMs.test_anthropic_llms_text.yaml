      str,\n        \"extracted_items\": [\n            {\n                \"value\":
      ...,\n                \"reference_paragraph_ids\": [\n                    str,\n                    ...\n                ]\n            },\n            ...\n        ],\n    },\n    ...\n]\n</answer_format>\n\n<concepts>\nCONCEPTS:\n<concept
      id=\"C0\">\n    <concept_id>C0</concept_id>\n    \n    <concept_name>Effective
      date</concept_name>\n\n    <concept_description>\n    Date as of which the agreement
      is made and entered into\n    </concept_description>\n\n    <amount_of_extracted_items>This
      concept may have zero, one, or multiple extracted items.</amount_of_extracted_items>\n\n    <extracted_item_type>str
      (in ''DD-MM-YYYY'' format) (must be exactly as specified)</extracted_item_type>\n</concept>\n\n</concepts>\n\n<document_paragraphs>\nDOCUMENT
      PARAGRAPHS:\n<paragraph id=\"P0\">Non-Disclosure Agreement (NDA)</paragraph>\n<paragraph
      id=\"P1\">This Non-Disclosure Agreement (the \"Agreement\") is made and entered
      into as of July 16, 2024, by and between:</paragraph>\n<paragraph id=\"P2\">Party
      A:</paragraph>\n<paragraph id=\"P3\">_____</paragraph>\n<paragraph id=\"P4\">_____</paragraph>\n<paragraph
      id=\"P5\">_____</paragraph>\n<paragraph id=\"P6\">Contact: _____</paragraph>\n<paragraph
      id=\"P7\">Phone: _____</paragraph>\n<paragraph id=\"P8\">Email: _____</paragraph>\n<paragraph
      id=\"P9\">Party B:</paragraph>\n<paragraph id=\"P10\">Example.Com LLC</paragraph>\n<paragraph
      id=\"P11\">5678 Random Drive</paragraph>\n<paragraph id=\"P12\">New York, NY
