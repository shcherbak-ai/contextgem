      id=\"P46\">\n        <paragraph_id>P46</paragraph_id>\n        \n        <paragraph_text>\n        9.
      Miscellaneous:\n        </paragraph_text>\n    </paragraph>\n\n    <paragraph
      id=\"P47\">\n        <paragraph_id>P47</paragraph_id>\n        \n        <paragraph_text>\n        a.
      This Agreement constitutes the entire agreement between the parties with respect
      to the subject matter hereof and supersedes all prior or contemporaneous oral
      or written agreements concerning such subject matter.\n        </paragraph_text>\n    </paragraph>\n\n    <paragraph
      id=\"P48\">\n        <paragraph_id>P48</paragraph_id>\n        \n        <paragraph_text>\n        b.
      Any amendments or modifications to this Agreement must be made in writing and
      signed by both parties.\n        </paragraph_text>\n    </paragraph>\n\n    <paragraph
      id=\"P49\">\n        <paragraph_id>P49</paragraph_id>\n        \n        <paragraph_text>\n        c.
      If any provision of this Agreement is found to be unenforceable, the remainder
