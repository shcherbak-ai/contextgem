      id=\"P38-S1\">\n                <sentence_id>P38-S1</sentence_id>\n                \n                <sentence_text>\n                This
      limitation of liability is cumulative and not per incident.\n                </sentence_text>\n            </sentence>\n        </paragraph_sentences>\n    </paragraph>\n\n    <paragraph
      id=\"P39\">\n        <paragraph_id>P39</paragraph_id>\n        \n        <paragraph_sentences>\n            <sentence
      id=\"P39-S0\">\n                <sentence_id>P39-S0</sentence_id>\n                \n                <sentence_text>\n                b.
      Penalties for Breach:\n                </sentence_text>\n            </sentence>\n        </paragraph_sentences>\n    </paragraph>\n\n    <paragraph
      id=\"P40\">\n        <paragraph_id>P40</paragraph_id>\n        \n        <paragraph_sentences>\n            <sentence
      id=\"P40-S0\">\n                <sentence_id>P40-S0</sentence_id>\n                \n                <sentence_text>\n                In
      the event of a breach of this Agreement by the Receiving Party, the Disclosing
      Party shall be entitled to seek injunctive relief in addition to any other remedy
      available at law or in equity.\n                </sentence_text>\n            </sentence>\n            <sentence
      id=\"P40-S1\">\n                <sentence_id>P40-S1</sentence_id>\n                \n                <sentence_text>\n                The
      Receiving Party acknowledges that a breach of this Agreement may cause irreparable
      harm to the Disclosing Party for which monetary damages would be an inadequate
      remedy.\n                </sentence_text>\n            </sentence>\n            <sentence
      id=\"P40-S2\">\n                <sentence_id>P40-S2</sentence_id>\n                \n                <sentence_text>\n                In
      addition to injunctive relief, the Receiving Party shall be liable for liquidated
      damages in the amount of $25,000 for each instance of unauthorized disclosure
      or use of Confidential Information, which the parties agree represents a reasonable
      estimate of the damages likely to be suffered and not a penalty.\n                </sentence_text>\n            </sentence>\n        </paragraph_sentences>\n    </paragraph>\n\n    <paragraph
      id=\"P41\">\n        <paragraph_id>P41</paragraph_id>\n        \n        <paragraph_sentences>\n            <sentence
      id=\"P41-S0\">\n                <sentence_id>P41-S0</sentence_id>\n                \n                <sentence_text>\n                7.
