      id=\"P36\">\n        <paragraph_id>P36</paragraph_id>\n        \n        <paragraph_text>\n        5.
      Liability:\n        </paragraph_text>\n    </paragraph>\n\n    <paragraph id=\"P37\">\n        <paragraph_id>P37</paragraph_id>\n        \n        <paragraph_text>\n        a.
      Total Liability Cap:\n        </paragraph_text>\n    </paragraph>\n\n    <paragraph
      id=\"P38\">\n        <paragraph_id>P38</paragraph_id>\n        \n        <paragraph_text>\n        The
