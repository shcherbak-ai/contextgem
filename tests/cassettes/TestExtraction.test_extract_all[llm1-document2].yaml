      adhering to this framework, you will ensure consistent and high-quality performance
      across diverse document analysis tasks.\\n</conclusion>\"},{\"role\":\"user\",\"content\":\"<introduction>\\nBelow
      you will find document text and a list of concepts.\\n</introduction>\\n\\n<guidance_on_task_structure>\\nAll
      structured information in these instructions is provided using semantic XML
      tags. Field names correspond directly to tag names (e.g., concept_name, additional_context,
      etc.).\\n</guidance_on_task_structure>\\n\\n<private_reasoning>\\nUse private
      deliberation to plan, evaluate evidence, and verify decisions. Do not reveal
      any intermediate analysis, notes, or steps. Only output the JSON according to
      the format specified within <answer_format></answer_format> tags.\\n\\nFollow
      this internal three-stage process:\\n\\n1. Plan\\n    - Internally restate each
      concept in one sentence.\\n    - List 3-5 concrete lexical/semantic cues for
      relevance aligned with the concept description (include indicators of definition,
      obligation, permission, exception, conditionals, and negations).\\n    - If
      a concept specifies a structure, rating scale, or available labels, align inclusion/exclusion
      criteria with those constraints.\\n    - For each concept, plan how to synthesize
      the output value from the available evidence even when no literal span is present.\\n\\n2.
      Evidence triage\\n    - Evaluate the provided content holistically; derive candidate
      extractions/values for the concepts (explicit or inferred from context).\\n
      \   - Collect minimal sufficient evidence privately and note negated, hypothetical,
      or conditional forms.\\n    - Prefer precision over recall; include only high-confidence
      items and omit weak or ambiguous ones.\\n\\n3. Consistency pass\\n    - Ensure
      all extracted items strictly match required types and any specified structure,
      rating scales, or label constraints.\\n\\nNever disclose any plan, evidence,
      or internal notes - only the JSON array defined within <answer_format></answer_format>
      tags.\\n</private_reasoning>\\n\\n<task_description>\\nYour task is to:\\n1.
      Read through the document text provided.\\n2. Identify whether each concept
      in the concepts list is addressed within the document text.\\n    - Each concept
      is identified by a concept ID (for example, \\\"C0\\\", \\\"C1\\\", etc.) specified
      within <concept_id></concept_id> tags.\\n    - Each concept is described by
      a concept name specified within <concept_name></concept_name> tags and a concept
      description specified within <concept_description></concept_description> tags.\\n3.
      For each concept that appears, extract zero or more items relevant to that concept.
      The item format and structure are specified for each concept.\\n    - Treat
      negations, exceptions, and conditionals carefully: relevance may involve permissions,
      prohibitions, requirements, exceptions, thresholds, or ranges; reflect the stance
      .\\n    - Prefer minimal sufficient evidence and value derivation:\\n    - Favor
      precision over recall; when uncertain, avoid speculative extractions or derivations.\\n4.
      Produce a JSON array containing your extracted data, in the provided format.\\n
      \   - Internally verify before finalizing:\\n        -- Each provided concept
      appears once, in order, with the correct \\\"concept_id\\\".\\n        -- The
      top-level structure matches the format specified within <answer_format></answer_format>
      tags.\\n        -- Item values strictly satisfy type and any specified structure/scale/labels
      constraints.\\n        -- The structure exactly matches the format specified
      within <answer_format></answer_format> tags (no extra keys or commentary).\\n</task_description>\\n\\n<concept_extraction_rules>\\nIf
      a concept is not addressed in the document text, you must still include an entry
      in the final JSON output but with an empty \\\"extracted_items\\\" list. However,
      for boolean concepts (with extracted item type \\\"bool\\\"), distinguish carefully:\\n
      \   - Extract True if the concept is confirmed or strongly supported by the
      document content (either explicitly stated or reasonably inferred)\\n    - Extract
