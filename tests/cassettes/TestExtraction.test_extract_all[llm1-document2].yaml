      Read through the document text provided.\\n2. Identify whether each concept
      in the concepts list is addressed within the document text.\\n    - Each concept
      is identified by a concept ID (for example, \\\"C0\\\", \\\"C1\\\", etc.) specified
      within <concept_id></concept_id> tags.\\n    - Each concept is described by
      a concept name specified within <concept_name></concept_name> tags and a concept
      description specified within <concept_description></concept_description> tags.\\n3.
      For each concept that appears, extract zero or more items relevant to that concept.
      The item format and structure are specified for each concept.\\n    - Treat
      negations, exceptions, and conditionals carefully: relevance may involve permissions,
      prohibitions, requirements, exceptions, thresholds, or ranges; reflect the stance
