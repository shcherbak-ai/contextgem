      tags.\\n        -- Item values strictly satisfy type and any specified structure/scale/labels
      constraints.\\n        -- The structure exactly matches the format specified
      within <answer_format></answer_format> tags (no extra keys or commentary).\\n</task_description>\\n\\n<concept_extraction_rules>\\nIf
      a concept is not addressed in the document text, you must still include an entry
      in the final JSON output but with an empty \\\"extracted_items\\\" list. However,
      for boolean concepts (with extracted item type \\\"bool\\\"), distinguish carefully:\\n
