      and comply with length and language constraints.\\n\\nNever disclose any plan,
      evidence, or internal notes - only the JSON array defined within <answer_format></answer_format>
      tags.\\n</private_reasoning>\\n\\n<task_description>\\nYour task is to:\\n1.
      Read through the provided document paragraphs and their sentences.\\n    - Each
      paragraph is identified by a paragraph ID (for example, \\\"P0\\\", \\\"P1\\\",
      etc.) specified within <paragraph_id></paragraph_id> tags.\\n    - Each paragraph
      includes sentences, each identified by a sentence ID (for example, \\\"P0-S0\\\",
      \\\"P0-S1\\\", etc.) specified within <sentence_id></sentence_id> tags, followed
      by the full text of the sentence specified within <sentence_text></sentence_text>
