      \       \\n        <paragraph_text>\\n        d. Is independently developed
      by the Receiving Party without use of or reference to the Disclosing Party's
      Confidential Information.\\n        </paragraph_text>\\n    </paragraph>\\n\\n
      \   <paragraph id=\\\"P34\\\">\\n        <paragraph_id>P34</paragraph_id>\\n
      \       \\n        <paragraph_text>\\n        6. Return of Materials:\\n        </paragraph_text>\\n
