      Party at the time of disclosure.\\n        </paragraph_text>\\n    </paragraph>\\n\\n
      \   <paragraph id=\\\"P32\\\">\\n        <paragraph_id>P32</paragraph_id>\\n
      \       \\n        <paragraph_text>\\n        c. Is lawfully received from a
