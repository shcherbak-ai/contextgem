      the prior written consent of the Disclosing Party.\\n        </paragraph_text>\\n
      \   </paragraph>\\n\\n    <paragraph id=\\\"P26\\\">\\n        <paragraph_id>P26</paragraph_id>\\n
      \       \\n        <paragraph_text>\\n        b. Use the Confidential Information
