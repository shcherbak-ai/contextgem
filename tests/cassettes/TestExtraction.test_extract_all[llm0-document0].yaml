      \       </paragraph_text>\\n    </paragraph>\\n\\n    <paragraph id=\\\"P27\\\">\\n
      \       <paragraph_id>P27</paragraph_id>\\n        \\n        <paragraph_text>\\n
      \       c. Take all necessary precautions to protect the confidentiality of
      the Confidential Information, which shall be no less than the precautions it
