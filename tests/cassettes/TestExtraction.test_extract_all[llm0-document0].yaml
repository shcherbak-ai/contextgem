      Evidence triage\n    - Evaluate the provided content at paragraph and sentence
      levels; derive candidate extractions/values for the concepts (explicit or inferred
      from context).\n    - Collect minimal sufficient evidence privately and note
      negated, hypothetical, or conditional forms.\n    - Prefer precision over recall;
