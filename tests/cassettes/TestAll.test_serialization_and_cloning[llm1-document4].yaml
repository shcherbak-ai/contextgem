      \   </paragraph>\\n\\n    <paragraph id=\\\"P22\\\">\\n        <paragraph_id>P22</paragraph_id>\\n
      \       \\n        <paragraph_text>\\n        \u041F\u043E\u0437\u043D\u0430\u0447\u0435\u043D\u043D\u044F
