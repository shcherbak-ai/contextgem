      \       \\n        <paragraph_text>\\n        ## 1. \u041F\u0440\u0438\u0437\u043D\u0430\u0447\u0435\u043D\u043D\u044F:\\n
      \       </paragraph_text>\\n        \\n        <additional_context>\\n        Style:
