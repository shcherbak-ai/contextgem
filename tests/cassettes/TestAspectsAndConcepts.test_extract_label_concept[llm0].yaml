      or any other formatting characters.\\n- Private deliberation only:\\n    --
      Do not output any analysis, plan, scratchpad, thoughts, or chain-of-thought.\\n
      \   -- Only output the JSON array according to the format specified within <answer_format></answer_format>
      tags.\\n</output_constraints>\\n\\n<answer_format>\\nANSWER FORMAT (MANDATORY):\\n[\\n
      \   {\\n        \\\"concept_id\\\": str,\\n        \\\"extracted_items\\\":
      [\\n            ...\\n        ],\\n    },\\n    ...\\n]\\n</answer_format>\\n\\n<concepts>\\nCONCEPTS:\\n<concept
      id=\\\"C0\\\">\\n    <concept_id>C0</concept_id>\\n    \\n    <concept_name>Technical
      Specifications</concept_name>\\n\\n    <concept_description>\\n    Identify
      technical specifications mentioned in the document\\n    </concept_description>\\n\\n
      \   <available_labels>\\n    <classification_type>Multi-label (zero, one, or
      more labels can be selected)</classification_type>\\n    Based on the concept
      description, assign one or more labels from the following list of available
      labels:\\n    \\n    [\\\"Cooking Recipes\\\", \\\"Nutrition Information\\\"]\\n
      \   \\n    The output must be an object with a mandatory field \\\"labels\\\"
      mapped to an array containing only the selected labels, e.g. {\\\"labels\\\":
      [\\\"label1\\\", \\\"label2\\\"]}. If none of the labels apply to the content,
      leave the \\\"extracted_items\\\" array empty.\\n    </available_labels>\\n\\n
      \   <amount_of_extracted_items>This concept may have zero, one, or multiple
      extracted items.</amount_of_extracted_items>\\n\\n    <extracted_item_type>dict
      (must be exactly as specified)</extracted_item_type>\\n</concept>\\n\\n</concepts>\\n\\n<document_text>\\nNon-Disclosure
      Agreement (NDA)\\n\\nThis Non-Disclosure Agreement (the \\\"Agreement\\\") is
      made and entered into as of July 16, 2024, by and between:\\n\\nParty A:\\n\\n_____\\n_____\\n_____\\nContact:
