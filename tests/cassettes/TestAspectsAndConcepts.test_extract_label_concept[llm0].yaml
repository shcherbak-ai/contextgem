      \   <amount_of_extracted_items>This concept may have zero, one, or multiple
      extracted items.</amount_of_extracted_items>\\n\\n    <extracted_item_type>dict
      (must be exactly as specified)</extracted_item_type>\\n</concept>\\n\\n</concepts>\\n\\n<document_paragraphs>\\nDOCUMENT
      PARAGRAPHS INCLUDING SENTENCES:\\n<paragraph id=\\\"P0\\\">\\n<sentence id=\\\"P0-S0\\\">Non-Disclosure
      Agreement (NDA)</sentence>\\n</paragraph>\\n<paragraph id=\\\"P1\\\">\\n<sentence
      id=\\\"P1-S0\\\">This Non-Disclosure Agreement (the \\\"Agreement\\\") is made
      and entered into as of July 16, 2024, by and between:</sentence>\\n</paragraph>\\n<paragraph
      id=\\\"P2\\\">\\n<sentence id=\\\"P2-S0\\\">Party A:</sentence>\\n</paragraph>\\n<paragraph
      id=\\\"P3\\\">\\n<sentence id=\\\"P3-S0\\\">_____</sentence>\\n</paragraph>\\n<paragraph
      id=\\\"P4\\\">\\n<sentence id=\\\"P4-S0\\\">_____</sentence>\\n</paragraph>\\n<paragraph
      id=\\\"P5\\\">\\n<sentence id=\\\"P5-S0\\\">_____</sentence>\\n</paragraph>\\n<paragraph
      id=\\\"P6\\\">\\n<sentence id=\\\"P6-S0\\\">Contact: _____</sentence>\\n</paragraph>\\n<paragraph
      id=\\\"P7\\\">\\n<sentence id=\\\"P7-S0\\\">Phone: _____</sentence>\\n</paragraph>\\n<paragraph
      id=\\\"P8\\\">\\n<sentence id=\\\"P8-S0\\\">Email: _____</sentence>\\n</paragraph>\\n<paragraph
      id=\\\"P9\\\">\\n<sentence id=\\\"P9-S0\\\">Party B:</sentence>\\n</paragraph>\\n<paragraph
      id=\\\"P10\\\">\\n<sentence id=\\\"P10-S0\\\">Example.Com LLC</sentence>\\n</paragraph>\\n<paragraph
      id=\\\"P11\\\">\\n<sentence id=\\\"P11-S0\\\">5678 Random Drive</sentence>\\n</paragraph>\\n<paragraph
      id=\\\"P12\\\">\\n<sentence id=\\\"P12-S0\\\">New York, NY 00000</sentence>\\n</paragraph>\\n<paragraph
      id=\\\"P13\\\">\\n<sentence id=\\\"P13-S0\\\">Contact: Jane Doe, Managing Partner</sentence>\\n</paragraph>\\n<paragraph
      id=\\\"P14\\\">\\n<sentence id=\\\"P14-S0\\\">Phone: (012) 345-6789</sentence>\\n</paragraph>\\n<paragraph
      id=\\\"P15\\\">\\n<sentence id=\\\"P15-S0\\\">Email: jane.doe@example.com</sentence>\\n</paragraph>\\n<paragraph
      id=\\\"P16\\\">\\n<sentence id=\\\"P16-S0\\\">1. Purpose:</sentence>\\n</paragraph>\\n<paragraph
      id=\\\"P17\\\">\\n<sentence id=\\\"P17-S0\\\">The purpose of this Agreement
      is to protect the confidential information that may be disclosed between the
      parties during discussions and engagements regarding potential business collaborations
      and partnerships.</sentence>\\n</paragraph>\\n<paragraph id=\\\"P18\\\">\\n<sentence
      id=\\\"P18-S0\\\">2. Definition of Confidential Information:</sentence>\\n</paragraph>\\n<paragraph
      id=\\\"P19\\\">\\n<sentence id=\\\"P19-S0\\\">For purposes of this Agreement,
      \\\"Confidential Information\\\" means any and all non-public information, conveyed
      in all forms, whether in oral, written, electronic, or other form or media,
      whether or not marked, designated, or otherwise identified as \\\"confidential,\\\"
      that has been or may be disclosed to, accessed by, or observed by Receiving
      Party, which (i) has actual or potential economic value by virtue of not being
      generally known to, and not being readily ascertainable by proper means by,
      other persons who can obtain economic value from its disclosure or use, or (ii)
      is subject to reasonable efforts by Disclosing Party to maintain its secrecy
      and confidentiality.</sentence>\\n</paragraph>\\n<paragraph id=\\\"P20\\\">\\n<sentence
      id=\\\"P20-S0\\\">Confidential Information includes, but is not limited to,
      the following categories: (1) business information (business plans, strategies,
      and models), (2) technical information (technical specifications and documentation,
      research and development activities), (3) customer and market information (customer
      lists and contact information, sales histories and patterns), (4) personnel
      and internal information (employee lists and contact information, employment
      agreements and personnel files), (5) intellectual property (trade secrets and
      know-how, patents and patent applications, copyrights and copyright applications,
      trademarks and trademark applications), (6) strategic information (merger and
      acquisition plans, competitive analyses and strategies).</sentence>\\n<sentence
      id=\\\"P20-S1\\\">Software code shall also be included into the confidential
      information.</sentence>\\n</paragraph>\\n<paragraph id=\\\"P21\\\">\\n<sentence
      id=\\\"P21-S0\\\">Confidential Information shall not include information that:</sentence>\\n<sentence
      id=\\\"P21-S1\\\">(a) is or becomes generally available to the public other
      than as a result of disclosure by Receiving Party or its Representatives;</sentence>\\n<sentence
      id=\\\"P21-S2\\\">(b) was available to Receiving Party on a non-confidential
      basis prior to its disclosure by Disclosing Party;</sentence>\\n<sentence id=\\\"P21-S3\\\">(c)
      becomes available to Receiving Party on a non-confidential basis from a person
      other than Disclosing Party who is not otherwise bound by a confidentiality
      obligation to Disclosing Party; or (d) was independently developed by Receiving
      Party without reference to or use of any Confidential Information.</sentence>\\n<sentence
      id=\\\"P21-S4\\\">The name of the dog of the Receiving Party is Bob.</sentence>\\n</paragraph>\\n<paragraph
      id=\\\"P22\\\">\\n<sentence id=\\\"P22-S0\\\">The designation of information
      as Confidential Information shall not be determinative of whether such information
      constitutes a trade secret under applicable law.</sentence>\\n<sentence id=\\\"P22-S1\\\">All
      Confidential Information shall remain the exclusive property of Disclosing Party,
      and Receiving Party shall have no rights, by license or otherwise, to use the
      Confidential Information except as expressly provided herein.</sentence>\\n</paragraph>\\n<paragraph
      id=\\\"P23\\\">\\n<sentence id=\\\"P23-S0\\\">3. Obligations of Receiving Party:</sentence>\\n</paragraph>\\n<paragraph
      id=\\\"P24\\\">\\n<sentence id=\\\"P24-S0\\\">The party receiving Confidential
      Information (\\\"Receiving Party\\\") shall:</sentence>\\n</paragraph>\\n<paragraph
      id=\\\"P25\\\">\\n<sentence id=\\\"P25-S0\\\">a. Maintain the confidentiality
      of the Confidential Information and not disclose it to any third party without
      the prior written consent of the Disclosing Party.</sentence>\\n</paragraph>\\n<paragraph
      id=\\\"P26\\\">\\n<sentence id=\\\"P26-S0\\\">b. Use the Confidential Information
      solely for the purpose of evaluating or engaging in the potential business collaboration.</sentence>\\n</paragraph>\\n<paragraph
      id=\\\"P27\\\">\\n<sentence id=\\\"P27-S0\\\">c. Take all necessary precautions
      to protect the confidentiality of the Confidential Information, which shall
      be no less than the precautions it takes to protect its own confidential information.</sentence>\\n</paragraph>\\n<paragraph
      id=\\\"P28\\\">\\n<sentence id=\\\"P28-S0\\\">4. Exclusions from Confidential
      Information:</sentence>\\n</paragraph>\\n<paragraph id=\\\"P29\\\">\\n<sentence
      id=\\\"P29-S0\\\">Confidential Information does not include information that:</sentence>\\n</paragraph>\\n<paragraph
      id=\\\"P30\\\">\\n<sentence id=\\\"P30-S0\\\">a. Is or becomes publicly known
      through no wrongful act of the Receiving Party.</sentence>\\n</paragraph>\\n<paragraph
      id=\\\"P31\\\">\\n<sentence id=\\\"P31-S0\\\">b. Is already known to the Receiving
      Party at the time of disclosure.</sentence>\\n</paragraph>\\n<paragraph id=\\\"P32\\\">\\n<sentence
      id=\\\"P32-S0\\\">c. Is lawfully received from a third party without breach
      of this Agreement.</sentence>\\n</paragraph>\\n<paragraph id=\\\"P33\\\">\\n<sentence
      id=\\\"P33-S0\\\">d. Is independently developed by the Receiving Party without
      use of or reference to the Disclosing Party's Confidential Information.</sentence>\\n</paragraph>\\n<paragraph
      id=\\\"P34\\\">\\n<sentence id=\\\"P34-S0\\\">6. Return of Materials:</sentence>\\n</paragraph>\\n<paragraph
      id=\\\"P35\\\">\\n<sentence id=\\\"P35-S0\\\">Upon termination of this Agreement
      or upon request, the Receiving Party shall return all materials containing Confidential
      Information to the Disclosing Party or destroy them, at the Disclosing Party's
      discretion.</sentence>\\n</paragraph>\\n<paragraph id=\\\"P36\\\">\\n<sentence
      id=\\\"P36-S0\\\">5. Liability:</sentence>\\n</paragraph>\\n<paragraph id=\\\"P37\\\">\\n<sentence
      id=\\\"P37-S0\\\">a.</sentence>\\n<sentence id=\\\"P37-S1\\\">Total Liability
      Cap:</sentence>\\n</paragraph>\\n<paragraph id=\\\"P38\\\">\\n<sentence id=\\\"P38-S0\\\">The
      total liability of either party for any and all claims arising out of or related
      to this Agreement, whether in contract, tort, or otherwise, shall not exceed
      the greater of (i) $100,000 or (ii) the total amount paid by the Receiving Party
      to the Disclosing Party under any separate business agreement between the parties
      during the twelve (12) months preceding the event giving rise to the claim.</sentence>\\n<sentence
      id=\\\"P38-S1\\\">This limitation of liability is cumulative and not per incident.</sentence>\\n</paragraph>\\n<paragraph
      id=\\\"P39\\\">\\n<sentence id=\\\"P39-S0\\\">b. Penalties for Breach:</sentence>\\n</paragraph>\\n<paragraph
      id=\\\"P40\\\">\\n<sentence id=\\\"P40-S0\\\">In the event of a breach of this
      Agreement by the Receiving Party, the Disclosing Party shall be entitled to
      seek injunctive relief in addition to any other remedy available at law or in
      equity.</sentence>\\n<sentence id=\\\"P40-S1\\\">The Receiving Party acknowledges
      that a breach of this Agreement may cause irreparable harm to the Disclosing
      Party for which monetary damages would be an inadequate remedy.</sentence>\\n<sentence
      id=\\\"P40-S2\\\">In addition to injunctive relief, the Receiving Party shall
      be liable for liquidated damages in the amount of $25,000 for each instance
      of unauthorized disclosure or use of Confidential Information, which the parties
      agree represents a reasonable estimate of the damages likely to be suffered
      and not a penalty.</sentence>\\n</paragraph>\\n<paragraph id=\\\"P41\\\">\\n<sentence
      id=\\\"P41-S0\\\">7. No License:</sentence>\\n</paragraph>\\n<paragraph id=\\\"P42\\\">\\n<sentence
      id=\\\"P42-S0\\\">Nothing in this Agreement shall be construed as granting any
      rights to the Receiving Party, by license or otherwise, to any of the Disclosing
      Party\u2019s Confidential Information, except as expressly set forth in this
      Agreement.</sentence>\\n</paragraph>\\n<paragraph id=\\\"P43\\\">\\n<sentence
      id=\\\"P43-S0\\\">8. Governing Law and Disputes:</sentence>\\n</paragraph>\\n<paragraph
      id=\\\"P44\\\">\\n<sentence id=\\\"P44-S0\\\">This Agreement shall be governed
      by and construed in accordance with the laws of the State of California, without
      regard to its conflict of law principles.</sentence>\\n</paragraph>\\n<paragraph
      id=\\\"P45\\\">\\n<sentence id=\\\"P45-S0\\\">All disputes shall be resolved
      by the courts of the State of California.</sentence>\\n<sentence id=\\\"P45-S1\\\">This
      Agreement shall remain in effect for a period of five (5) years from the date
      of signing this agreement.</sentence>\\n</paragraph>\\n<paragraph id=\\\"P46\\\">\\n<sentence
      id=\\\"P46-S0\\\">9. Miscellaneous:</sentence>\\n</paragraph>\\n<paragraph id=\\\"P47\\\">\\n<sentence
      id=\\\"P47-S0\\\">a. This Agreement constitutes the entire agreement between
      the parties with respect to the subject matter hereof and supersedes all prior
      or contemporaneous oral or written agreements concerning such subject matter.</sentence>\\n</paragraph>\\n<paragraph
      id=\\\"P48\\\">\\n<sentence id=\\\"P48-S0\\\">b. Any amendments or modifications
      to this Agreement must be made in writing and signed by both parties.</sentence>\\n</paragraph>\\n<paragraph
      id=\\\"P49\\\">\\n<sentence id=\\\"P49-S0\\\">c. If any provision of this Agreement
      is found to be unenforceable, the remainder shall be enforced as fully as possible
      and the unenforceable provision shall be deemed modified to the limited extent
      required to permit its enforcement in a manner most closely representing the
      intention of the parties.</sentence>\\n</paragraph>\\n<paragraph id=\\\"P50\\\">\\n<sentence
      id=\\\"P50-S0\\\">d. The Disclosing Party shall be a good person to execute
      this contract.</sentence>\\n</paragraph>\\n<paragraph id=\\\"P51\\\">\\n<sentence
      id=\\\"P51-S0\\\">IN WITNESS WHEREOF, the parties hereto have executed this
      Non-Disclosure Agreement as of the date first above written.</sentence>\\n</paragraph>\\n<paragraph
      id=\\\"P52\\\">\\n<sentence id=\\\"P52-S0\\\">_____</sentence>\\n</paragraph>\\n<paragraph
      id=\\\"P53\\\">\\n<sentence id=\\\"P53-S0\\\">By: ___________________________</sentence>\\n</paragraph>\\n<paragraph
      id=\\\"P54\\\">\\n<sentence id=\\\"P54-S0\\\">Name: _____</sentence>\\n</paragraph>\\n<paragraph
      id=\\\"P55\\\">\\n<sentence id=\\\"P55-S0\\\">Title: _____</sentence>\\n</paragraph>\\n<paragraph
      id=\\\"P56\\\">\\n<sentence id=\\\"P56-S0\\\">Date: ___________________________</sentence>\\n</paragraph>\\n<paragraph
      id=\\\"P57\\\">\\n<sentence id=\\\"P57-S0\\\">Example.Com LLC</sentence>\\n</paragraph>\\n<paragraph
      id=\\\"P58\\\">\\n<sentence id=\\\"P58-S0\\\">By: ___________________________</sentence>\\n</paragraph>\\n<paragraph
      id=\\\"P59\\\">\\n<sentence id=\\\"P59-S0\\\">Name: Jane Doe</sentence>\\n</paragraph>\\n<paragraph
      id=\\\"P60\\\">\\n<sentence id=\\\"P60-S0\\\">Title: Managing Partner</sentence>\\n</paragraph>\\n<paragraph
      id=\\\"P61\\\">\\n<sentence id=\\\"P61-S0\\\">Date: ___________________________</sentence>\\n</paragraph>\\n</document_paragraphs>\"}],\"model\":\"gpt-6-luna\"}"
