      id=\\\"P27\\\">\\n<sentence id=\\\"P27-S0\\\">c. Take all necessary precautions
      to protect the confidentiality of the Confidential Information, which shall
      be no less than the precautions it takes to protect its own confidential information.</sentence>\\n</paragraph>\\n<paragraph
      id=\\\"P28\\\">\\n<sentence id=\\\"P28-S0\\\">4. Exclusions from Confidential
      Information:</sentence>\\n</paragraph>\\n<paragraph id=\\\"P29\\\">\\n<sentence
      id=\\\"P29-S0\\\">Confidential Information does not include information that:</sentence>\\n</paragraph>\\n<paragraph
      id=\\\"P30\\\">\\n<sentence id=\\\"P30-S0\\\">a. Is or becomes publicly known
      through no wrongful act of the Receiving Party.</sentence>\\n</paragraph>\\n<paragraph
      id=\\\"P31\\\">\\n<sentence id=\\\"P31-S0\\\">b. Is already known to the Receiving
      Party at the time of disclosure.</sentence>\\n</paragraph>\\n<paragraph id=\\\"P32\\\">\\n<sentence
      id=\\\"P32-S0\\\">c. Is lawfully received from a third party without breach
      of this Agreement.</sentence>\\n</paragraph>\\n<paragraph id=\\\"P33\\\">\\n<sentence
      id=\\\"P33-S0\\\">d. Is independently developed by the Receiving Party without
      use of or reference to the Disclosing Party's Confidential Information.</sentence>\\n</paragraph>\\n<paragraph
      id=\\\"P34\\\">\\n<sentence id=\\\"P34-S0\\\">6. Return of Materials:</sentence>\\n</paragraph>\\n<paragraph
      id=\\\"P35\\\">\\n<sentence id=\\\"P35-S0\\\">Upon termination of this Agreement
      or upon request, the Receiving Party shall return all materials containing Confidential
      Information to the Disclosing Party or destroy them, at the Disclosing Party's
      discretion.</sentence>\\n</paragraph>\\n<paragraph id=\\\"P36\\\">\\n<sentence
      id=\\\"P36-S0\\\">5. Liability:</sentence>\\n</paragraph>\\n<paragraph id=\\\"P37\\\">\\n<sentence
      id=\\\"P37-S0\\\">a.</sentence>\\n<sentence id=\\\"P37-S1\\\">Total Liability
      Cap:</sentence>\\n</paragraph>\\n<paragraph id=\\\"P38\\\">\\n<sentence id=\\\"P38-S0\\\">The
      total liability of either party for any and all claims arising out of or related
      to this Agreement, whether in contract, tort, or otherwise, shall not exceed
      the greater of (i) $100,000 or (ii) the total amount paid by the Receiving Party
      to the Disclosing Party under any separate business agreement between the parties
      during the twelve (12) months preceding the event giving rise to the claim.</sentence>\\n<sentence
      id=\\\"P38-S1\\\">This limitation of liability is cumulative and not per incident.</sentence>\\n</paragraph>\\n<paragraph
      id=\\\"P39\\\">\\n<sentence id=\\\"P39-S0\\\">b. Penalties for Breach:</sentence>\\n</paragraph>\\n<paragraph
      id=\\\"P40\\\">\\n<sentence id=\\\"P40-S0\\\">In the event of a breach of this
      Agreement by the Receiving Party, the Disclosing Party shall be entitled to
      seek injunctive relief in addition to any other remedy available at law or in
      equity.</sentence>\\n<sentence id=\\\"P40-S1\\\">The Receiving Party acknowledges
      that a breach of this Agreement may cause irreparable harm to the Disclosing
      Party for which monetary damages would be an inadequate remedy.</sentence>\\n<sentence
      id=\\\"P40-S2\\\">In addition to injunctive relief, the Receiving Party shall
      be liable for liquidated damages in the amount of $25,000 for each instance
      of unauthorized disclosure or use of Confidential Information, which the parties
      agree represents a reasonable estimate of the damages likely to be suffered
      and not a penalty.</sentence>\\n</paragraph>\\n<paragraph id=\\\"P41\\\">\\n<sentence
      id=\\\"P41-S0\\\">7. No License:</sentence>\\n</paragraph>\\n<paragraph id=\\\"P42\\\">\\n<sentence
      id=\\\"P42-S0\\\">Nothing in this Agreement shall be construed as granting any
      rights to the Receiving Party, by license or otherwise, to any of the Disclosing
      Party\u2019s Confidential Information, except as expressly set forth in this
      Agreement.</sentence>\\n</paragraph>\\n<paragraph id=\\\"P43\\\">\\n<sentence
      id=\\\"P43-S0\\\">8. Governing Law and Disputes:</sentence>\\n</paragraph>\\n<paragraph
      id=\\\"P44\\\">\\n<sentence id=\\\"P44-S0\\\">This Agreement shall be governed
      by and construed in accordance with the laws of the State of California, without
      regard to its conflict of law principles.</sentence>\\n</paragraph>\\n<paragraph
      id=\\\"P45\\\">\\n<sentence id=\\\"P45-S0\\\">All disputes shall be resolved
      by the courts of the State of California.</sentence>\\n<sentence id=\\\"P45-S1\\\">This
      Agreement shall remain in effect for a period of five (5) years from the date
      of signing this agreement.</sentence>\\n</paragraph>\\n<paragraph id=\\\"P46\\\">\\n<sentence
      id=\\\"P46-S0\\\">9. Miscellaneous:</sentence>\\n</paragraph>\\n<paragraph id=\\\"P47\\\">\\n<sentence
      id=\\\"P47-S0\\\">a. This Agreement constitutes the entire agreement between
      the parties with respect to the subject matter hereof and supersedes all prior
      or contemporaneous oral or written agreements concerning such subject matter.</sentence>\\n</paragraph>\\n<paragraph
      id=\\\"P48\\\">\\n<sentence id=\\\"P48-S0\\\">b. Any amendments or modifications
      to this Agreement must be made in writing and signed by both parties.</sentence>\\n</paragraph>\\n<paragraph
      id=\\\"P49\\\">\\n<sentence id=\\\"P49-S0\\\">c. If any provision of this Agreement
      is found to be unenforceable, the remainder shall be enforced as fully as possible
      and the unenforceable provision shall be deemed modified to the limited extent
      required to permit its enforcement in a manner most closely representing the
      intention of the parties.</sentence>\\n</paragraph>\\n<paragraph id=\\\"P50\\\">\\n<sentence
      id=\\\"P50-S0\\\">d. The Disclosing Party shall be a good person to execute
      this contract.</sentence>\\n</paragraph>\\n<paragraph id=\\\"P51\\\">\\n<sentence
      id=\\\"P51-S0\\\">IN WITNESS WHEREOF, the parties hereto have executed this
      Non-Disclosure Agreement as of the date first above written.</sentence>\\n</paragraph>\\n<paragraph
      id=\\\"P52\\\">\\n<sentence id=\\\"P52-S0\\\">_____</sentence>\\n</paragraph>\\n<paragraph
