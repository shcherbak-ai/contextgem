      FORMAT (MANDATORY):\\n[\\n    {\\n        \\\"concept_id\\\": str,\\n        \\\"extracted_items\\\":
      [\\n            ...\\n        ],\\n    },\\n    ...\\n]\\n</answer_format>\\n\\n<concepts>\\nCONCEPTS:\\n<concept
      id=\\\"C0\\\">\\n    <concept_id>C0</concept_id>\\n    \\n    <concept_name>Section
      titles</concept_name>\\n\\n    <concept_description>\\n    Section titles in
      the contract\\n    </concept_description>\\n\\n    <amount_of_extracted_items>This
      concept may have zero, one, or multiple extracted items.</amount_of_extracted_items>\\n\\n
      \   <extracted_item_type>str (must be exactly as specified)</extracted_item_type>\\n</concept>\\n\\n</concepts>\\n\\n<document_text>\\na.
