      \   - Each paragraph is identified by a paragraph ID (for example, \\\"P0\\\",
      \\\"P1\\\", etc.) specified within <paragraph_id></paragraph_id> tags.\\n    -
      Each paragraph includes sentences, each identified by a sentence ID (for example,
