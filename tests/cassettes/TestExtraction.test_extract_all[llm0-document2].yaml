      etc.).\\n</guidance_on_task_structure>\\n\\n<private_reasoning>\\nUse private
      deliberation to plan, evaluate evidence, and verify decisions. Do not reveal
      any intermediate analysis, notes, or steps. Only output the JSON specified within
      <answer_format></answer_format> tags.\\n\\nFollow this internal three-stage
      process:\\n\\n1. Plan\\n    - Internally restate each aspect in one sentence.\\n
      \   - List 3-5 concrete lexical/semantic cues for relevance, including indicators
      of prohibition, requirement, exception, conditionals, and negations.\\n    -
      Define internal inclusion/exclusion criteria for borderline matches.\\n\\n2.
      Evidence triage\\n    - For each paragraph, generate candidate matches to aspects.\\n
      \   - Collect minimal sufficient textual evidence privately and note negation,
      hypothetical, or conditional forms.\\n    - Prefer precision over recall; include
      only high-confidence matches and omit weak or ambiguous ones.\\n\\n3. Consistency
      pass\\n   - Deduplicate paragraph IDs within each aspect and preserve the original
      order.\\n   - Align stance in justifications (permission, prohibition, requirement,
      exception) with the actual semantics.\\n   - Ensure justifications comply with
      length and language constraints.\\n\\nNever disclose any plan, evidence, or
      internal notes - only the JSON array defined within <answer_format></answer_format>
      tags.\\n</private_reasoning>\\n\\n<task_description>\\nYour task is to:\\n\\n1.
      Read and understand the aspects\\n    - Each aspect is identified by an Aspect
      ID (for example, \\\"A0\\\", \\\"A1\\\", etc.) specified within <aspect_id></aspect_id>
      tags, includes a name specified within <aspect_name></aspect_name> tags, and
      has a description specified within <aspect_description></aspect_description>
      tags.\\n    - Aspects describe themes, topics, or criteria that might be addressed
      in the paragraphs.\\n\\n2. Examine each paragraph\\n    - Each paragraph is
      given with its full text within <paragraph></paragraph> tags, whose id attribute
      holds its paragraph ID (for example, \\\"P0\\\", \\\"P1\\\", etc.).\\n    -
      Note that paragraphs are listed in the same order they appear in the original
      document; therefore, context from surrounding paragraphs may influence whether
      a particular paragraph is relevant to an aspect.\\n    - You may be working
      with document fragments rather than complete documents. Focus on extracting
      information from the available content without making assumptions about missing
      parts.\\n\\n3. Map paragraphs to aspects\\n    - A paragraph can address one,
      multiple, or none of the aspects.\\n    - If a paragraph clearly relates to
      an aspect (based on the aspect's name and description), include the paragraph's
      ID and provide a justification, detailing why the paragraph is relevant to the
      aspect.\\n    - If a paragraph does not relate to an aspect, do not include
      it under that aspect's list.\\n    - Apply cross-paragraph reasoning when needed
      (e.g., headings, lists, references like \\\"above\\\", \\\"this section\\\"):
      use surrounding context to disambiguate; if unresolved, omit.\\n    - Treat
      negations, exceptions, and conditionals carefully: relevance can be present
      in prohibitions or restrictions; reflect the stance succinctly in the justification.\\n
      \   - Prefer minimal sufficient evidence:\\n        -- base the mapping on the
      most relevant paragraphs; avoid tangential mentions.\\n    - Favor precision
      over recall; when uncertain, exclude rather than speculate.\\n\\n4. Produce
      the final answer in the JSON format specified within <answer_format></answer_format>
      tags\\n    - Your output must be a JSON array of objects, each object corresponding
      to a single aspect.\\n    - For each aspect (in the order they are provided),
      include:\\n        -- aspect_id: The aspect's unique identifier, e.g., \\\"A0\\\".\\n
      \       -- paragraphs: An array of objects for each paragraph that addresses
