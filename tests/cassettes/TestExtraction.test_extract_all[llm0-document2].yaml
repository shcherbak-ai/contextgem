      and comply with length and language constraints.\\n\\nNever disclose any plan,
      evidence, or internal notes - only the JSON array defined within <answer_format></answer_format>
      tags.\\n</private_reasoning>\\n\\n<task_description>\\nYour task is to:\\n1.
      Read through the provided document paragraphs and their sentences.\\n    - Each
