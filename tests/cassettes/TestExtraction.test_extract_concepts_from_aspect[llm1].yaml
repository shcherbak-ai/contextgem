      Note that paragraphs are listed in the same order they appear in the original
      document; therefore, context from surrounding paragraphs may influence whether
      a particular paragraph is relevant to an aspect.\\n    - You may be working
      with document fragments rather than complete documents. Focus on extracting
      information from the available content without making assumptions about missing
      parts.\\n\\n3. Map paragraphs to aspects\\n    - A paragraph can address one,
      multiple, or none of the aspects.\\n    - If a paragraph clearly relates to
      an aspect (based on the aspect's name and description), include the paragraph's
      ID and provide a justification, detailing why the paragraph is relevant to the
      aspect.\\n    - If a paragraph does not relate to an aspect, do not include
      it under that aspect's list.\\n    - Apply cross-paragraph reasoning when needed
      (e.g., headings, lists, references like \\\"above\\\", \\\"this section\\\"):
      use surrounding context to disambiguate; if unresolved, omit.\\n    - Treat
      negations, exceptions, and conditionals carefully: relevance can be present
      in prohibitions or restrictions; reflect the stance succinctly in the justification.\\n
      \   - Prefer minimal sufficient evidence:\\n        -- base the mapping on the
      most relevant paragraphs; avoid tangential mentions.\\n    - Favor precision
      over recall; when uncertain, exclude rather than speculate.\\n\\n4. Produce
      the final answer in the JSON format specified within <answer_format></answer_format>
      tags\\n    - Your output must be a JSON array of objects, each object corresponding
      to a single aspect.\\n    - For each aspect (in the order they are provided),
      include:\\n        -- aspect_id: The aspect's unique identifier, e.g., \\\"A0\\\".\\n
      \       -- paragraphs: An array of objects for each paragraph that addresses
      or relates to the aspect. Each object should include:\\n            --- paragraph_id:
      The provided paragraph ID, e.g., \\\"P0\\\", \\\"P2\\\".\\n            --- justification:
      A justification of why the paragraph is relevant to the aspect. Ensure the justification
