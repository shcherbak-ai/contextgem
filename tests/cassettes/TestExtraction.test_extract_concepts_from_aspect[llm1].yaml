      ...,\n                \"reference_paragraphs\": [\n                    {\n                        \"reference_paragraph_id\":
      str,\n                        \"reference_sentence_ids\": [\n                            str,\n                            ...\n                        ]\n                    },\n                    ...\n                ]\n            },\n            ...\n        ],\n    },\n    ...\n]\n</answer_format>\n\n<concepts>\nCONCEPTS:\n<concept
      id=\"C0\">\n    <concept_id>C0</concept_id>\n    \n    <concept_name>Information
