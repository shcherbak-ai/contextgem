      id=\"P2-S1\">\n                <sentence_id>P2-S1</sentence_id>\n                \n                <sentence_text>\n                Software
      code shall also be included into the confidential information.\n                </sentence_text>\n            </sentence>\n        </paragraph_sentences>\n    </paragraph>\n\n    <paragraph
      id=\"P3\">\n        <paragraph_id>P3</paragraph_id>\n        \n        <paragraph_sentences>\n            <sentence
      id=\"P3-S0\">\n                <sentence_id>P3-S0</sentence_id>\n                \n                <sentence_text>\n                Confidential
      Information shall not include information that:\n                </sentence_text>\n            </sentence>\n            <sentence
      id=\"P3-S1\">\n                <sentence_id>P3-S1</sentence_id>\n                \n                <sentence_text>\n                (a)
      is or becomes generally available to the public other than as a result of disclosure
