      id=\"P8\">\n        <paragraph_id>P8</paragraph_id>\n        \n        <paragraph_sentences>\n            <sentence
      id=\"P8-S0\">\n                <sentence_id>P8-S0</sentence_id>\n                \n                <sentence_text>\n                b.
