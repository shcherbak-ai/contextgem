      id=\\\"P36\\\">\\n        <paragraph_id>P36</paragraph_id>\\n        \\n        <paragraph_text>\\n
      \       5. Liability:\\n        </paragraph_text>\\n    </paragraph>\\n\\n    <paragraph
      id=\\\"P37\\\">\\n        <paragraph_id>P37</paragraph_id>\\n        \\n        <paragraph_text>\\n
      \       a. Total Liability Cap:\\n        </paragraph_text>\\n    </paragraph>\\n\\n
      \   <paragraph id=\\\"P38\\\">\\n        <paragraph_id>P38</paragraph_id>\\n
      \       \\n        <paragraph_text>\\n        The total liability of either
      party for any and all claims arising out of or related to this Agreement, whether
      in contract, tort, or otherwise, shall not exceed the greater of (i) $100,000
      or (ii) the total amount paid by the Receiving Party to the Disclosing Party
