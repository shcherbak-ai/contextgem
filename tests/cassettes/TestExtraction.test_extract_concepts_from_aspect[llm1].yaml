      Party on a non-confidential basis from a person other than Disclosing Party
      who is not otherwise bound by a confidentiality obligation to Disclosing Party;
      or (d) was independently developed by Receiving Party without reference to or
      use of any Confidential Information.</sentence>\n<sentence id=\"P4-S4\">The
      name of the dog of the Receiving Party is Bob.</sentence>\n</paragraph>\n<paragraph
      id=\"P5\">\n<sentence id=\"P5-S0\">The designation of information as Confidential
      Information shall not be determinative of whether such information constitutes
      a trade secret under applicable law.</sentence>\n<sentence id=\"P5-S1\">All
      Confidential Information shall remain the exclusive property of Disclosing Party,
      and Receiving Party shall have no rights, by license or otherwise, to use the
