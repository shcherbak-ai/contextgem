      item with multiple labels in the \"labels\" array (e.g., {\"labels\": [\"label1\",
      \"label2\"]}). Only create multiple extracted items if there are genuinely distinct
      instances or contexts that warrant separate classification.\n    -- For concepts
      that do not have <available_labels></available_labels> tags: if multiple items
      are found for a concept, include each as a separate entry within the \"extracted_items\"
      array.\n</extracted_item_handling_rules>\n\n<output_constraints>\n- No additional
      text:\n    -- Do not include any headers, explanations, or text outside of the
      JSON array.\n    -- Do not wrap your JSON response in backticks or any other
      formatting characters.\n- Private deliberation only:\n    -- Do not output any
      analysis, plan, scratchpad, thoughts, or chain-of-thought.\n    -- Only output
      the JSON array according to the format specified within <answer_format></answer_format>
      tags.\n</output_constraints>\n\n<answer_format>\nANSWER FORMAT (MANDATORY):\n[\n    {\n        \"concept_id\":
      str,\n        \"extracted_items\": [\n            {\n                \"value\":
      ...,\n                \"reference_paragraphs\": [\n                    {\n                        \"reference_paragraph_id\":
      str,\n                        \"reference_sentence_ids\": [\n                            str,\n                            ...\n                        ]\n                    },\n                    ...\n                ]\n            },\n            ...\n        ],\n    },\n    ...\n]\n</answer_format>\n\n<concepts>\nCONCEPTS:\n<concept
      id=\"C0\">\n    <concept_id>C0</concept_id>\n    \n    <concept_name>Information
      in all forms</concept_name>\n\n    <concept_description>\n    Confidential information
      can be conveyed in all forms.\n    </concept_description>\n\n    <amount_of_extracted_items>This
      concept may have zero, one, or multiple extracted items.</amount_of_extracted_items>\n\n    <extracted_item_type>bool
      (must be exactly as specified)</extracted_item_type>\n</concept>\n\n</concepts>\n\n<document_paragraphs>\nDOCUMENT
      PARAGRAPHS INCLUDING SENTENCES:\n<paragraph id=\"P0\">\n<sentence id=\"P0-S0\">The
      purpose of this Agreement is to protect the confidential information that may
      be disclosed between the parties during discussions and engagements regarding
      potential business collaborations and partnerships.</sentence>\n</paragraph>\n<paragraph
      id=\"P1\">\n<sentence id=\"P1-S0\">2. Definition of Confidential Information:</sentence>\n</paragraph>\n<paragraph
      id=\"P2\">\n<sentence id=\"P2-S0\">For purposes of this Agreement, \"Confidential
      Information\" means any and all non-public information, conveyed in all forms,
      whether in oral, written, electronic, or other form or media, whether or not
      marked, designated, or otherwise identified as \"confidential,\" that has been
      or may be disclosed to, accessed by, or observed by Receiving Party, which (i)
      has actual or potential economic value by virtue of not being generally known
      to, and not being readily ascertainable by proper means by, other persons who
      can obtain economic value from its disclosure or use, or (ii) is subject to
      reasonable efforts by Disclosing Party to maintain its secrecy and confidentiality.</sentence>\n</paragraph>\n<paragraph
      id=\"P3\">\n<sentence id=\"P3-S0\">Confidential Information includes, but is
      not limited to, the following categories: (1) business information (business
      plans, strategies, and models), (2) technical information (technical specifications
      and documentation, research and development activities), (3) customer and market
      information (customer lists and contact information, sales histories and patterns),
      (4) personnel and internal information (employee lists and contact information,
      employment agreements and personnel files), (5) intellectual property (trade
      secrets and know-how, patents and patent applications, copyrights and copyright
      applications, trademarks and trademark applications), (6) strategic information
      (merger and acquisition plans, competitive analyses and strategies).</sentence>\n<sentence
      id=\"P3-S1\">Software code shall also be included into the confidential information.</sentence>\n</paragraph>\n<paragraph
      id=\"P4\">\n<sentence id=\"P4-S0\">Confidential Information shall not include
      information that:</sentence>\n<sentence id=\"P4-S1\">(a) is or becomes generally
      available to the public other than as a result of disclosure by Receiving Party
      or its Representatives;</sentence>\n<sentence id=\"P4-S2\">(b) was available
      to Receiving Party on a non-confidential basis prior to its disclosure by Disclosing
      Party;</sentence>\n<sentence id=\"P4-S3\">(c) becomes available to Receiving
      Party on a non-confidential basis from a person other than Disclosing Party
      who is not otherwise bound by a confidentiality obligation to Disclosing Party;
      or (d) was independently developed by Receiving Party without reference to or
      use of any Confidential Information.</sentence>\n<sentence id=\"P4-S4\">The
      name of the dog of the Receiving Party is Bob.</sentence>\n</paragraph>\n<paragraph
      id=\"P5\">\n<sentence id=\"P5-S0\">The designation of information as Confidential
      Information shall not be determinative of whether such information constitutes
      a trade secret under applicable law.</sentence>\n<sentence id=\"P5-S1\">All
      Confidential Information shall remain the exclusive property of Disclosing Party,
      and Receiving Party shall have no rights, by license or otherwise, to use the
      Confidential Information except as expressly provided herein.</sentence>\n</paragraph>\n<paragraph
      id=\"P6\">\n<sentence id=\"P6-S0\">4. Exclusions from Confidential Information:</sentence>\n</paragraph>\n<paragraph
      id=\"P7\">\n<sentence id=\"P7-S0\">Confidential Information does not include
      information that:</sentence>\n</paragraph>\n<paragraph id=\"P8\">\n<sentence
      id=\"P8-S0\">a. Is or becomes publicly known through no wrongful act of the
      Receiving Party.</sentence>\n</paragraph>\n<paragraph id=\"P9\">\n<sentence
      id=\"P9-S0\">b. Is already known to the Receiving Party at the time of disclosure.</sentence>\n</paragraph>\n<paragraph
      id=\"P10\">\n<sentence id=\"P10-S0\">c. Is lawfully received from a third party
      without breach of this Agreement.</sentence>\n</paragraph>\n<paragraph id=\"P11\">\n<sentence
      id=\"P11-S0\">d. Is independently developed by the Receiving Party without use
      of or reference to the Disclosing Party''s Confidential Information.</sentence>\n</paragraph>\n</document_paragraphs>"}],"model":"gpt-6-luna"}'
