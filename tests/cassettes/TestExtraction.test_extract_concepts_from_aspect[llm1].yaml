      ASPECTS:\\n    <aspect id=\\\"A0\\\">\\n        <aspect_id>A0</aspect_id>\\n
      \       \\n        <aspect_name>Confidential information</aspect_name>\\n        \\n
      \       <aspect_description>\\n        Clauses describing confidential information
