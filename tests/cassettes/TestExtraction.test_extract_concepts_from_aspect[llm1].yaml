      content=''source code''\n        </extracted_item_example>\n    </extracted_item_examples>\n\n    <extracted_item_type>str
      (must be exactly as specified)</extracted_item_type>\n</concept>\n\n</concepts>\n\n<document_text>\n2.
      Definition of Confidential Information:\n\nFor purposes of this Agreement, \"Confidential
      Information\" means any and all non-public information, conveyed in all forms,
