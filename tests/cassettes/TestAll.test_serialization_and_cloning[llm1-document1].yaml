      concept name specified within <concept_name></concept_name> tags and a concept
      description specified within <concept_description></concept_description> tags.\n3.
      For each concept that appears, extract zero or more items relevant to that concept.
      The item format and structure are specified for each concept.\n4. Produce a
      JSON array containing your extracted data, in the provided format.\n</task_description>\n\n<concept_extraction_rules>\nIf
      a concept is not addressed in the document paragraphs, you must still include
      an entry in the final JSON output but with an empty \"extracted_items\" list.
      However, for boolean concepts (with extracted item type \"bool\"), distinguish
