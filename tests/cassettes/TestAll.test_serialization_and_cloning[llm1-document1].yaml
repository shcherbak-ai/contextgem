      Normal\n        </additional_context>\n    </paragraph>\n\n    <paragraph id=\"P13\">\n        <paragraph_id>P13</paragraph_id>\n        \n        <paragraph_text>\n        Contact:
      Jane Doe, Managing Partner\n        </paragraph_text>\n        \n        <additional_context>\n        Style:
      Normal\n        </additional_context>\n    </paragraph>\n\n    <paragraph id=\"P14\">\n        <paragraph_id>P14</paragraph_id>\n        \n        <paragraph_text>\n        Phone:
      (012) 345-6789\n        </paragraph_text>\n        \n        <additional_context>\n        Style:
