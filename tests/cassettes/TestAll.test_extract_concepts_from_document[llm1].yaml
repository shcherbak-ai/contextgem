      \       <paragraph_id>P23</paragraph_id>\\n        \\n        <paragraph_text>\\n
      \       3. Obligations of Receiving Party:\\n        </paragraph_text>\\n    </paragraph>\\n\\n
      \   <paragraph id=\\\"P24\\\">\\n        <paragraph_id>P24</paragraph_id>\\n
      \       \\n        <paragraph_text>\\n        The party receiving Confidential
      Information (\\\"Receiving Party\\\") shall:\\n        </paragraph_text>\\n
      \   </paragraph>\\n\\n    <paragraph id=\\\"P25\\\">\\n        <paragraph_id>P25</paragraph_id>\\n
      \       \\n        <paragraph_text>\\n        a. Maintain the confidentiality
