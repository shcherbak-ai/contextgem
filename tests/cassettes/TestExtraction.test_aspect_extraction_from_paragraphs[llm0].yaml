      private deliberation to plan, evaluate evidence, and verify decisions. Do not
      reveal any intermediate analysis, notes, or steps. Only output the JSON specified
      within <answer_format></answer_format> tags.\\n\\nFollow this internal three-stage
      process:\\n\\n1. Plan\\n    - Internally restate each aspect in one sentence.\\n
      \   - List 3-5 concrete lexical/semantic cues for relevance, including indicators
      of prohibition, requirement, exception, conditionals, and negations.\\n    -
      Define internal inclusion/exclusion criteria for borderline matches.\\n\\n2.
      Evidence triage\\n    - For each paragraph, generate candidate matches to aspects.\\n
      \   - Collect minimal sufficient textual evidence privately and note negation,
      hypothetical, or conditional forms.\\n    - Prefer precision over recall; include
      only high-confidence matches and omit weak or ambiguous ones.\\n\\n3. Consistency
      pass\\n   - Deduplicate paragraph IDs within each aspect and preserve the original
      order.\\n   - Align stance in justifications (permission, prohibition, requirement,
      exception) with the actual semantics.\\n   - Ensure justifications comply with
      length and language constraints.\\n\\nNever disclose any plan, evidence, or
      internal notes - only the JSON array defined within <answer_format></answer_format>
      tags.\\n</private_reasoning>\\n\\n<task_description>\\nYour task is to:\\n\\n1.
      Read and understand the aspects\\n    - Each aspect is identified by an Aspect
      ID (for example, \\\"A0\\\", \\\"A1\\\", etc.) specified within <aspect_id></aspect_id>
      tags, includes a name specified within <aspect_name></aspect_name> tags, and
      has a description specified within <aspect_description></aspect_description>
      tags.\\n    - Aspects describe themes, topics, or criteria that might be addressed
      in the paragraphs.\\n\\n2. Examine each paragraph\\n    - Each paragraph is
      identified by a paragraph ID (for example, \\\"P0\\\", \\\"P1\\\", etc.) specified
      within <paragraph_id></paragraph_id> tags, followed by the full text of the
      paragraph specified within <paragraph_text></paragraph_text> tags.\\n    - Note
      that paragraphs are listed in the same order they appear in the original document;
      therefore, context from surrounding paragraphs may influence whether a particular
      paragraph is relevant to an aspect.\\n    - You may be working with document
      fragments rather than complete documents. Focus on extracting information from
      the available content without making assumptions about missing parts.\\n\\n3.
      Map paragraphs to aspects\\n    - A paragraph can address one, multiple, or
      none of the aspects.\\n    - If a paragraph clearly relates to an aspect (based
      on the aspect's name and description), include the paragraph's ID and provide
      a justification, detailing why the paragraph is relevant to the aspect.\\n    -
      If a paragraph does not relate to an aspect, do not include it under that aspect's
      list.\\n    - Apply cross-paragraph reasoning when needed (e.g., headings, lists,
      references like \\\"above\\\", \\\"this section\\\"): use surrounding context
      to disambiguate; if unresolved, omit.\\n    - Treat negations, exceptions, and
      conditionals carefully: relevance can be present in prohibitions or restrictions;
      reflect the stance succinctly in the justification.\\n    - Prefer minimal sufficient
      evidence:\\n        -- base the mapping on the most relevant paragraphs; avoid
      tangential mentions.\\n    - Favor precision over recall; when uncertain, exclude
      rather than speculate.\\n\\n4. Produce the final answer in the JSON format specified
      within <answer_format></answer_format> tags\\n    - Your output must be a JSON
      array of objects, each object corresponding to a single aspect.\\n    - For
      each aspect (in the order they are provided), include:\\n        -- aspect_id:
      The aspect's unique identifier, e.g., \\\"A0\\\".\\n        -- paragraphs: An
      array of objects for each paragraph that addresses or relates to the aspect.
      Each object should include:\\n            --- paragraph_id: The provided paragraph
      ID, e.g., \\\"P0\\\", \\\"P2\\\".\\n            --- justification: A justification
      of why the paragraph is relevant to the aspect. Ensure the justification is
      specific and directly ties the content of the paragraph to the aspect's defining
      features. Never reference any of the structural IDs provided in this prompt
      (such as aspect IDs like \\\"A0\\\", or paragraph IDs like \\\"P0\\\") in the
      justification.\\n                ---- Justification should be brief, i.e. highlight
      only the essential details.\\n                ---- Justification should be no
      longer than 2 sentences.\\n                ---- Justification should be in English.\\n
      \       -- If an aspect has no related paragraphs, still include it with an
      empty paragraphs array ([]).\\n- Do not add extra commentary, code block markers,
      or any other formatting beyond the JSON array.\\n- Internally verify before
      finalizing:\\n    -- Each provided aspect appears once, in order, with the correct
      \\\"aspect_id\\\".\\n    -- \\\"paragraph_ids\\\" contains only valid paragraph
      IDs.\\n    -- No structural IDs (aspect/paragraph IDs) appear inside justifications.\\n
      \   -- Justifications meet length and language constraints.\\n    -- The structure
