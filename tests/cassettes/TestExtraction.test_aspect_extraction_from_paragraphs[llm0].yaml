      id=\"P13\">\n        <paragraph_id>P13</paragraph_id>\n        \n        <paragraph_text>\n        4.
      Exclusions from Confidential Information:\n        </paragraph_text>\n    </paragraph>\n\n    <paragraph
      id=\"P14\">\n        <paragraph_id>P14</paragraph_id>\n        \n        <paragraph_text>\n        Confidential
