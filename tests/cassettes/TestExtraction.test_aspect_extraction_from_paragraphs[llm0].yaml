      aspect, do not include it under that aspect''s list.\n    - Apply cross-paragraph
      reasoning when needed (e.g., headings, lists, references like \"above\", \"this
      section\"): use surrounding context to disambiguate; if unresolved, omit.\n    -
      Treat negations, exceptions, and conditionals carefully: relevance can be present
      in prohibitions or restrictions.\n    - Prefer minimal sufficient evidence:\n        --
      include only the sentences necessary to support the mapping; avoid unrelated
      sentences.\n    - Favor precision over recall; when uncertain, exclude rather
      than speculate.\n\n4. Produce the final answer in the JSON format specified
      within <answer_format></answer_format> tags\n    - Your output must be a JSON
      array of objects, each object corresponding to a single aspect.\n    - For each
      aspect (in the order they are provided), include:\n        -- aspect_id: The
      aspect''s unique identifier, e.g., \"A0\".\n        -- paragraphs: An array
      of objects for each paragraph that addresses or relates to the aspect. Each
      object should include:\n            --- paragraph_id: The provided paragraph
      ID, e.g., \"P0\", \"P2\".\n            --- sentences: An array of objects for
      each relevant sentence within the paragraph. Each object should include:\n                ----
      sentence_id: The provided ID of the sentence, e.g., \"P0-S0\", \"P0-S2\".\n        --
      If an aspect has no related paragraphs, still include it with an empty paragraph_ids
      array ([]).\n- Do not add extra commentary, code block markers, or any other
      formatting beyond the JSON array.\n- Internally verify before finalizing:\n    --
      Each provided aspect appears once, in order, with the correct \"aspect_id\".\n    --
      Each object in \"paragraphs\" contains only valid \"paragraph_id\" with valid
