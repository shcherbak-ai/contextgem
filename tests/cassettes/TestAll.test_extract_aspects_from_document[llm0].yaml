      a particular paragraph is relevant to an aspect.\n    - You may be working with
      document fragments rather than complete documents. Focus on extracting information
      from the available content without making assumptions about missing parts.\n\n3.
      Map paragraphs and their sentences to aspects\n    - A paragraph can address
      one, multiple, or none of the aspects.\n    - A sentence within the paragraph
      can address one, multiple, or none of the aspects.\n    - If a paragraph clearly
      relates to an aspect (based on the aspect''s name and description), include
      the paragraph''s ID and the IDs of all the sentences within the paragraph that
      address or relate to the aspect. For each such sentence, also include a justification,
      detailing why the sentence is relevant to the aspect.\n    - If a paragraph
      does not relate to an aspect, do not include it under that aspect''s list.\n\n4.
      Produce the final answer in the JSON format specified within <answer_format></answer_format>
      tags\n    - Your output must be a JSON array of objects, each object corresponding
      to a single aspect.\n    - For each aspect (in the order they are provided),
      include:\n        -- aspect_id: The aspect''s unique identifier, e.g., \"A0\".\n        --
      paragraphs: An array of objects for each paragraph that addresses or relates
      to the aspect. Each object should include:\n            --- paragraph_id: The
      provided paragraph ID, e.g., \"P0\", \"P2\".\n            --- sentences: An
      array of objects for each relevant sentence within the paragraph. Each object
      should include:\n                ---- sentence_id: The provided ID of the sentence,
      e.g., \"P0-S0\", \"P0-S2\".\n                ---- justification: A justification
      of why the sentence is relevant to the aspect. Ensure the justification is specific
      and directly ties the content of the sentence to the aspect''s defining features.
      Never reference any of the structural IDs provided in this prompt (such as aspect
      IDs like \"A0\", paragraph IDs like \"P0\", or sentence IDs like \"P0-S0\")
      in the justification.\n                    ----- Justification should be balanced,
      i.e. cover the key insights with enough detail to be informative, while remaining
      concise.\n                    ----- Justification should be no longer than 2
      sentences.\n                    ----- Justification should be in English.\n        --
      If an aspect has no related paragraphs, still include it with an empty paragraphs
      array ([]).\n- Do not add extra commentary, code block markers, or any other
      formatting beyond the JSON array.\n</task_description>\n\n<output_constraints>\n-
      No additional text:\n    -- Do not include any headers, explanations, or text
      outside of the JSON array.\n    -- Do not wrap your JSON response in backticks
      or any other formatting characters.\n</output_constraints>\n\n<answer_format>\nANSWER
      FORMAT (MANDATORY):\n[\n    {\n        \"aspect_id\": str,\n        \"paragraphs\":
      [\n            {\n                \"paragraph_id\": str,\n                \"sentences\":
      [\n                    {\n                        \"sentence_id\": str,\n                        \"justification\":
      str\n                    },\n                    ...\n                ]\n            },\n            ...\n        ],\n    },\n    ...\n]\n</answer_format>\n\n<aspects>\nDOCUMENT
      ASPECTS:\n    <aspect id=\"A0\">\n        <aspect_id>A0</aspect_id>\n        \n        <aspect_name>Independently
      developed information</aspect_name>\n        \n        <aspect_description>\n        Information
      developed independently by the receiving party\n        </aspect_description>\n    </aspect>\n\n</aspects>\n\n<document_paragraphs>\nDOCUMENT
      PARAGRAPHS INCLUDING SENTENCES:\n    <paragraph id=\"P0\">\n        <paragraph_id>P0</paragraph_id>\n        \n        <paragraph_sentences>\n            <sentence
      id=\"P0-S0\">\n                <sentence_id>P0-S0</sentence_id>\n                \n                <sentence_text>\n                Confidential
      Information shall not include information that:\n                </sentence_text>\n            </sentence>\n            <sentence
      id=\"P0-S1\">\n                <sentence_id>P0-S1</sentence_id>\n                \n                <sentence_text>\n                (a)
      is or becomes generally available to the public other than as a result of disclosure
      by Receiving Party or its Representatives;\n                </sentence_text>\n            </sentence>\n            <sentence
      id=\"P0-S2\">\n                <sentence_id>P0-S2</sentence_id>\n                \n                <sentence_text>\n                (b)
      was available to Receiving Party on a non-confidential basis prior to its disclosure
      by Disclosing Party;\n                </sentence_text>\n            </sentence>\n            <sentence
      id=\"P0-S3\">\n                <sentence_id>P0-S3</sentence_id>\n                \n                <sentence_text>\n                (c)
      becomes available to Receiving Party on a non-confidential basis from a person
      other than Disclosing Party who is not otherwise bound by a confidentiality
      obligation to Disclosing Party; or (d) was independently developed by Receiving
      Party without reference to or use of any Confidential Information.\n                </sentence_text>\n            </sentence>\n            <sentence
      id=\"P0-S4\">\n                <sentence_id>P0-S4</sentence_id>\n                \n                <sentence_text>\n                The
      name of the dog of the Receiving Party is Bob.\n                </sentence_text>\n            </sentence>\n        </paragraph_sentences>\n    </paragraph>\n\n    <paragraph
