      concept may have zero, one, or multiple extracted items.</amount_of_extracted_items>\n\n    <extracted_item_type>str
      (must be exactly as specified)</extracted_item_type>\n</concept>\n\n<concept
      id=\"C1\">\n    <concept_id>C1</concept_id>\n    \n    <concept_name>Technical
      Information</concept_name>\n\n    <concept_description>\n    Categories of Technical
      Information\n    </concept_description>\n\n    <amount_of_extracted_items>This
      concept may have zero, one, or multiple extracted items.</amount_of_extracted_items>\n\n    <extracted_item_type>str
      (must be exactly as specified)</extracted_item_type>\n</concept>\n\n<concept
      id=\"C2\">\n    <concept_id>C2</concept_id>\n    \n    <concept_name>Customer
      and Market Information</concept_name>\n\n    <concept_description>\n    Categories
      of Customer and Market Information\n    </concept_description>\n\n    <amount_of_extracted_items>This
      concept may have zero, one, or multiple extracted items.</amount_of_extracted_items>\n\n    <extracted_item_type>str
      (must be exactly as specified)</extracted_item_type>\n</concept>\n\n<concept
      id=\"C3\">\n    <concept_id>C3</concept_id>\n    \n    <concept_name>Personnel
      and Internal Information</concept_name>\n\n    <concept_description>\n    Categories
      of Personnel and Internal Information\n    </concept_description>\n\n    <amount_of_extracted_items>This
      concept may have zero, one, or multiple extracted items.</amount_of_extracted_items>\n\n    <extracted_item_type>str
      (must be exactly as specified)</extracted_item_type>\n</concept>\n\n<concept
      id=\"C4\">\n    <concept_id>C4</concept_id>\n    \n    <concept_name>Intellectual
      Property</concept_name>\n\n    <concept_description>\n    Categories of Intellectual
      Property covered in the document\n    </concept_description>\n\n    <amount_of_extracted_items>This
      concept may have zero, one, or multiple extracted items.</amount_of_extracted_items>\n\n    <extracted_item_examples>\n        <extracted_item_example>\n        custom_data={}
      content=''patents''\n        </extracted_item_example>\n        <extracted_item_example>\n        custom_data={}
      content=''source code''\n        </extracted_item_example>\n    </extracted_item_examples>\n\n    <extracted_item_type>str
      (must be exactly as specified)</extracted_item_type>\n</concept>\n\n</concepts>\n\n<document_text>\nThe
      purpose of this Agreement is to protect the confidential information that may
      be disclosed between the parties during discussions and engagements regarding
      potential business collaborations and partnerships.\n\n2. Definition of Confidential
      Information:\n\nFor purposes of this Agreement, \"Confidential Information\"
      means any and all non-public information, conveyed in all forms, whether in
      oral, written, electronic, or other form or media, whether or not marked, designated,
      or otherwise identified as \"confidential,\" that has been or may be disclosed
