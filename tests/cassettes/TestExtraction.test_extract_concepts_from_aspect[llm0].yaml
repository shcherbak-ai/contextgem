      tags.\n</output_constraints>\n\n<answer_format>\nANSWER FORMAT (MANDATORY):\n[\n    {\n        \"concept_id\":
      str,\n        \"extracted_items\": [\n            ...\n        ],\n    },\n    ...\n]\n</answer_format>\n\n<concepts>\nCONCEPTS:\n<concept
      id=\"C0\">\n    <concept_id>C0</concept_id>\n    \n    <concept_name>Intellectual
      Property</concept_name>\n\n    <concept_description>\n    Categories of Intellectual
      Property covered in the document\n    </concept_description>\n\n    <amount_of_extracted_items>This
      concept may have zero, one, or multiple extracted items.</amount_of_extracted_items>\n\n    <extracted_item_examples>\n        <extracted_item_example>\n        custom_data={}
      content=''patents''\n        </extracted_item_example>\n        <extracted_item_example>\n        custom_data={}
      content=''source code''\n        </extracted_item_example>\n    </extracted_item_examples>\n\n    <extracted_item_type>str
      (must be exactly as specified)</extracted_item_type>\n</concept>\n\n</concepts>\n\n<document_text>\n2.
      Definition of Confidential Information:\n\nFor purposes of this Agreement, \"Confidential
      Information\" means any and all non-public information, conveyed in all forms,
      whether in oral, written, electronic, or other form or media, whether or not
      marked, designated, or otherwise identified as \"confidential,\" that has been
      or may be disclosed to, accessed by, or observed by Receiving Party, which (i)
      has actual or potential economic value by virtue of not being generally known
      to, and not being readily ascertainable by proper means by, other persons who
      can obtain economic value from its disclosure or use, or (ii) is subject to
      reasonable efforts by Disclosing Party to maintain its secrecy and confidentiality.\n\nConfidential
      Information includes, but is not limited to, the following categories: (1) business
      information (business plans, strategies, and models), (2) technical information
      (technical specifications and documentation, research and development activities),
      (3) customer and market information (customer lists and contact information,
      sales histories and patterns), (4) personnel and internal information (employee
