      \   -- For concepts that have <available_labels></available_labels> tags: if
      multiple labels apply to the same instance or context, include them all in a
      single extracted item with multiple labels in the \\\"labels\\\" array (e.g.,
      {\\\"labels\\\": [\\\"label1\\\", \\\"label2\\\"]}). Only create multiple extracted
      items if there are genuinely distinct instances or contexts that warrant separate
      classification.\\n    -- For concepts that do not have <available_labels></available_labels>
      tags: if multiple items are found for a concept, include each as a separate
      entry within the \\\"extracted_items\\\" array.\\n</extracted_item_handling_rules>\\n\\n<output_constraints>\\n-
      No additional text:\\n    -- Do not include any headers, explanations, or text
      outside of the JSON array.\\n    -- Do not wrap your JSON response in backticks
      or any other formatting characters.\\n</output_constraints>\\n\\n<answer_format>\\nANSWER
      FORMAT (MANDATORY):\\n[\\n    {\\n        \\\"concept_id\\\": str,\\n        \\\"extracted_items\\\":
      [\\n            ...\\n        ],\\n    },\\n    ...\\n]\\n</answer_format>\\n\\n<concepts>\\nCONCEPTS:\\n<concept
      id=\\\"C0\\\">\\n    <concept_id>C0</concept_id>\\n    \\n    <concept_name>Business
      Information</concept_name>\\n\\n    <concept_description>\\n    Categories of
      Business Information\\n    </concept_description>\\n\\n    <amount_of_extracted_items>This
      concept may have zero, one, or multiple extracted items.</amount_of_extracted_items>\\n\\n
      \   <extracted_item_type>str (must be exactly as specified)</extracted_item_type>\\n</concept>\\n\\n</concepts>\\n\\n<document_text>\\nThe
      purpose of this Agreement is to protect the confidential information that may
      be disclosed between the parties during discussions and engagements regarding
      potential business collaborations and partnerships.\\n\\nFor purposes of this
      Agreement, \\\"Confidential Information\\\" means any and all non-public information,
      conveyed in all forms, whether in oral, written, electronic, or other form or
      media, whether or not marked, designated, or otherwise identified as \\\"confidential,\\\"
      that has been or may be disclosed to, accessed by, or observed by Receiving
      Party, which (i) has actual or potential economic value by virtue of not being
      generally known to, and not being readily ascertainable by proper means by,
      other persons who can obtain economic value from its disclosure or use, or (ii)
      is subject to reasonable efforts by Disclosing Party to maintain its secrecy
      and confidentiality.\\n\\nConfidential Information includes, but is not limited
      to, the following categories: (1) business information (business plans, strategies,
      and models), (2) technical information (technical specifications and documentation,
      research and development activities), (3) customer and market information (customer
      lists and contact information, sales histories and patterns), (4) personnel
      and internal information (employee lists and contact information, employment
      agreements and personnel files), (5) intellectual property (trade secrets and
      know-how, patents and patent applications, copyrights and copyright applications,
      trademarks and trademark applications), (6) strategic information (merger and
      acquisition plans, competitive analyses and strategies). Software code shall
      also be included into the confidential information.\\n\\nConfidential Information
      shall not include information that: (a) is or becomes generally available to
      the public other than as a result of disclosure by Receiving Party or its Representatives;
      (b) was available to Receiving Party on a non-confidential basis prior to its
      disclosure by Disclosing Party; (c) becomes available to Receiving Party on
      a non-confidential basis from a person other than Disclosing Party who is not
      otherwise bound by a confidentiality obligation to Disclosing Party; or (d)
      was independently developed by Receiving Party without reference to or use of
      any Confidential Information. The name of the dog of the Receiving Party is
      Bob.\\n\\nThe designation of information as Confidential Information shall not
      be determinative of whether such information constitutes a trade secret under
      applicable law. All Confidential Information shall remain the exclusive property
      of Disclosing Party, and Receiving Party shall have no rights, by license or
      otherwise, to use the Confidential Information except as expressly provided
      herein.\\n\\na. Maintain the confidentiality of the Confidential Information
      and not disclose it to any third party without the prior written consent of
      the Disclosing Party.\\n\\nb. Use the Confidential Information solely for the
      purpose of evaluating or engaging in the potential business collaboration.\\n\\nc.
      Take all necessary precautions to protect the confidentiality of the Confidential
      Information, which shall be no less than the precautions it takes to protect
      its own confidential information.\\n\\nConfidential Information does not include
      information that:\\n\\na. Is or becomes publicly known through no wrongful act
      of the Receiving Party.\\n\\nb. Is already known to the Receiving Party at the
      time of disclosure.\\n\\nc. Is lawfully received from a third party without
      breach of this Agreement.\\n\\nd. Is independently developed by the Receiving
      Party without use of or reference to the Disclosing Party's Confidential Information.\\n\\nUpon
      termination of this Agreement or upon request, the Receiving Party shall return
      all materials containing Confidential Information to the Disclosing Party or
      destroy them, at the Disclosing Party's discretion.\\n\\nNothing in this Agreement
      shall be construed as granting any rights to the Receiving Party, by license
      or otherwise, to any of the Disclosing Party\u2019s Confidential Information,
