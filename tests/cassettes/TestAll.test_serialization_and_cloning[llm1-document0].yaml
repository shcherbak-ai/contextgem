      int or null\n}\n    </expected_structure>\n\n    <amount_of_extracted_items>This
      concept may have zero or one extracted item, never multiple items.</amount_of_extracted_items>\n\n    <extracted_item_examples>\n        <extracted_item_example>\n        custom_data={}
      content={''years'': 10}\n        </extracted_item_example>\n        <extracted_item_example>\n        custom_data={}
      content={''years'': None}\n        </extracted_item_example>\n    </extracted_item_examples>\n\n    <extracted_item_type>dict
      (must be exactly as specified)</extracted_item_type>\n</concept>\n\n</concepts>\n\n<document_text>\nUpon
