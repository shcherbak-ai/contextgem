name: Daily Import Test

on:
  schedule:
    - cron: '0 0 * * *'  # Run daily at midnight UTC
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: read

jobs:
  import-test:
    # The latest release with the latest versions of its dependencies, as a new
    # install gets them: on one Python version, read from .python-version.
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Without the token in .git/config, where checkout leaves it for the later
      # steps, which push nothing
      - name: Check out .python-version
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          sparse-checkout: .python-version
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Set up Python from .python-version
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: .python-version

      - name: Install contextgem from PyPI
        run: |
          python -m pip install --upgrade pip
          pip install contextgem

      - name: Test import
        run: |
          python -c "import contextgem; print(f'Successfully imported contextgem version {contextgem.__version__}')"
