name: Docling fixtures

# Converts the fixtures of the tests of the docling extra with full Docling, on
# the CPU-only PyTorch, and checks that ContextGem makes the same paragraphs from
# them as from the committed Docling documents (dev/docling_fixtures.py). The
# tests convert the fixtures in the formats that need no models themselves, with
# the torch-free docling-slim of the dev group. A PDF file needs the models of
# Docling, which only this workflow runs (and their OCR, for a scanned one), as
# do an image file and a Google Books package; an audio or a video file the speech
# recognition of Docling (Whisper) and ffmpeg; an email, OpenDocument file or XBRL
# report packages that the dev group does not have; and a legacy Office (DOC, XLS,
# PPT) or RTF file LibreOffice. This workflow installs LibreOffice and ffmpeg, and
# the script the rest. It runs when the version of Docling can change (uv.lock) or
# the converter does, and weekly with the latest Docling, to find its changes
# before an upgrade.

on:
  push:
    branches: [ main, dev ]
    paths:
      - "uv.lock"
      - "contextgem/internal/converters/**"
      - "tests/other_files/docling/**"
      - "dev/docling_fixtures.py"
      - ".github/workflows/docling-fixtures.yml"
  pull_request:
    branches: [ main, dev ]
    paths:
      - "uv.lock"
      - "contextgem/internal/converters/**"
      - "tests/other_files/docling/**"
      - "dev/docling_fixtures.py"
      - ".github/workflows/docling-fixtures.yml"
  schedule:
    # Mondays, with the latest Docling
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  # Give HuggingFace Hub downloads more headroom before timing out, so a slow
  # CDN response is retried rather than failing the cold-cache model fetch.
  HF_HUB_DOWNLOAD_TIMEOUT: "30"
  UV_VERSION: "0.13.5"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python from .python-version
        run: uv python install

      # Fabric, for the task. The script installs ContextGem with full Docling
      # in a throwaway environment of its own.
      - name: Install dependencies
        run: uv sync --locked

      # LibreOffice, with which Docling converts the legacy Office and RTF files
      # (DOC, XLS, PPT, RTF) into DOCX, XLSX and PPTX: Writer, Calc and Impress,
      # without the packages that they only recommend; and ffmpeg, with which
      # Whisper reads the audio and video files, and Docling the frames of a video
      - name: Install LibreOffice and ffmpeg
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y --no-install-recommends
          libreoffice-writer libreoffice-calc libreoffice-impress ffmpeg

      # The layout, table and OCR models of Docling, about 0.5 GB, and the small
      # model of Whisper, about 0.5 GB
      - name: Cache the models of Docling
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/whisper
          key: docling-models-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            docling-models-${{ runner.os }}-

      - name: Check the Docling documents of the fixtures
        run: >-
          uv run fab docling-fixtures
          --docling-version ${{ github.event_name == 'schedule' && 'latest' || 'locked' }}
