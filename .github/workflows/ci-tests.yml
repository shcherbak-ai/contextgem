name: tests

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  # Give HuggingFace Hub downloads more headroom before timing out, so a slow
  # CDN response is retried rather than failing the cold-cache model fetch.
  HF_HUB_DOWNLOAD_TIMEOUT: "30"
  UV_VERSION: "0.13.1"

jobs:

  lint:
    # The checks of the pre-commit hooks, which read the versions of the tools
    # from uv.lock, as they do locally. Among them the package check (uv build
    # + twine check).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python from .python-version
        run: uv python install

      # --locked: fail when uv.lock does not match pyproject.toml, where a
      # plain sync would resolve again and run other versions of the tools.
      - name: Install dependencies
        run: uv sync --locked --all-groups

      # The development tools of package-lock.json, for the markdownlint-cli2
      # hook, with the Node of the runner (no install scripts: .npmrc)
      - name: Install the development tools of package.json
        run: npm ci --no-audit --no-fund

      # Without the check of the latest versions, which fails on a release of
      # the day, whatever the commit
      - name: Run pre-commit checks
        run: uv run pre-commit run --all-files
        env:
          SKIP: latest-versions

  prefetch-models:
    # Download the SaT model ONCE on a single runner and publish the warmed
    # HuggingFace cache for the test matrix to restore. Without this, the four
    # matrix jobs start with a cold cache simultaneously and download from
    # HuggingFace in parallel — `actions/cache` only writes in its post-job
    # step, so there is no shared cache to hit on the first run. Four concurrent
    # cold downloads from one runner IP pool is exactly what trips HF's 429 and
    # aborts pytest collection. Serializing the download here removes that race.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python from .python-version
        run: uv python install

      - name: Install dependencies
        # wtpsplit-lite + onnxruntime are core deps, so the default sync is
        # enough to import contextgem and load the SaT model.
        run: uv sync --locked

      - name: Cache HuggingFace models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ runner.os }}-v1
          restore-keys: |
            hf-models-${{ runner.os }}-

      - name: Pre-download SaT model (warm HF cache with retry)
        run: |
          for attempt in 1 2 3 4 5; do
            if uv run python -c "from contextgem.internal.utils import _load_sat_model; _load_sat_model('sat-3l-sm')"; then
              echo "SaT model cached successfully (attempt $attempt)."
              exit 0
            fi
            echo "::warning::SaT model download attempt $attempt failed (likely HF 429). Backing off..."
            sleep $((attempt * 15))
          done
          echo "::error::Failed to pre-download SaT model after 5 attempts."
          exit 1

  tests-with-vcr:

    # Wait for the single prefetch job to warm the shared HF cache before the
    # matrix fans out, so the four jobs restore the cache instead of racing to
    # download the model concurrently.
    needs: prefetch-models

    strategy:
      matrix:
        os: [ "ubuntu-latest" ]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    defaults:
      run:
        shell: bash

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    env:
      # .python-version pins the development interpreter. Without this, a
      # plain `uv run` rebuilds the environment on that pin, and every cell
      # of the matrix tests the same Python.
      UV_PYTHON: ${{ matrix.python-version }}

    steps:

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --all-groups --python ${{ matrix.python-version }}

      # Fails the cell when .python-version, not the matrix, chose the
      # interpreter the tests run on.
      - name: Check the tests run on Python ${{ matrix.python-version }}
        run: uv run python -c "import sys; found = '%d.%d' % sys.version_info[:2]; assert found == '${{ matrix.python-version }}', found"

      - name: Restore HuggingFace models cache
        # Restore the cache warmed by the `prefetch-models` job (same key). With
        # a warm cache, the model is read from disk and HuggingFace
        # HEAD-revalidation 429s are non-fatal, so the matrix never re-downloads
        # concurrently. SaT model files are Python-version-independent, so the
        # whole matrix shares one cache.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ runner.os }}-v1
          restore-keys: |
            hf-models-${{ runner.os }}-

      - name: Pre-download SaT model (cache-hit safety net)
        # Normally a no-op cache hit: the `prefetch-models` job already populated
        # the cache, and tests/base.py loads the SaT model at class-body
        # evaluation time (during pytest collection). This step only does real
        # work in the rare case the cache restore missed, where the retry/backoff
        # rides out HuggingFace rate limiting before collection runs.
        run: |
          for attempt in 1 2 3 4 5; do
            if uv run python -c "from contextgem.internal.utils import _load_sat_model; _load_sat_model('sat-3l-sm')"; then
              echo "SaT model cached successfully (attempt $attempt)."
              exit 0
            fi
            echo "::warning::SaT model download attempt $attempt failed (likely HF 429). Backing off..."
            sleep $((attempt * 15))
          done
          echo "::error::Failed to pre-download SaT model after 5 attempts."
          exit 1

      - name: Run coverage (with VCR)
        run: |
          uv run coverage run --source contextgem -m pytest --maxfail=1 --disable-warnings -v
          uv run coverage report -m
          uv run coverage xml -o coverage_quick.xml

      - name: Upload coverage artifact
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: coverage-data
          path: |
            coverage_quick.xml
          retention-days: 1

  tests-docling-floor:
    # The tests of Document.from_docling() with the lower bound of docling-core in
    # the docling extra, without Docling, where the matrix runs them with the
    # versions of uv.lock (dev/docling_floor.py).
    needs: prefetch-models
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python from .python-version
        run: uv python install

      # Fabric, for the task. The script creates an environment of its own.
      - name: Install dependencies
        run: uv sync --locked

      # The SaT model, which tests/base.py loads during collection, from the
      # cache of the `prefetch-models` job
      - name: Restore HuggingFace models cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ runner.os }}-v1
          restore-keys: |
            hf-models-${{ runner.os }}-

      - name: Run the Docling tests with the oldest docling-core allowed
        run: uv run fab docling-floor

  update-badge:
    needs: tests-with-vcr
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Download coverage artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: coverage-data

      - name: Extract coverage
        id: get_coverage
        run: |
          COVERAGE=$(python -c "import xml.etree.ElementTree as ET; print(round(float(ET.parse('coverage_quick.xml').getroot().attrib['line-rate'])*100))")
          echo "percentage=$COVERAGE" >> $GITHUB_OUTPUT
          # Determine badge color based on coverage percentage
          if [ $COVERAGE -ge 80 ]; then
            echo "color=success" >> $GITHUB_OUTPUT
          elif [ $COVERAGE -ge 60 ]; then
            echo "color=yellow" >> $GITHUB_OUTPUT
          else
            echo "color=critical" >> $GITHUB_OUTPUT
          fi

      - name: Update coverage badge
        uses: schneegans/dynamic-badges-action@28b0fa8bdeb46170ac397105ece0c1fe58f68910  # v1.9.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: daaee00e1dfff7a29ca10a922ec3becd
          filename: coverage.json
          label: coverage
          message: ${{ steps.get_coverage.outputs.percentage }}%
          color: ${{ steps.get_coverage.outputs.color }}
