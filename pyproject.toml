[project]
name = "contextgem"
version = "1.5.0"
description = "Extract structured data and insights from documents using LLMs and decision models"
authors = [{ name = "Sergii Shcherbak", email = "sergii@shcherbak.ai" }]
requires-python = ">=3.11,<3.15"
readme = "PYPI.md"
license = { text = "Apache-2.0" }
# Named, as the default pattern of the build backend (LICEN[CS]E*, in any case)
# also takes LICENSES.md and licenseal.review.toml, which are not licenses of
# the package
license-files = ["LICENSE", "NOTICE"]
maintainers = [{ name = "Shcherbak AI", email = "sergii@shcherbak.ai" }]
keywords = [
    "artificial-intelligence",
    "aspect-extraction",
    "automated-prompting",
    "concept-extraction",
    "content-extraction",
    "context-aware",
    "contextgem",
    "contract-analysis",
    "contract-automation",
    "contract-intelligence",
    "contract-management",
    "contract-parsing",
    "contract-review",
    "data-extraction",
    "decision-models",
    "document",
    "document-analysis",
    "document-extraction",
    "document-intelligence",
    "document-parsing",
    "document-pipeline",
    "document-processing",
    "document-qa",
    "document-understanding",
    "entity-extraction",
    "extraction-justifications",
    "extraction-pipeline",
    "fintech",
    "generative-ai",
    "information-extraction",
    "insights-extraction",
    "knowledge-extraction",
    "large-language-models",
    "legaltech",
    "llm",
    "llm-extraction",
    "llm-framework",
    "llm-library",
    "llm-reasoning",
    "low-code",
    "machine-learning",
    "model-routing",
    "multilingual",
    "multimodal",
    "neural-segmentation",
    "nlp",
    "no-prompt-engineering",
    "prompt-free",
    "question-answering",
    "reference-mapping",
    "semantic-analysis",
    "structured-data",
    "structured-data-extraction",
    "text-analysis",
    "text-classification",
    "text-processing",
    "topic-extraction",
    "unstructured-data",
    "zero-shot",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Legal Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Education",
    "Topic :: Office/Business",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: General",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "aiolimiter (>=1.2.1,<2.0.0)",
    "certifi (>=2026.10.19)", # the CA bundle that litellm and httpx verify TLS with: older ones trust a compromised CA (GHSA-6q48-6c7w-9gw2)
    "colorlog (>=6.9.0,<7.0.0)",
    "docstring-parser (>=0.17.0,<1.0.0)",
    "fastjsonschema (>=2.21.2,<3.0.0)",
    "genai-prices==0.1.13", # pin version due to frequent API changes
    "jinja2 (>=3.1.5,<4.0.0)",
    "langcodes[data] (>=3.5.1,<4.0.0)", # validates the BCP 47 tags of output_language and names their languages
    "litellm==1.105.2", # pin version due to occasional instability between patches and minor versions
    "openai==2.54.0", # pinned to the version tested with litellm (openai 1.100.0 once broke importing litellm 1.75.8)
    "pillow (>=11.3.0,<14.0.0)",
    "pydantic (>=2.10.6,<3.0.0)",
    "python-ulid (>=3.0.0,<5.0.0)",
    "tenacity (>=9.1.2,<10.0.0)", # required by litellm for retry logic
    "wtpsplit-lite (>=0.2.0,<0.3.0)",
    "onnxruntime (>=1.24.0) ; python_version >= '3.14'", # 3.14 wheels only available from 1.24+
]

[project.optional-dependencies]
docling = [
    "docling (>=2.141.0,<3.0.0)", # converts files into the Docling documents of Document.from_docling()
    "docling-core (>=2.103.0,<3.0.0)", # the Docling document model, which Document.from_docling() maps
]

[project.urls]
Homepage = "https://github.com/shcherbak-ai/contextgem"
Documentation = "https://contextgem.shcherbak.ai/"
"llms.txt" = "https://contextgem.shcherbak.ai/llms.txt"
Repository = "https://github.com/shcherbak-ai/contextgem.git"
"Bug Tracker" = "https://github.com/shcherbak-ai/contextgem/issues"
Changelog = "https://github.com/shcherbak-ai/contextgem/blob/main/CHANGELOG.md"
Security = "https://github.com/shcherbak-ai/contextgem/blob/main/SECURITY.md"
"Shcherbak AI" = "https://shcherbak.ai/"

[dependency-groups]
dev = [
    "bandit (>=1.8.3,<2.0.0)",
    "commitizen (>=4.5.1,<5.0.0)",
    "coverage (>=7.6.12,<8.0.0)",
    "deptry (>=0.23.0,<1.0.0)",
    "docling-core (>=2.103.0,<3.0.0)", # the docling extra, for its tests and docs: same range
    "docling-slim[convert-core,format-office,format-web] (>=2.141.0,<3.0.0)", # Docling without torch: converts the fixtures in the tests whose formats need no models, e.g. DOCX, PPTX, XLSX, HTML and Markdown (the lower bound of Docling in the docling extra)
    "fabric (>=3.2.0,<4.0.0)",
    "hypothesis (>=6.122.0,<7.0.0)",
    "interrogate (>=1.7.0,<2.0.0)",
    "omerta (>=0.1.0,<1.0.0)", # the hook that keeps the values of .env, e.g. the API keys of the tests, out of git
    "pre-commit (>=4.1.0,<5.0.0)",
    "pre-commit-hooks (>=6.0.0,<7.0.0)", # the hooks for whitespace, the ends of files, YAML and TOML, from uv.lock rather than installed by pre-commit
    "ty (>=0.0.88,<1.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "pytest-recording (>=0.13.4,<1.0.0)",
    "pytest-xdist (>=3.8.0,<4.0.0)",
    "python-dotenv (>=1.0.1,<2.0.0)",
    "ruff (>=0.17.1,<1.0.0)",
    "sphinx (>=9.0.4,<10.0.0)",
    "sphinx-autodoc-typehints (>=3.6.1,<4.0.0)",
    "sphinx-autobuild (>=2024.10.3,<2027.0.0)",
    "sphinx-book-theme (>=1.1.4,<2.0.0)",
    "sphinx-copybutton (>=0.5.2,<1.0.0)",
    "sphinx-design (>=0.6.1,<1.0.0)",
    "sphinx-llm (>=1.1.0,<2.0.0)",
    "sphinx-sitemap (>=2.6.0,<3.0.0)",
    "sphinxext-opengraph (>=0.9.1,<1.0.0)",
    "tethered (>=1.1.0,<2.0.0)",
    "twine>=6.2.0",
    "licenseal (>=1.0.1,<2.0.0)",
    "zizmor (>=1.31.1,<2.0.0)", # the hook that checks the security of the GitHub workflows
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
    "/contextgem",
    "/PYPI.md",
    "/LICENSE",
    "/NOTICE",
    "/pyproject.toml",
]

[tool.hatch.build.targets.wheel]
include = ["/contextgem"]

[tool.uv]
# A release enters uv.lock only a week after its upload, when a compromised one
# has been found and removed (litellm 1.107.0, 2026-10-21: in two hours)
exclude-newer = "7 days"

# Releases taken before the cooldown admits them, by decision of the maintainer:
# security fixes, and the maintainer's own releases whose wheel matches their
# tag. Each is dated at its upload: the latest-versions hook fails once the
# cooldown admits it, to remove the entry. The releases of Docling that allow
# Pillow 13, which fixes the advisories of Pillow 12 (2026-10-22), and omerta
# 0.1.0 (2026-10-25)
[tool.uv.exclude-newer-package]
docling = "2026-10-22T14:32:00Z"
docling-core = "2026-10-22T14:03:00Z"
docling-parse = "2026-10-22T14:54:00Z"
docling-slim = "2026-10-22T14:30:00Z"
omerta = "2026-10-25T08:26:00Z"

[tool.ruff]
line-length = 88
target-version = "py311"
indent-width = 4
exclude = [
    ".venv",
    "code_sample.py",
]

[tool.ruff.lint]
extend-select = ["E4", "E7", "E9", "F", "I", "B", "UP", "N", "SIM"]

[tool.ruff.lint.isort]
force-single-line = false
lines-after-imports = 2
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.per-file-ignores]
# ignore the above required-imports for usage examples
"dev/**" = ["I002"]
"**/__init__.py" = ["I002"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ty.terminal]
# Fail the check (exit code 1) on warning-level diagnostics as well
error-on-warning = true

[tool.ty.src]
# Skip demonstration code (usage examples, optional-dep comparisons, code samples).
exclude = [
    "dev/usage_examples",
    "code_sample.py",
]

[tool.pytest.ini_options]
addopts = "-vv -s"
log_cli = true
log_cli_level = "WARNING"

[tool.commitizen]
name = "cz_conventional_commits"
version = "1.5.0"
# Commitizen replaces the version on each line that the pattern after the colon
# finds: anchored, as `cff-version: 1.2.0` (the format of CITATION.cff) and
# comments that name versions must keep theirs
version_files = [
    "contextgem/__init__.py:__version__",
    "pyproject.toml:^version",
    "CITATION.cff:^version:",
]
tag_format = "v$version"
annotated_tag = true
# The hooks run after the version fields are rewritten and before the commit,
# which takes in every changed file (`git commit -a`). dev/date_release.py
# names the `## [Unreleased]` section of the changelog after the new version,
# with the day, and writes the day into CITATION.cff; the last hook checks both.
pre_bump_hooks = [
    "uv lock --no-upgrade",
    "git add uv.lock",
    "uv run python dev/date_release.py",
    "uv run pytest tests/test_changelog.py -q -p no:cacheprovider",
]

[tool.deptry]
extend_exclude = [
    ".venv",
    "dev/evals",
    "code_sample.py",
]

[tool.deptry.per_rule_ignores]
DEP002 = [
    "certifi",      # minimum version of the CA bundle that litellm and httpx verify TLS with
    "onnxruntime",  # constrained for Python 3.14 compat (transitive via wtpsplit-lite)
    "tenacity",     # required by litellm for retry logic
]
DEP003 = [
    "docutils",     # installed with sphinx, whose nodes docs/source/conf.py adds handlers for
    "invoke",       # required for development tasks
    "pydantic_core",  # the core of pydantic, installed with it at the version it pins
]
DEP004 = [
    "fabric",       # required for development tasks
]

[tool.interrogate]
ignore-init-method = true
ignore-init-module = true
ignore-nested-classes = true
ignore-overloaded-functions = true
fail-under = 100
# node_modules: KaTeX, of markdownlint-cli2, carries Python scripts of its own
exclude = [".venv", "node_modules", "docs", "dev/usage_examples", "code_sample.py"]
